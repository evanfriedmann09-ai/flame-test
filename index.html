     'An atom’s oxidation number goes from 0 to +2. It was…', ['reduced','oxidized','unchanged'], 1,
     'The number went up, which means the atom lost electrons: oxidized.'),
   B('Rule 1 is easy.',
     '<p>An element on its own, not combined with anything else, has an oxidation number of <b>0</b>.</p><p>So Fe, Cu, {O2} and {Cl2} all have oxidation number 0.</p>',
     'What is the oxidation number of O in {O2}?', ['−2','0','+2'], 1,
     '{O2} is an element on its own, so its oxidation number is 0.'),
   B('Rule 2: simple ions.',
     '<p>For a simple one-atom ion, the oxidation number equals <b>its charge</b>.</p><p>{Na^+} is +1, {Cl^-} is −1 and {Fe^3+} is +3.</p>',
     'What is the oxidation number of {Mg^2+}?', ['+2','0','−2'], 0,
     'A simple ion’s oxidation number is its charge, so {Mg^2+} is +2.'),
   B('Rule 3: the usual values.',
     '<p>Inside compounds, some atoms almost always have the same value:</p><ul><li>O is usually <b>−2</b></li><li>H is usually <b>+1</b></li><li>Group 1 metals (Na, K) are <b>+1</b></li><li>Group 2 metals (Mg, Ca) are <b>+2</b></li></ul>',
     'What is the usual oxidation number of oxygen in a compound?', ['+1','−1','−2','0'], 2,
     'Oxygen is usually −2 in compounds.'),
   B('Rule 4 ties it together.',
     '<p>All the oxidation numbers in a formula must <b>add up to its overall charge</b>.</p><p>For a neutral compound like {H2O}, they add to 0. For an ion like {SO4^2-}, they add to −2.</p>',
     'In {SO4^2-}, the oxidation numbers must add up to…', ['0','+6','−2'], 2,
     'They add up to the overall charge, and {SO4^2-} has a charge of −2.')
 ]},
 {id:'x21', title:'Finding oxidation numbers', sub:'Compounds and polyatomic ions', bites:[
   B('Watch me do one.',
     '<p>Find C in {CO2}.</p><ol><li>O is −2, and there are 2 of them: 2 × (−2) = −4.</li><li>The compound is neutral, so everything adds to 0.</li><li>C + (−4) = 0, so C = <b>+4</b>.</li></ol>',
     'What is the oxidation number of C in {CO2}?', ['+2','−4','+4'], 2,
     'The two oxygens give −4, so carbon must be +4 to reach a total of 0.'),
   B('Now with three elements.',
     '<p>Find S in {H2SO4}.</p><ol><li>H: 2 × (+1) = +2</li><li>O: 4 × (−2) = −8</li><li>S + 2 − 8 = 0, so S = <b>+6</b>.</li></ol>',
     'What is the oxidation number of S in {H2SO4}?', ['+6','+4','−2'], 0,
     '+2 from hydrogen and −8 from oxygen means sulfur must be +6 for a total of 0.'),
   B('Ions work the same way.',
     '<p>Find N in {NO3^-}. This time the total is the ion’s charge, −1.</p><ol><li>O: 3 × (−2) = −6</li><li>N + (−6) = −1</li><li>N = <b>+5</b></li></ol>',
     'What is the oxidation number of N in {NO3^-}?', ['+6','+5','−5','+7'], 1,
     'The oxygens give −6, and N − 6 = −1, so N = +5.'),
   B('Your turn!',
     '<p>Find Mn in {KMnO4}. Use the same steps: K is a Group 1 metal, so it’s +1. Each O is −2. The compound is neutral, so the total is 0.</p>',
     'What is the oxidation number of Mn in {KMnO4}?', ['+4','+8','+7','+6'], 2,
     'K is +1 and 4 O give −8. So +1 + Mn − 8 = 0, and Mn = +7.'),
   B('Two of the same atom? Divide.',
     '<p>Find Cr in {Cr2O7^2-}.</p><ol><li>O: 7 × (−2) = −14</li><li>Both Cr together: −2 + 14 = +12</li><li>Each Cr: 12 ÷ 2 = <b>+6</b></li></ol>',
     'What is the oxidation number of each Cr in {Cr2O7^2-}?', ['+12','+6','+7'], 1,
     'The two chromium atoms share +12, so each one is +6.')
 ]},
 {id:'x22', title:'Spotting redox', sub:'What is oxidized and what is reduced', bites:[
   B('Here’s the method.',
     '<p>Write the oxidation number of each element on both sides of the equation.</p><ul><li>Number <b>goes up</b>: that element was <b>oxidized</b>.</li><li>Number <b>goes down</b>: that element was <b>reduced</b>.</li></ul>',
     'An element goes from +3 on the left to 0 on the right. It was…', ['oxidized','reduced','neither'], 1,
     'The number went down, so the element gained electrons: reduced.'),
   B('Watch me do one.',
     '<p>{Mg + Cl2 → MgCl2}</p><p>Mg goes from 0 to +2: <b>oxidized</b>.<br>Cl goes from 0 to −1: <b>reduced</b>.</p>',
     'In this reaction, what is reduced?', ['Mg','{Cl2}','{MgCl2}'], 1,
     'Chlorine’s oxidation number drops from 0 to −1, so {Cl2} is reduced.'),
   B('A bigger one.',
     '<p>Making iron from its ore: {2Fe2O3 + 3C → 4Fe + 3CO2}</p><p>Fe goes from +3 to 0: reduced.<br>C goes from 0 to +4: oxidized.<br>O stays at −2 the whole time.</p>',
     'Which element is oxidized?', ['Fe','O','C'], 2,
     'Carbon’s oxidation number rises from 0 to +4, so carbon is oxidized.'),
   B('Not everything is redox.',
     '<p>In {NaCl + AgNO3 → AgCl + NaNO3}, every element keeps the same oxidation number. Na stays +1, Ag stays +1, Cl stays −1.</p><p>If no oxidation numbers change, it is <b>not a redox reaction</b>.</p>',
     'If no oxidation numbers change in a reaction, then…', ['it is a redox reaction','it is not a redox reaction','everything was oxidized'], 1,
     'Redox needs electrons to move, which shows up as oxidation numbers changing.')
 ]},
 {id:'x5', title:'Writing half-reactions', sub:'Splitting a redox reaction in two', bites:[
   B('Let’s split a reaction in half.',
     '<p>A <b>half-reaction</b> shows just one side of a redox reaction, with the electrons written in.</p><p>In an <b>oxidation</b> half, electrons are lost, so they appear on the <b>right</b>:<br>{Zn → Zn^2+ + 2e^-}</p>',
     'In an oxidation half-reaction, electrons appear…', ['on the left','on the right','on both sides'], 1,
     'Oxidation loses electrons, so they show up as a product on the right.'),
   B('Now the other half.',
     '<p>In a <b>reduction</b> half, electrons are gained, so they appear on the <b>left</b>:<br>{Cu^2+ + 2e^- → Cu}</p>',
     'Which of these is a reduction half-reaction?', ['{Zn → Zn^2+ + 2e^-}','{Cu^2+ + 2e^- → Cu}','{Mg → Mg^2+ + 2e^-}'], 1,
     'Electrons are on the left, being gained, so this is a reduction.'),
   B('How many electrons?',
     '<p>The number of electrons equals the change in oxidation number. Al goes from 0 to +3, so it loses 3:<br>{Al → Al^3+ + 3e^-}</p><p>Check: charge on each side matches. Left is 0. Right is +3 + (−3) = 0.</p>',
     'Fill in the blank: Fe → {Fe^3+} + ___ electrons', ['2','3','1'], 1,
     'Fe goes from 0 to +3, so it loses 3 electrons.'),
   B('Make the electrons match.',

function pos(z){if(z===1)return[1,1];if(z===2)return[1,18];if(z<=10)return[2,z<=4?z-2:z+8];if(z<=18)return[3,z<=12?z-10:z];return[4,z-18]}
const ORD=[['1s',2],['2s',2],['2p',6],['3s',2],['3p',6],['4s',2],['3d',10],['4p',6]];
function config(z){
  let left=z,parts=[];for(const[o,c]of ORD){if(left<=0)break;const t=Math.min(c,left);parts.push([o,t]);left-=t}
  if(z===24||z===29){parts=parts.map(p=>p[0]==='4s'?['4s',1]:p[0]==='3d'?['3d',z===24?5:10]:p)}
  const full=parts.map(p=>p[0]+'^'+p[1]).join(' ');
  const gases=[[18,'[Ar]',5],[10,'[Ne]',3],[2,'[He]',1]];
  let short=full;for(const[g,lab,k]of gases){if(z>g){short=lab+' '+parts.slice(k).map(p=>p[0]+'^'+p[1]).join(' ');break}}
  return{full,short};
}
function valence(z){const[p,g]=pos(z);if(g<=2)return g;if(g>=13)return g===18&&z===2?2:g-10;return null}

function parseFormula(str){
  str=str.replace(/\s/g,'').replace(/·/g,'.').replace(/\*/g,'.');
  const parts=str.split('.');const total={};
  for(let part of parts){
    let mult=1;const m=part.match(/^(\d+)(.*)$/);if(m&&parts.length>1){mult=+m[1];part=m[2]}
    let i=0;
    function group(){const counts={};
      while(i<part.length){const ch=part[i];
        if(ch==='('||ch==='['){i++;const inner=group();if(part[i]!==')'&&part[i]!==']')throw'Missing a closing bracket';i++;const n=num();for(const k in inner)counts[k]=(counts[k]||0)+inner[k]*n}
        else if(ch===')'||ch===']'){return counts}
        else if(/[A-Z]/.test(ch)){let s=ch;i++;while(i<part.length&&/[a-z]/.test(part[i])){s+=part[i];i++}
          if(!(s in MASS))throw'“'+s+'” isn’t an element in this calculator';const n=num();counts[s]=(counts[s]||0)+n}
        else throw'Unexpected “'+ch+'”. Element symbols start with a capital letter';}
      return counts}
    function num(){let d='';while(i<part.length&&/\d/.test(part[i])){d+=part[i];i++}return d?+d:1}
    const c=group();if(i<part.length)throw'Unmatched closing bracket';
    for(const k in c)total[k]=(total[k]||0)+c[k]*mult;
  }
  if(!Object.keys(total).length)throw'Type a formula';
  return total;
}

const isDone=l=>!!S.done[l.id];

function level(xp=S.xp){let L=1;while(xp>=lvlXP(L+1))L++;return L}

 ...UNITS.map(u=>({id:'unit-'+u.id,name:u.name,desc:'Finish every lesson in '+u.name,sym:u.sym,c:u.c}))];

function award(xp,ctx={}){
  const before={lvl:level(),goal:todayXP()>=S.goal,badges:{...S.badges}};
  S.xp+=xp;const t=ds();S.days[t]=(S.days[t]||0)+xp;
  if(ctx.lesson||ctx.cp){const l=S.streak.last;if(l!==t){S.streak.count=(l===dayOff(-1))?S.streak.count+1:1;S.streak.last=t}S.streak.best=Math.max(S.streak.best,S.streak.count)}
  const give=id=>{if(!S.badges[id])S.badges[id]=t};
  if(ctx.lesson)give('first');
  if(ctx.perfect)give('perfect');
  if(ctx.bestCombo>=5)give('combo5');
  if(S.streak.count>=3)give('streak3');if(S.streak.count>=7)give('streak7');
  if(S.xp>=100)give('xp100');if(S.xp>=500)give('xp500');
  if(todayXP()>=S.goal)give('goal');
  if(ctx.lesson&&new Date().getHours()>=22)give('night');
  UNITS.forEach(u=>{if(unitDone(u)===u.lessons.length)give('unit-'+u.id)});
  save();
  return{lvlUp:level()>before.lvl?level():0,goalHit:!before.goal&&todayXP()>=S.goal,newBadges:BADGES.filter(b=>S.badges[b.id]&&!before.badges[b.id])};
}

  const cols=UNITS.map(u=>u.c).concat(['#E9A800']);const P=Array.from({length:140},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,r:Math.random()*6+4,c:cols[Math.random()*cols.length|0],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  const t0=performance.now();(function f(t){x.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(t-t0<2800)requestAnimationFrame(f);else{x.clearRect(0,0,innerWidth,innerHeight);cv.hidden=true}})(t0)}
function toast(msg){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}

const pick=a=>a[Math.random()*a.length|0];

 hello:['Ready to mix something up?','Let’s get bubbling.','A little chemistry a day keeps the confusion away.','I’m running on empty. Fill me up with XP!'],

function learnHTML(l,part){let h='';
  if(l.bites)return part==='all'?l.bites.map(b=>chem(b.html)).join(''):'';
  const A=()=>{let s=`<p class="lede">${chem(l.lede)}</p>`;if(l.diagram==='pe')s+=peDiagram();if(l.body)s+=chem(l.body);return s};
  const B=()=>{let s='';if(l.table)s+=`<div class="tbl"><table><thead><tr>${l.table.head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${l.table.rows.map(r=>`<tr>${r.map((c,i)=>`<td${i===0&&/^[\d.×°≈]+$/.test(c)?' class="num"':''}>${chem(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    if(l.diagram==='cell')s+=cellDiagram();if(l.sim)s+=simHTML();
    if(l.points)s+=`<h2>Key points</h2><ul class="points">${l.points.map(p=>`<li>${chem(p)}</li>`).join('')}</ul>`;
    if(l.analogy)s+=`<div class="analogy"><b>Way to think about it</b>${chem(l.analogy)}</div>`;return s};
  const C=()=>l.example?`<h2>Worked example</h2><div class="ex"><div class="q">${chem(l.example.q)}</div><ol>${l.example.steps.map(s=>`<li>${chem(s)}</li>`).join('')}</ol></div>`:'';
  if(part==='all')return A()+B()+C();return {A,B,C}[part]()}

/* ---------- hearts (shared across lessons) ---------- */
const HMAX=5,HREGEN=30*60*1000;
function regen(){if(typeof S.hearts!=='number')S.hearts=HMAX;if(S.hearts>=HMAX){S.hearts=HMAX;S.heartsAt=0;return}
  const now=Date.now();if(!S.heartsAt)S.heartsAt=now;const n=Math.floor((now-S.heartsAt)/HREGEN);
  if(n>0){S.hearts=Math.min(HMAX,S.hearts+n);S.heartsAt=S.hearts>=HMAX?0:S.heartsAt+n*HREGEN;save()}}
const nextHeartIn=()=>S.hearts>=HMAX?0:Math.max(0,S.heartsAt+HREGEN-Date.now());
const mmss=ms=>{const t=Math.ceil(ms/1000);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
function loseHeart(){regen();if(S.hearts>=HMAX)S.heartsAt=Date.now();S.hearts=Math.max(0,S.hearts-1);save()}
const usesHearts=()=>!INT&&!!SES&&(SES.kind==='lesson'||SES.kind==='cp');
const heartRow=()=>`<div class="hrow" aria-label="${S.hearts} of ${HMAX} hearts">${[...Array(HMAX)].map((_,i)=>`<span class="${i<S.hearts?'on':''}">${ic('heart',30,true)}</span>`).join('')}</div>`;
function heartsSheet(after){regen();const full=S.hearts>=HMAX;
  sheet(`<div class="fizzline">${fizz({mood:S.hearts?'idle':'sad',size:70,fill:Math.max(.1,S.hearts/HMAX)})}<div style="flex:1"><h3>${S.hearts?`You have ${S.hearts} heart${S.hearts>1?'s':''}`:'You’re out of hearts'}</h3>
   <p>${full?'Full! Each mistake in a lesson or checkpoint costs one heart.':`Next heart in <b id="hTimer">${mmss(nextHeartIn())}</b>. Or win them all back now in Heart Lab.`}</p></div></div>${heartRow()}
   <div class="btns">${full?'':`<button class="b3 wide" id="goLab">${ic('flask',20)} Play Heart Lab · 1 min</button>`}<button class="b3 ghost wide" data-close>${full?'Got it':'Not now'}</button></div>`);
  const g=$('#goLab');if(g)g.onclick=()=>{closeSheet();startHeartLab(()=>{closeSession();if(after)after()},()=>closeSession())};

/* Bite-size lesson cards: short screens with questions mixed in */
const txtLen=h=>h.replace(/<[^>]+>/g,'').length;
function lessonCards(l){const cards=[],bodyS=['Here’s how it works.','Keep going, you’ve got this.','Next bit.','This part matters.','Almost there.'];let bi=0;
  cards.push({say:pick(['New idea!','Let’s learn something new.','Here’s a fresh one.']),html:`<h1 class="ltitle">${l.title}</h1><p class="lede">${chem(l.lede)}</p>`});
  if(l.diagram==='pe')cards.push({say:'Look at this diagram.',html:peDiagram()});
  if(l.body){const blocks=chem(l.body).match(/<(p|h2|ol|ul)\b[^>]*>[\s\S]*?<\/\1>/g)||[chem(l.body)];let cur='',held='';
    blocks.forEach(b=>{if(/^<h2/.test(b)){if(cur){cards.push({say:bodyS[bi++%bodyS.length],html:cur});cur=''}held=b;return}
      const piece=held+b;held='';if(cur&&txtLen(cur)+txtLen(piece)>340){cards.push({say:bodyS[bi++%bodyS.length],html:cur});cur=piece}else cur+=piece});
    if(cur||held)cards.push({say:bodyS[bi++%bodyS.length],html:cur+held})}
  if(l.table)cards.push({say:'Here’s a quick reference. No need to memorize it all now.',html:`<div class="tbl"><table><thead><tr>${l.table.head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${l.table.rows.map(r=>`<tr>${r.map(c=>`<td>${chem(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`});
  if(l.diagram==='cell')cards.push({say:'Here’s what it looks like.',html:cellDiagram()});
  if(l.sim)cards.push({say:'Try it yourself! Tap the buttons and watch.',html:simHTML(),sim:true});
  if(l.points)for(let i=0;i<l.points.length;i+=2)cards.push({say:i===0?'Key points to remember.':'A couple more.',html:`<ul class="points">${l.points.slice(i,i+2).map(p=>`<li>${chem(p)}</li>`).join('')}</ul>`});
  if(l.analogy)cards.push({say:'Here’s a way to think about it.',html:`<div class="analogy">${chem(l.analogy)}</div>`,mood:'happy'});
  if(l.example)cards.push({say:'Watch me work one out.',html:`<div class="ex"><div class="q">${chem(l.example.q)}</div><ol>${l.example.steps.map(s=>`<li>${chem(s)}</li>`).join('')}</ol></div>`,mood:'think'});
  return cards.map(c=>Object.assign({t:'learn'},c))}

function startQuiz(kind,arg){let pool=[],u=null;
  if(kind==='cp'){regen();if(S.hearts<=0){heartsSheet(()=>startQuiz(kind,arg));return}}
  if(kind==='cp'){u=arg;u.lessons.forEach(l=>l.quiz.forEach((q,i)=>pool.push(l.id+'-'+i)))}
  else if(kind==='miss')pool=Object.keys(S.miss).filter(q=>byId(q.split('-')[0]));
  else if(kind==='intreview')LESSONS.forEach(l=>{if(isDone(l))l.quiz.forEach((q,i)=>pool.push(l.id+'-'+i))});

/* ---------- Le Châtelier simulator: N2 + 3H2 ⇌ 2NH3, ΔH = −92 kJ ---------- */
const KS=[2.5,0.5,0.1],TL=['Cool','Room temperature','Hot'];
let sim={a:1,h:3,n:0,t:1};
function equil(s){const K=KS[s.t];const Q=x=>(s.n+2*x)**2/((s.a-x)*(s.h-3*x)**3);
  let lo=-s.n/2+1e-9,hi=Math.min(s.a,s.h/3)-1e-9;
  for(let i=0;i<200;i++){const m=(lo+hi)/2;if(Q(m)<K)lo=m;else hi=m}
  const x=(lo+hi)/2;return{x,a:s.a-x,h:s.h-3*x,n:s.n+2*x}}
function simHTML(){return `<div class="sim" id="sim"><div class="eq f">N<sub>2</sub>(g) + 3H<sub>2</sub>(g) ⇌ 2NH<sub>3</sub>(g) &nbsp; ΔH = −92 kJ</div>
  <div class="bars"><div class="bar"><span class="v" id="vA"></span><div class="fill" id="bA"></div></div><div class="bar"><span class="v" id="vH"></span><div class="fill" id="bH"></div></div><div class="bar"><span class="v" id="vN"></span><div class="fill" id="bN"></div></div></div>
  <div class="barlabels f"><span>[N<sub>2</sub>]</span><span>[H<sub>2</sub>]</span><span>[NH<sub>3</sub>]</span></div>
  <div class="controls"><button data-s="addA">Add N₂</button><button data-s="addH">Add H₂</button><button data-s="remN">Remove NH₃</button><button data-s="addN">Add NH₃</button><button data-s="press">Squeeze (½ volume)</button><button data-s="heat">Heat up</button><button data-s="cool">Cool down</button><button data-s="cat">Add catalyst</button><button data-s="reset">Reset</button></div>
  <div class="status" id="simStatus" aria-live="polite">Pick a change and watch the system respond. Values are illustrative, in mol/L.</div>
  <div class="readout" id="simRead"></div></div>`}
function bindSim(){
  const el=$('#sim');if(!el)return;
  let cur=equil(sim);sim={a:cur.a,h:cur.h,n:cur.n,t:sim.t};
  const draw=s=>{const mx=Math.max(4,s.a,s.h,s.n)*1.05;[['A','a'],['H','h'],['N','n']].forEach(([k,f])=>{$('#b'+k).style.height=(s[f]/mx*100)+'%';$('#v'+k).textContent=s[f].toFixed(2)});
    const Q=s.n**2/(s.a*s.h**3);$('#simRead').innerHTML=`<span>Q = ${Q.toFixed(3)}</span><span>K = ${KS[s.t]}</span><span>${TL[s.t]}</span>`};
  draw(sim);
  let timer;
  el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{
    clearTimeout(timer);const s=b.dataset.s;let msg='',dir=null;
    if(s==='reset'){sim={a:1,h:3,n:0,t:1};const e=equil(sim);sim={...sim,a:e.a,h:e.h,n:e.n};draw(sim);$('#simStatus').textContent='Reset to equilibrium at room temperature.';return}
    if(s==='cat'){$('#simStatus').innerHTML='<b>No shift.</b> A catalyst speeds up the forward and reverse reactions equally. Equilibrium is reached sooner, but the amounts stay the same.';return}
    if(s==='addA'){sim.a+=1;msg='You added N₂. The system uses some up'}
    if(s==='addH'){sim.h+=1.5;msg='You added H₂. The system uses some up'}
    if(s==='addN'){sim.n+=1;msg='You added NH₃. The system uses some up'}
    if(s==='remN'){sim.n=sim.n*0.3;msg='You removed NH₃. The system makes more to replace it'}
    if(s==='press'){sim.a*=2;sim.h*=2;sim.n*=2;msg='All concentrations doubled. The side with fewer gas molecules is favoured (2 vs 4)'}
    if(s==='heat'){if(sim.t===2){$('#simStatus').textContent='Already at the hottest setting.';return}sim.t++;msg='Heat is a product here, so adding heat favours the reverse reaction. K gets smaller'}
    if(s==='cool'){if(sim.t===0){$('#simStatus').textContent='Already at the coolest setting.';return}sim.t--;msg='Removing heat favours the exothermic forward reaction. K gets bigger'}
    draw(sim);
    const e=equil(sim);dir=e.x>1e-6?'right → more NH₃':e.x<-1e-6?'left → more N₂ and H₂':'nowhere';
    $('#simStatus').innerHTML=`${msg}. <b>Shifts ${dir}.</b>`;
    timer=setTimeout(()=>{sim={a:e.a,h:e.h,n:e.n,t:sim.t};draw(sim)},700);
  });
}

const KEYK='flametest-api-key',MODELK='flametest-model';
const getKey=()=>{try{return localStorage.getItem(KEYK)||''}catch(e){return''}};
const setKey=k=>{try{k?localStorage.setItem(KEYK,k):localStorage.removeItem(KEYK)}catch(e){}};

async function toB64(file){
  try{const bmp=await createImageBitmap(file);const sc=Math.min(1,1568/Math.max(bmp.width,bmp.height));const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);return{type:'image/jpeg',data:cv.toDataURL('image/jpeg',.85).split(',')[1]}}
  catch(e){return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res({type:file.type||'image/jpeg',data:String(fr.result).split(',')[1]});fr.onerror=()=>rej({code:'image_rejected'});fr.readAsDataURL(file)})}}
async function apiSample(input,opts={}){
  const key=getKey();if(!key)throw{code:'no_key'};
  const messages=(typeof input==='string'?[{role:'user',content:input}]:input).map(m=>({role:m.role,content:m.content}));
  if(opts.images&&opts.images.length){const last=messages[messages.length-1],blocks=[];
    for(const f of opts.images){const b=await toB64(f);blocks.push({type:'image',source:{type:'base64',media_type:b.type,data:b.data}})}
    blocks.push({type:'text',text:last.content});last.content=blocks}
  let res;
  try{res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:opts.signal,headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:opts.modelTier==='quick'?'claude-haiku-5-5':getModel(),max_tokens:1200,stream:true,messages})})}
  catch(e){throw{code:e&&e.name==='AbortError'?'cancelled':'network'}}
  if(!res.ok){let msg='';try{const j=await res.json();msg=(j.error&&j.error.message)||''}catch(e){}
    const st=res.status;throw{code:st===401||st===403?'bad_key':st===429?'rate_limited':/credit|balance|billing/i.test(msg)?'no_credit':/image/i.test(msg)?'image_rejected':/too long|too large/i.test(msg)||st===413?'prompt_too_large':st===404&&/model/i.test(msg)?'bad_model':'upstream_error',message:msg}}
  const rd=res.body.getReader(),dec=new TextDecoder();let buf='',text='';
  try{for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line.startsWith('data:'))continue;
      let ev;try{ev=JSON.parse(line.slice(5))}catch(e){continue}
      if(ev.type==='content_block_delta'&&ev.delta&&ev.delta.type==='text_delta'){text+=ev.delta.text;opts.onText&&opts.onText({text,delta:ev.delta.text})}
      else if(ev.type==='error')throw{code:/overloaded/i.test(ev.error&&ev.error.type||'')?'rate_limited':'upstream_error',text}}}}
  catch(e){if(e&&e.code)throw e;throw{code:e&&e.name==='AbortError'?'cancelled':'network',text}}
  if(!text)throw{code:'empty_completion'};return{text,truncated:false}}

  if(!/^sk-ant-/.test(k)){er.hidden=false;er.textContent='That doesn’t look like an Anthropic key. It should start with sk-ant-.';return}setKey(k);toast('Key saved');route()}}
let SAMPLE=apiSample,SAMPLE_READY=true,IMG_OK=true,CHAT_CTL=null,CHAT_BUSY=false,CHAT_IMG=null,CHAT_PREFILL='';
const COURSE_BRIEF=UNITS.map(u=>u.name+' ('+u.lessons.map(l=>l.title).join(', ')+')').join('; ');
function tutorBrief(extra){const cur=current();return `You are Fizz, a cheerful cartoon flask who tutors a high school student in Ontario Grade 12 College Chemistry (SCH4C). He never took Grade 11 chemistry, so explain from the ground up in plain, friendly language.
Rules: keep answers short (under 150 words) unless he asks for more. For calculations, go step by step and show units. Write formulas with Unicode subscripts and superscripts (H₂O, SO₄²⁻, Na⁺). Use **bold** for key terms and short "- " bullet lists when helpful; no tables, no headings. End with a quick check-for-understanding question only when it helps. If he shares a homework photo, help him understand the method rather than only giving the final answer. If a question is not about chemistry, answer briefly and kindly steer back. Never make up facts; say so if unsure.
Course units: ${COURSE_BRIEF}.
${cur?`He is currently on the lesson "${cur.title}" in ${cur.unit.name}.`:''}${extra?'\n'+extra:''}`}
function sampleErr(e){const c=e&&e.code;
  if(c==='no_key')return'Add your Anthropic API key first.';
  if(c==='bad_key')return'That API key didn’t work. Check it in Profile → Claude API key.';
  if(c==='no_credit')return'Your Anthropic account is out of credit. Top up at console.anthropic.com.';
  if(c==='bad_model')return'That Claude model isn’t available on your key. Switch Fizz’s brain in Profile.';
  if(c==='network')return'You’re offline. Fizz needs internet; lessons still work offline.';
  if(['not_granted','not_declared','capability_disabled','capability_removed','sampling_disabled'].includes(c))return'Fizz needs permission to use Claude. Open this page’s Permissions menu and allow it, then try again.';
  if(c==='rate_limited'||c==='queue_overflow')return'Lots of questions at once. Wait a minute, then ask again.';
  if(c==='session_expired')return'Your Claude sign-in expired. Reload the page and try again.';
  if(c==='prompt_too_large')return'This chat got too long for me. Tap “New chat” and ask again.';
  if(c==='images_unavailable'||c==='image_rejected')return'I couldn’t read that photo. Try a clearer picture, or type the question.';
  if(c==='refused')return'I can’t help with that one. Try asking it another way.';
  return'I couldn’t reach Claude just now. Check your connection and try again.'}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function md(t){let s=esc(t);
  s=s.replace(/```[a-z]*\n?([\s\S]*?)```/g,(m,c)=>'<pre>'+c.replace(/\n$/,'')+'</pre>');
  s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>').replace(/`([^`\n]+)`/g,'<code>$1</code>');
  const out=[];let list=null;
  s.split('\n').forEach(line=>{const ul=line.match(/^\s*[-•*]\s+(.*)/),ol=line.match(/^\s*\d+[.)]\s+(.*)/),hd=line.match(/^#{1,4}\s+(.*)/);
    if(ul||ol){const tag=ul?'ul':'ol';if(!list||list.tag!==tag){list&&out.push('</'+list.tag+'>');list={tag};out.push('<'+tag+'>')}out.push('<li>'+(ul||ol)[1]+'</li>');return}
    if(list){out.push('</'+list.tag+'>');list=null}
    if(hd)out.push('<p><b>'+hd[1]+'</b></p>');else if(line.trim())out.push('<p>'+line+'</p>')});
  list&&out.push('</'+list.tag+'>');return out.join('')}

function chatSuggestions(){const cur=current(),l=cur||LESSONS[0];const base=[`Explain ${l.title.toLowerCase()} like I’m new to chemistry`,'Quiz me with one question on what I’m learning','How do I balance Fe + O₂ → Fe₂O₃?','What’s the difference between a mole and molar mass?'];
  return base}
function viewAsk(){const u=accentUnit();
  if(!S.chat)S.chat=[];
  const avail=!!getKey();
  return `<div class="col chat" style="--c:${u.c};--on:${u.light?'#1a1405':'#fff'}">
  <div class="chathead"><div class="fizzline" style="align-items:center">${fizz({mood:'happy',size:64,fill:.7})}<div style="flex:1"><h1 style="font-size:clamp(24px,4vw,32px)">Ask Fizz</h1><p class="small" style="margin:2px 0 0;font-family:var(--body)">Any chemistry question${IMG_OK?', or snap your homework':''}. Powered by Claude.</p></div>
  ${S.chat.length?'<button class="b3 ghost" id="newChat" style="padding:9px 12px;font-size:12px">New chat</button>':''}</div></div>
  ${!avail?keyCard():''}
  <div class="msgs" id="msgs" aria-live="polite">${S.chat.length?S.chat.map(msgHTML).join(''):`<div class="m a">${fizz({mood:'idle',size:40,fill:.6})}<div class="bub"><p>Hi! I’m Fizz. Ask me anything from SCH4C: naming compounds, mole calculations, organic structures, redox… I’ll keep it simple.</p></div></div>
   <div class="sugg">${chatSuggestions().map(s=>`<button data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div>`}</div>
  <form class="composer" id="composer" autocomplete="off">
   <div id="imgPrev" hidden></div>
   <div class="crow">
    ${IMG_OK?`<label class="cbtn" for="chatImg" title="Add a photo">${ic('camera',24)}<span class="sr">Add a photo</span></label><input type="file" id="chatImg" accept="image/*" hidden>`:''}
    <label for="chatIn" class="sr">Your question</label>
    <textarea id="chatIn" rows="1" placeholder="Ask a chemistry question" ${avail?'':'disabled'}>${esc(CHAT_PREFILL)}</textarea>
    <button class="cbtn send" id="chatSend" type="submit" aria-label="Send" ${avail?'':'disabled'}>${ic('send',22)}</button>
   </div></form></div>`}
function msgHTML(m){if(m.r==='u')return `<div class="m u">${m.img?`<span class="imgtag">${ic('camera',16)} Photo</span>`:''}${esc(m.t).replace(/\n/g,'<br>')}</div>`;
  return `<div class="m a">${fizz({mood:m.err?'sad':'idle',size:40,fill:.6})}<div class="bub${m.err?' err':''}">${md(m.t)}</div></div>`}
function bindAsk(){bindKeyCard();CHAT_PREFILL='';
  const ta=$('#chatIn'),msgs=$('#msgs');if(!ta)return;
  const grow=()=>{ta.style.height='auto';ta.style.height=Math.min(140,ta.scrollHeight)+'px'};grow();ta.oninput=grow;
  ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(pointer:fine)').matches){e.preventDefault();$('#composer').requestSubmit()}};
  document.querySelectorAll('.sugg [data-s]').forEach(b=>b.onclick=()=>{ta.value=b.dataset.s;$('#composer').requestSubmit()});
  const nc=$('#newChat');if(nc)nc.onclick=()=>{if(CHAT_CTL)CHAT_CTL.abort();S.chat=[];save();route()};
  const fi=$('#chatImg');if(fi)fi.onchange=()=>{const f=fi.files[0];if(!f)return;CHAT_IMG=f;const url=URL.createObjectURL(f);const p=$('#imgPrev');p.hidden=false;
    p.innerHTML=`<div class="thumb"><img src="${url}" alt="Your photo"><button type="button" id="rmImg" aria-label="Remove photo">${ic('x',16)}</button></div>`;$('#rmImg').onclick=()=>{CHAT_IMG=null;fi.value='';p.hidden=true;p.innerHTML=''}};
  $('#composer').onsubmit=e=>{e.preventDefault();if(CHAT_BUSY){if(CHAT_CTL)CHAT_CTL.abort();return}const q=ta.value.trim();if(!q&&!CHAT_IMG)return;sendChat(q||'Can you help me with this?')};
  scrollChat(true);if(!S.chat.length&&!('ontouchstart' in window))ta.focus()}
function scrollChat(instant){const last=$('#msgs')&&$('#msgs').lastElementChild;if(last)last.scrollIntoView({block:'end',behavior:instant||RM?'auto':'smooth'})}
async function sendChat(q){if(!SAMPLE)return;const img=CHAT_IMG;CHAT_IMG=null;
  S.chat.push({r:'u',t:q,img:!!img});
  const hist=S.chat.filter(m=>!m.err).slice(-12);
  const input=hist.map((m,i)=>({role:m.r==='u'?'user':'assistant',content:(i===0&&m.r==='u'?tutorBrief()+'\n\nStudent: ':'')+(m.img?'[shared a photo] ':'')+m.t}));
  if(input[0].role!=='user'){input.shift();input[0].content=tutorBrief()+'\n\nStudent: '+input[0].content}
  route();const msgs=$('#msgs');
  msgs.insertAdjacentHTML('beforeend',`<div class="m a" id="live">${fizz({mood:'think',size:40,fill:.6})}<div class="bub"><p class="typing"><span></span><span></span><span></span></p></div></div>`);scrollChat();
  const bub=$('#live .bub'),send=$('#chatSend');CHAT_BUSY=true;send.innerHTML=ic('stop',20,true);send.setAttribute('aria-label','Stop');send.classList.add('stop');$('#chatIn').value='';
  CHAT_CTL=new AbortController();let text='',err=null,lastPaint=0;
  try{const r=await SAMPLE(input,{cache:false,signal:CHAT_CTL.signal,images:img?[img]:undefined,onText:({text:t})=>{text=t;const n=performance.now();if(n-lastPaint>60){lastPaint=n;bub.innerHTML=md(t);scrollChat(true)}}});text=r.text}
  catch(e){if(e&&e.text)text=e.text;if(!(e&&e.code==='cancelled'))err=e}
  CHAT_BUSY=false;CHAT_CTL=null;
  if(text)S.chat.push({r:'a',t:text});
  if(err)S.chat.push({r:'a',t:sampleErr(err),err:true});
  if(S.chat.length>40)S.chat=S.chat.slice(-40);save();
  if(location.hash==='#ask'&&!SES){route()}}
function askAbout(q){CHAT_PREFILL=q;if(location.hash==='#ask')route();else location.hash='ask'}

/* explain-why inside a lesson */
async function explainWhy(btn,q,chosen){if(!getKey()){btn.textContent='Add your API key in the Ask tab first';btn.disabled=true;return}
  btn.disabled=true;const box=document.createElement('div');box.className='whybox';box.innerHTML='<p class="typing"><span></span><span></span><span></span></p>';btn.replaceWith(box);
  const strip=s=>s.replace(/<[^>]+>/g,'').replace(/[{}]/g,'');
  const prompt=tutorBrief()+`\n\nThe student just answered a quiz question wrong. In 2–4 short sentences, explain why his choice is wrong and why the correct one is right. Speak to him directly and kindly.\nQuestion: ${strip(chem(q.q))}\nOptions: ${q.o.map((o,i)=>(i+1)+') '+strip(chem(o))).join('  ')}\nHe chose: ${strip(chem(q.o[chosen]))}\nCorrect: ${strip(chem(q.o[q.a]))}`;
  try{const r=await SAMPLE(prompt,{modelTier:'quick',onText:({text})=>{box.innerHTML=md(text)}});box.innerHTML=md(r.text)}
  catch(e){box.innerHTML=e&&e.text?md(e.text):'<p>'+sampleErr(e)+'</p>'}}

/* ---------- router ---------- */
function route(){regen();
  const h=location.hash.slice(1)||'learn',m=$('#main');let html,after,tab=h;
  if(h.startsWith('notes-')&&byId(h.slice(6))){const l=byId(h.slice(6));setAccent(l.unit);html=viewNotes(l);tab='learn';
    after=()=>{bindSim();const g=$('#notesGo');if(g)g.onclick=()=>startLesson(l);$('#notesAsk').onclick=()=>askAbout(`I’m reading the notes on “${l.title}”. Can you explain the main idea a different way, with an everyday example?`)}}
  else{setAccent(accentUnit());
    if(h==='practice'){html=viewPractice();after=bindPractice}
    else if(h==='tools'){html=viewTools();after=bindTools}
    else if(h==='ask'){html=viewAsk();after=bindAsk}
    else if(h==='profile'){html=viewProfile();after=bindProfile}
    else{html=viewLearn();after=bindLearn;tab='learn'}}
  m.innerHTML=html;after&&after();
  document.querySelectorAll('[data-tab]').forEach(a=>a.setAttribute('aria-current',a.dataset.tab===tab));
  renderAside();$('#brandFizz').innerHTML=fizz({size:34,fill:Math.min(1,todayXP()/S.goal)});
}

addEventListener('hashchange',()=>{closeSheet();if(location.hash==='#learn'||!location.hash)scrollToCur=true;route();if(lastHash!==location.hash&&!location.hash.startsWith('#learn')){scrollTo(0,0)}lastHash=location.hash});
