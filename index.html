 {id:'v2',title:'Titration',sub:'Measuring an unknown concentration',
  lede:'A <b>titration</b> finds the concentration of an acid or base by slowly adding a solution of known concentration until they exactly neutralize each other.',
  body:`<p>Set-up: the known solution (the <b>titrant</b>) goes in a <b>burette</b>. A measured volume of the unknown goes in a flask with a few drops of <b>indicator</b>. Add titrant drop by drop and swirl until the indicator changes colour permanently. That is the <b>endpoint</b>.</p>
  <p>Then calculate: moles of titrant used → mole ratio from the balanced equation → moles of unknown → concentration of unknown.</p>`,
  example:{q:'25.0 mL of HCl is neutralized by 20.0 mL of 0.100 mol/L NaOH. Find [HCl]. ({HCl + NaOH → NaCl + H2O})',steps:['n(NaOH) = 0.100 × 0.0200 = 0.00200 mol.','Ratio 1 : 1, so n(HCl) = 0.00200 mol.','c(HCl) = 0.00200 ÷ 0.0250 = <b>0.0800 mol/L</b>']},
  points:['Phenolphthalein is colourless in acid and pink in base. It’s the most common indicator.','Do at least three trials and average the ones that agree within 0.1 mL.','Read the burette at the bottom of the curved meniscus, at eye level.'],

 {id:'v3',title:'Crude oil and fuels',sub:'Fractional distillation',

  body:`<p>Crude oil is heated until most of it vaporizes, then fed into a tall column that is hot at the bottom and cool at the top. Small molecules (low boiling points) rise to the top before condensing. Large molecules condense near the bottom.</p>`,

 {id:'x5',title:'Half-reactions and agents',sub:'Splitting a redox reaction in two',
  lede:'Every redox reaction can be split into two <b>half-reactions</b>: one that shows the loss of electrons and one that shows the gain.',
  body:`<p>Take {Zn + Cu^2+ → Zn^2+ + Cu}.</p>
  <p><b>Oxidation</b> (loses e⁻): {Zn → Zn^2+ + 2e^-}<br><b>Reduction</b> (gains e⁻): {Cu^2+ + 2e^- → Cu}</p>
  <p>The electrons cancel when you add them back together. The number lost must equal the number gained.</p>
  <p>The substance that gets <b>reduced</b> is the <b>oxidizing agent</b>, because it causes the other one to be oxidized. The substance that gets <b>oxidized</b> is the <b>reducing agent</b>.</p>`,
  points:['Remember OIL RIG: Oxidation Is Loss, Reduction Is Gain.','In an oxidation half-reaction, electrons appear on the right. In a reduction, on the left.','If one half loses 2 e⁻ and the other gains 1 e⁻, double the second half before adding.'],
  example:{q:'Identify the agents in {Mg + 2Ag^+ → Mg^2+ + 2Ag}.',steps:['Mg goes 0 → +2: oxidized, so Mg is the <b>reducing agent</b>.','{Ag^+} goes +1 → 0: reduced, so {Ag^+} is the <b>oxidizing agent</b>.','Halves: {Mg → Mg^2+ + 2e^-} and {Ag^+ + e^- → Ag} (× 2).']},

  body:`<p><b>Batteries</b> are galvanic cells packaged to be portable. Alkaline batteries use zinc and manganese dioxide. Lithium-ion batteries are rechargeable: charging runs the reaction backwards with outside power.</p>
  <p><b>Electrolysis</b> uses electricity to force a reaction that wouldn’t happen on its own. In <b>electroplating</b>, the object to coat is the cathode. Metal ions in the solution are reduced and form a thin layer on it, such as chrome on car parts or silver on cutlery.</p>

function pos(z){if(z===1)return[1,1];if(z===2)return[1,18];if(z<=10)return[2,z<=4?z-2:z+8];if(z<=18)return[3,z<=12?z-10:z];return[4,z-18]}
const ORD=[['1s',2],['2s',2],['2p',6],['3s',2],['3p',6],['4s',2],['3d',10],['4p',6]];
function config(z){
  let left=z,parts=[];for(const[o,c]of ORD){if(left<=0)break;const t=Math.min(c,left);parts.push([o,t]);left-=t}
  if(z===24||z===29){parts=parts.map(p=>p[0]==='4s'?['4s',1]:p[0]==='3d'?['3d',z===24?5:10]:p)}
  const full=parts.map(p=>p[0]+'^'+p[1]).join(' ');
  const gases=[[18,'[Ar]',5],[10,'[Ne]',3],[2,'[He]',1]];
  let short=full;for(const[g,lab,k]of gases){if(z>g){short=lab+' '+parts.slice(k).map(p=>p[0]+'^'+p[1]).join(' ');break}}
  return{full,short};
}
function valence(z){const[p,g]=pos(z);if(g<=2)return g;if(g>=13)return g===18&&z===2?2:g-10;return null}

function parseFormula(str){
  str=str.replace(/\s/g,'').replace(/·/g,'.').replace(/\*/g,'.');
  const parts=str.split('.');const total={};
  for(let part of parts){
    let mult=1;const m=part.match(/^(\d+)(.*)$/);if(m&&parts.length>1){mult=+m[1];part=m[2]}
    let i=0;
    function group(){const counts={};
      while(i<part.length){const ch=part[i];
        if(ch==='('||ch==='['){i++;const inner=group();if(part[i]!==')'&&part[i]!==']')throw'Missing a closing bracket';i++;const n=num();for(const k in inner)counts[k]=(counts[k]||0)+inner[k]*n}
        else if(ch===')'||ch===']'){return counts}
        else if(/[A-Z]/.test(ch)){let s=ch;i++;while(i<part.length&&/[a-z]/.test(part[i])){s+=part[i];i++}
          if(!(s in MASS))throw'“'+s+'” isn’t an element in this calculator';const n=num();counts[s]=(counts[s]||0)+n}
        else throw'Unexpected “'+ch+'”. Element symbols start with a capital letter';}
      return counts}
    function num(){let d='';while(i<part.length&&/\d/.test(part[i])){d+=part[i];i++}return d?+d:1}
    const c=group();if(i<part.length)throw'Unmatched closing bracket';
    for(const k in c)total[k]=(total[k]||0)+c[k]*mult;
  }
  if(!Object.keys(total).length)throw'Type a formula';
  return total;
}

 ...UNITS.map(u=>({id:'unit-'+u.id,name:u.name,desc:'Finish every lesson in '+u.name,sym:u.sym,c:u.c}))];

function award(xp,ctx={}){
  const before={lvl:level(),goal:todayXP()>=S.goal,badges:{...S.badges}};
  S.xp+=xp;const t=ds();S.days[t]=(S.days[t]||0)+xp;
  if(ctx.lesson||ctx.cp){const l=S.streak.last;if(l!==t){S.streak.count=(l===dayOff(-1))?S.streak.count+1:1;S.streak.last=t}S.streak.best=Math.max(S.streak.best,S.streak.count)}
  const give=id=>{if(!S.badges[id])S.badges[id]=t};
  if(ctx.lesson)give('first');
  if(ctx.perfect)give('perfect');
  if(ctx.bestCombo>=5)give('combo5');
  if(S.streak.count>=3)give('streak3');if(S.streak.count>=7)give('streak7');
  if(S.xp>=100)give('xp100');if(S.xp>=500)give('xp500');
  if(todayXP()>=S.goal)give('goal');
  if(ctx.lesson&&new Date().getHours()>=22)give('night');
  UNITS.forEach(u=>{if(unitDone(u)===u.lessons.length)give('unit-'+u.id)});
  save();
  return{lvlUp:level()>before.lvl?level():0,goalHit:!before.goal&&todayXP()>=S.goal,newBadges:BADGES.filter(b=>S.badges[b.id]&&!before.badges[b.id])};
}

    u.lessons.forEach(l=>{const off=OFF[k++%8],st=isDone(l)?'done':unlocked(l)?'avail':'locked',isCur=cur===l;

function learnHTML(l,part){let h='';
  const A=()=>{let s=`<p class="lede">${chem(l.lede)}</p>`;if(l.diagram==='pe')s+=peDiagram();if(l.body)s+=chem(l.body);return s};
  const B=()=>{let s='';if(l.table)s+=`<div class="tbl"><table><thead><tr>${l.table.head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${l.table.rows.map(r=>`<tr>${r.map((c,i)=>`<td${i===0&&/^[\d.×°≈]+$/.test(c)?' class="num"':''}>${chem(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    if(l.diagram==='cell')s+=cellDiagram();if(l.sim)s+=simHTML();
    if(l.points)s+=`<h2>Key points</h2><ul class="points">${l.points.map(p=>`<li>${chem(p)}</li>`).join('')}</ul>`;
    if(l.analogy)s+=`<div class="analogy"><b>Way to think about it</b>${chem(l.analogy)}</div>`;return s};
  const C=()=>l.example?`<h2>Worked example</h2><div class="ex"><div class="q">${chem(l.example.q)}</div><ol>${l.example.steps.map(s=>`<li>${chem(s)}</li>`).join('')}</ol></div>`:'';
  if(part==='all')return A()+B()+C();return {A,B,C}[part]()}

/* ---------- hearts (shared across lessons) ---------- */
const HMAX=5,HREGEN=30*60*1000;
function regen(){if(typeof S.hearts!=='number')S.hearts=HMAX;if(S.hearts>=HMAX){S.hearts=HMAX;S.heartsAt=0;return}
  const now=Date.now();if(!S.heartsAt)S.heartsAt=now;const n=Math.floor((now-S.heartsAt)/HREGEN);
  if(n>0){S.hearts=Math.min(HMAX,S.hearts+n);S.heartsAt=S.hearts>=HMAX?0:S.heartsAt+n*HREGEN;save()}}
const nextHeartIn=()=>S.hearts>=HMAX?0:Math.max(0,S.heartsAt+HREGEN-Date.now());
const mmss=ms=>{const t=Math.ceil(ms/1000);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
function loseHeart(){regen();if(S.hearts>=HMAX)S.heartsAt=Date.now();S.hearts=Math.max(0,S.hearts-1);save()}
const usesHearts=()=>!!SES&&(SES.kind==='lesson'||SES.kind==='cp');
const heartRow=()=>`<div class="hrow" aria-label="${S.hearts} of ${HMAX} hearts">${[...Array(HMAX)].map((_,i)=>`<span class="${i<S.hearts?'on':''}">${ic('heart',30,true)}</span>`).join('')}</div>`;
function heartsSheet(after){regen();const full=S.hearts>=HMAX;
  sheet(`<div class="fizzline">${fizz({mood:S.hearts?'idle':'sad',size:70,fill:Math.max(.1,S.hearts/HMAX)})}<div style="flex:1"><h3>${S.hearts?`You have ${S.hearts} heart${S.hearts>1?'s':''}`:'You’re out of hearts'}</h3>
   <p>${full?'Full! Each mistake in a lesson or checkpoint costs one heart.':`Next heart in <b id="hTimer">${mmss(nextHeartIn())}</b>. Or win them all back now in Heart Lab.`}</p></div></div>${heartRow()}
   <div class="btns">${full?'':`<button class="b3 wide" id="goLab">${ic('flask',20)} Play Heart Lab · 1 min</button>`}<button class="b3 ghost wide" data-close>${full?'Got it':'Not now'}</button></div>`);
  const g=$('#goLab');if(g)g.onclick=()=>{closeSheet();startHeartLab(()=>{closeSession();if(after)after()},()=>closeSession())};
  const t=setInterval(()=>{const el=$('#hTimer');if(!el){clearInterval(t);return}regen();el.textContent=mmss(nextHeartIn())},1000)}
document.addEventListener('click',e=>{const h=e.target.closest&&e.target.closest('#hStat');if(h)heartsSheet()});

/* Heart Lab: match symbols/formulas to names to refill hearts */
const LABPAIRS=[['Na','sodium'],['K','potassium'],['Fe','iron'],['Cu','copper'],['Ag','silver'],['Pb','lead'],['Ca','calcium'],['Mg','magnesium'],['Cl','chlorine'],['Zn','zinc'],
 ['{H2O}','water'],['{CO2}','carbon dioxide'],['NaCl','sodium chloride'],['{CH4}','methane'],['{NH3}','ammonia'],['{OH^-}','hydroxide'],['{NO3^-}','nitrate'],
 ['{SO4^2-}','sulfate'],['{CO3^2-}','carbonate'],['{NH4^+}','ammonium'],['{C2H5OH}','ethanol'],['HCl','hydrochloric acid'],['{C3H8}','propane'],['{O3}','ozone']];
let LAB=null;
function startHeartLab(onDone,onQuit){const set=[...LABPAIRS].sort(()=>Math.random()-.5).slice(0,5);const ids=set.map((_,i)=>i);
  LAB={set,left:[...ids].sort(()=>Math.random()-.5),right:[...ids].sort(()=>Math.random()-.5),sel:null,done:{},onDone,onQuit,won:0};
  const s=$('#session');s.hidden=false;document.body.style.overflow='hidden';setAccent({c:'#E5484D'});renderLab()}
function renderLab(){const s=$('#session'),L=LAB,n=Object.keys(L.done).length;
  s.innerHTML=`<div class="shead"><button class="xbtn" id="labX" aria-label="Leave Heart Lab">${ic('x',28)}</button><div class="sbar"><span style="width:${n/L.set.length*100}%"></span></div><div class="hearts" id="labH">${ic('heart',26,true)}${S.hearts}</div></div>
  <div class="sbody"><div class="sinner"><div class="fizzline">${fizz({mood:'happy',size:70,fill:.9})}<div class="say" style="flex:1"><b>Heart Lab!</b> Match each symbol or formula to its name. Every pair wins a heart.</div></div>
  <div class="lab" role="group" aria-label="Match the pairs"><div class="labcol">${L.left.map(i=>labBtn('L',i)).join('')}</div><div class="labcol">${L.right.map(i=>labBtn('R',i)).join('')}</div></div></div></div>`;
  s.querySelectorAll('.lab button').forEach(b=>b.onclick=()=>labTap(b));
  $('#labX').onclick=()=>{LAB=null;if(SES){setAccent(SES.u);failScreen()}else L.onQuit()}}
function labBtn(side,i){const[a,b]=LAB.set[i],done=LAB.done[i];return `<button data-side="${side}" data-i="${i}" class="${done?'ok':''}" ${done?'disabled':''} aria-pressed="false">${side==='L'?chem(a.startsWith('{')?a:'{'+a+'}'):b}</button>`}
function labTap(b){const L=LAB,side=b.dataset.side,i=+b.dataset.i;
  if(!L.sel||L.sel.side===side){document.querySelectorAll(`.lab button[data-side="${side}"]`).forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');L.sel={side,i,el:b};SND.tap();return}
  const other=L.sel.el;L.sel=null;
  if(+other.dataset.i===i){[b,other].forEach(x=>{x.classList.add('ok');x.disabled=true;x.setAttribute('aria-pressed','false')});L.done[i]=1;SND.ok();
    S.hearts=Math.min(HMAX,S.hearts+1);if(S.hearts>=HMAX)S.heartsAt=0;const h=$('#labH');h.innerHTML=ic('heart',26,true)+S.hearts;h.classList.remove('pop');void h.offsetWidth;h.classList.add('pop');
    $('.sbar span').style.width=(Object.keys(L.done).length/L.set.length*100)+'%';
    if(Object.keys(L.done).length===L.set.length)setTimeout(labWin,450)}
  else{[b,other].forEach(x=>{x.setAttribute('aria-pressed','false');x.classList.remove('bad');void x.offsetWidth;x.classList.add('bad')});SND.no()}}
function labWin(){const L=LAB;S.hearts=HMAX;S.heartsAt=0;save();SND.win();confetti();
  $('#session').innerHTML=`<div class="sbody" style="display:grid;place-items:center"><div class="sinner result" style="align-items:center;gap:18px">${fizz({mood:'happy',size:140,fill:1})}<h1 style="color:#E5484D">Hearts refilled!</h1>${heartRow()}<p style="margin:0;color:var(--muted)">Back to full. Let’s keep going.</p></div></div>
  <div class="sfoot"><div class="sfin"><span></span><button class="b3" id="go">Continue</button></div></div>`;
  $('#go').focus();$('#go').onclick=()=>{LAB=null;if(SES)setAccent(SES.u);L.onDone()}}

/* Bite-size lesson cards: short screens with questions mixed in */
const txtLen=h=>h.replace(/<[^>]+>/g,'').length;
function lessonCards(l){const cards=[],bodyS=['Here’s how it works.','Keep going, you’ve got this.','Next bit.','This part matters.','Almost there.'];let bi=0;
  cards.push({say:pick(['New idea!','Let’s learn something new.','Here’s a fresh one.']),html:`<h1 class="ltitle">${l.title}</h1><p class="lede">${chem(l.lede)}</p>`});
  if(l.diagram==='pe')cards.push({say:'Look at this diagram.',html:peDiagram()});
  if(l.body){const blocks=chem(l.body).match(/<(p|h2|ol|ul)\b[^>]*>[\s\S]*?<\/\1>/g)||[chem(l.body)];let cur='',held='';
    blocks.forEach(b=>{if(/^<h2/.test(b)){if(cur){cards.push({say:bodyS[bi++%bodyS.length],html:cur});cur=''}held=b;return}
      const piece=held+b;held='';if(cur&&txtLen(cur)+txtLen(piece)>340){cards.push({say:bodyS[bi++%bodyS.length],html:cur});cur=piece}else cur+=piece});
    if(cur||held)cards.push({say:bodyS[bi++%bodyS.length],html:cur+held})}
  if(l.table)cards.push({say:'Here’s a quick reference. No need to memorize it all now.',html:`<div class="tbl"><table><thead><tr>${l.table.head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${l.table.rows.map(r=>`<tr>${r.map(c=>`<td>${chem(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`});
  if(l.diagram==='cell')cards.push({say:'Here’s what it looks like.',html:cellDiagram()});
  if(l.sim)cards.push({say:'Try it yourself! Tap the buttons and watch.',html:simHTML(),sim:true});
  if(l.points)for(let i=0;i<l.points.length;i+=2)cards.push({say:i===0?'Key points to remember.':'A couple more.',html:`<ul class="points">${l.points.slice(i,i+2).map(p=>`<li>${chem(p)}</li>`).join('')}</ul>`});
  if(l.analogy)cards.push({say:'Here’s a way to think about it.',html:`<div class="analogy">${chem(l.analogy)}</div>`,mood:'happy'});
  if(l.example)cards.push({say:'Watch me work one out.',html:`<div class="ex"><div class="q">${chem(l.example.q)}</div><ol>${l.example.steps.map(s=>`<li>${chem(s)}</li>`).join('')}</ol></div>`,mood:'think'});
  return cards.map(c=>Object.assign({t:'learn'},c))}

/* ---------- sessions ---------- */
let SES=null;
function startLesson(l){const u=l.unit;setAccent(u);
  regen();if(S.hearts<=0){heartsSheet(()=>startLesson(l));return}
  const cards=lessonCards(l),qs=l.quiz.map((q,i)=>({t:'q',qid:l.id+'-'+i}));
  const pool=[];LESSONS.forEach(x=>{if(x!==l&&isDone(x))x.quiz.forEach((q,i)=>pool.push(x.id+'-'+i))});
  const mid=Math.max(1,Math.ceil(cards.length/2));
  const steps=[...cards.slice(0,mid),qs[0],...cards.slice(mid),...qs.slice(1)];
  if(pool.length&&cards.length>=3)steps.splice(2,0,{t:'q',qid:pick(pool),review:true});
  SES={kind:'lesson',l,u,steps,i:0,hearts:3,right:0,wrong:0,combo:0,best:0,start:Date.now(),requeued:{},sel:null,checked:false,replay:isDone(l)};
  openSession()}
function startQuiz(kind,arg){let pool=[],u=null;
  if(kind==='cp'){regen();if(S.hearts<=0){heartsSheet(()=>startQuiz(kind,arg));return}}
  if(kind==='cp'){u=arg;u.lessons.forEach(l=>l.quiz.forEach((q,i)=>pool.push(l.id+'-'+i)))}
  else if(kind==='miss')pool=Object.keys(S.miss).filter(q=>byId(q.split('-')[0]));
  else LESSONS.forEach(l=>{if(arg==='all'||l.unit.id===arg||(arg==='done'&&isDone(l)))l.quiz.forEach((q,i)=>pool.push(l.id+'-'+i))});
  pool.sort(()=>Math.random()-.5);pool=pool.slice(0,kind==='cp'?8:10);
  if(!pool.length){toast('No questions there yet.');return}
  u=u||byId(pool[0].split('-')[0]).unit;setAccent(u);
  SES={kind,u,steps:pool.map(q=>({t:'q',qid:q})),i:0,hearts:kind==='cp'?3:null,right:0,wrong:0,combo:0,best:0,start:Date.now(),requeued:{},sel:null,checked:false};
  openSession()}
function openSession(){const s=$('#session');s.hidden=false;document.body.style.overflow='hidden';renderStep()}
function closeSession(){$('#session').hidden=true;$('#session').innerHTML='';document.body.style.overflow='';SES=null;closeSheet();setAccent(accentUnit());route()}
const getQ=qid=>{const[l,i]=qid.split('-');return byId(l).quiz[+i]};

function shead(){const pct=SES.i/SES.steps.length*100;
  return `<div class="shead"><button class="xbtn" id="sx" aria-label="Quit">${ic('x',28)}</button><div class="sbar" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>
  ${usesHearts()?`<div class="hearts" id="hearts">${ic('heart',26,true)}${S.hearts}</div>`:`<div class="hearts" style="color:#C98A06">${ic('bolt',24,true)}${SES.right*2}</div>`}</div>`}
function renderStep(){const s=$('#session'),st=SES.steps[SES.i];SES.sel=null;SES.checked=false;
  if(st.t==='learn'){const l=SES.l;
    const moreLearn=SES.steps.slice(SES.i+1).some(x=>x.t==='learn');
    s.innerHTML=shead()+`<div class="sbody"><div class="sinner"><div class="fizzline">${fizz({mood:st.mood||'idle',size:70,fill:.65})}<div class="say" style="flex:1">${st.say}</div></div>

    $('#go').onclick=next;const sk=$('#skip');if(sk)sk.onclick=()=>{SES.steps=SES.steps.slice(0,SES.i).concat(SES.steps.slice(SES.i).filter(x=>x.t==='q'));renderStep()};

function check(){if(SES.sel===null||SES.checked)return;SES.checked=true;const st=SES.steps[SES.i],q=getQ(st.qid),ok=SES.sel===q.a;

  if(ok){SES.right++;SES.combo++;SES.best=Math.max(SES.best,SES.combo);delete S.miss[st.qid];SND.ok();head=pick(SAY.right);
    if(SES.combo>=3&&SES.combo%3===0)head=SES.combo+' '+pick(SAY.combo)}
  else{SES.wrong++;SES.combo=0;S.miss[st.qid]=1;SND.no();head=pick(SAY.wrong);
    if(usesHearts()){loseHeart();const h=$('#hearts');h.innerHTML=ic('heart',26,true)+S.hearts;h.classList.remove('shake');void h.offsetWidth;h.classList.add('shake')}

  const sf=$('#sf');sf.className='sfoot '+(ok?'ok':'no');
  sf.innerHTML=`<div class="sfin"><div class="msg"><span class="ico">${ic(ok?'check':'x',26)}</span><div><h3>${head}</h3><p>${ok?'':'<b>Answer:</b> '+chem(q.o[q.a])+'. '}${chem(q.w)}</p>${ok?'':'<button class="whyb" id="whyB" type="button">'+ic('chat',16)+' Still confused? Ask Fizz why</button>'}</div></div><button class="b3 ${ok?'okb':'nob'}" id="go">Continue</button></div>`;
  const g=$('#go');g.onclick=next;g.focus();

  if(ok){const sv=document.querySelector('.sinner .fizz');if(sv)sv.outerHTML=fizz({mood:'happy',size:62,fill:.65})}
  else{const sv=document.querySelector('.sinner .fizz');if(sv)sv.outerHTML=fizz({mood:'sad',size:62,fill:.65})}
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function next(){if(usesHearts()&&S.hearts<=0){failScreen();return}SES.i++;if(SES.i>=SES.steps.length){finish();return}renderStep()}
function quitAsk(){sheet(`<div class="fizzline">${fizz({mood:'sad',size:70,fill:.5})}<div style="flex:1"><h3>Leaving already?</h3><p>You’ll lose your progress in this ${SES.kind==='lesson'?'lesson':'session'}.</p></div></div><div class="btns"><button class="b3 wide" data-close>Keep learning</button><button class="b3 ghost wide" id="quitY">Quit</button></div>`);

function failScreen(){const s=$('#session');SND.no();save();

function finish(){const sec=Math.round((Date.now()-SES.start)/1000),total=SES.right+SES.wrong,acc=total?Math.round(SES.right/total*100):100,perfect=SES.wrong===0;
  let xp=0,ctx={bestCombo:SES.best},title='Lesson complete!';
  if(SES.kind==='lesson'){const l=SES.l,prev=S.done[l.id];xp=(prev?5:10)+(perfect?5:0);S.done[l.id]={best:Math.max(acc,prev?prev.best:0),n:(prev?prev.n:0)+1};ctx.lesson=true;ctx.perfect=perfect;justDone=prev?null:l.id}
  else if(SES.kind==='cp'){const first=!S.cp[SES.u.id];xp=first?20:SES.right*2;S.cp[SES.u.id]=1;ctx.cp=true;title='Checkpoint cleared!'}
  else{xp=SES.right*2;title=SES.kind==='miss'?'Mistakes reviewed!':'Practice complete!'}
  const r=award(xp,ctx);SND.win();
  const s=$('#session');const mood=acc>=60?'happy':'idle';
  const tiles=[['Total XP','#E9A800','bolt',`<span id="xpCount">0</span>`],['Accuracy',acc>=80?'#3E9B4F':'#DE6A1F','target',acc+'%'],['Time','#1B8FA3','clock',Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')]];
  s.innerHTML=`<div class="sbody" style="display:grid;place-items:center"><div class="sinner result" style="align-items:center;gap:22px">${fizz({mood,size:150,fill:Math.min(1,todayXP()/S.goal)})}
   <h1>${perfect&&total?'Perfect '+(SES.kind==='lesson'?'lesson':'run')+'!':title}</h1>
   <div class="rtiles">${tiles.map(([n,c,i,v])=>`<div class="rtile" style="--rc:${c}"><div class="rl">${n}</div><div class="rv">${ic(i,20,i==='bolt')}${v}</div></div>`).join('')}</div>
   <div class="ribbon">${r.goalHit?`<span class="pill" style="color:#C98A06">${ic('target',20)} Daily goal reached</span>`:''}${SES.best>=3?`<span class="pill" style="color:#E8691C">${ic('bolt',20,true)} Best combo ${SES.best}</span>`:''}${ctx.lesson||ctx.cp?`<span class="pill" style="color:#E8691C">${ic('flame',20,true)} ${streakNow()} day streak</span>`:''}</div>
   ${r.newBadges.length?`<div style="display:flex;flex-direction:column;gap:10px;align-items:center"><b style="font-family:var(--display)">New badge${r.newBadges.length>1?'s':''}!</b><div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center">${r.newBadges.map(b=>badgeImg(b,true).replace('class="badge ','class="badge new ')).join('')}</div></div>`:''}
  </div></div><div class="sfoot"><div class="sfin"><span></span><button class="b3" id="go">Continue</button></div></div>`;
  confetti();
  let n=0;const el=$('#xpCount'),step=()=>{n=Math.min(xp,n+1);el.textContent='+'+n;if(n<xp)setTimeout(step,RM?0:Math.max(25,600/xp))};step();
  $('#go').focus();

  <div class="small">Level up</div><h1>Level ${L}: ${rank(L)}</h1><p style="margin:0;color:var(--muted);max-width:40ch">${lvlXP(L+1)-S.xp} XP until ${rank(L+1)}.</p></div></div>

/* ---------- Le Châtelier simulator: N2 + 3H2 ⇌ 2NH3, ΔH = −92 kJ ---------- */
const KS=[2.5,0.5,0.1],TL=['Cool','Room temperature','Hot'];
let sim={a:1,h:3,n:0,t:1};
function equil(s){const K=KS[s.t];const Q=x=>(s.n+2*x)**2/((s.a-x)*(s.h-3*x)**3);
  let lo=-s.n/2+1e-9,hi=Math.min(s.a,s.h/3)-1e-9;
  for(let i=0;i<200;i++){const m=(lo+hi)/2;if(Q(m)<K)lo=m;else hi=m}
  const x=(lo+hi)/2;return{x,a:s.a-x,h:s.h-3*x,n:s.n+2*x}}
function simHTML(){return `<div class="sim" id="sim"><div class="eq f">N<sub>2</sub>(g) + 3H<sub>2</sub>(g) ⇌ 2NH<sub>3</sub>(g) &nbsp; ΔH = −92 kJ</div>
  <div class="bars"><div class="bar"><span class="v" id="vA"></span><div class="fill" id="bA"></div></div><div class="bar"><span class="v" id="vH"></span><div class="fill" id="bH"></div></div><div class="bar"><span class="v" id="vN"></span><div class="fill" id="bN"></div></div></div>
  <div class="barlabels f"><span>[N<sub>2</sub>]</span><span>[H<sub>2</sub>]</span><span>[NH<sub>3</sub>]</span></div>
  <div class="controls"><button data-s="addA">Add N₂</button><button data-s="addH">Add H₂</button><button data-s="remN">Remove NH₃</button><button data-s="addN">Add NH₃</button><button data-s="press">Squeeze (½ volume)</button><button data-s="heat">Heat up</button><button data-s="cool">Cool down</button><button data-s="cat">Add catalyst</button><button data-s="reset">Reset</button></div>
  <div class="status" id="simStatus" aria-live="polite">Pick a change and watch the system respond. Values are illustrative, in mol/L.</div>
  <div class="readout" id="simRead"></div></div>`}
function bindSim(){
  const el=$('#sim');if(!el)return;
  let cur=equil(sim);sim={a:cur.a,h:cur.h,n:cur.n,t:sim.t};
  const draw=s=>{const mx=Math.max(4,s.a,s.h,s.n)*1.05;[['A','a'],['H','h'],['N','n']].forEach(([k,f])=>{$('#b'+k).style.height=(s[f]/mx*100)+'%';$('#v'+k).textContent=s[f].toFixed(2)});
    const Q=s.n**2/(s.a*s.h**3);$('#simRead').innerHTML=`<span>Q = ${Q.toFixed(3)}</span><span>K = ${KS[s.t]}</span><span>${TL[s.t]}</span>`};
  draw(sim);
  let timer;
  el.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{
    clearTimeout(timer);const s=b.dataset.s;let msg='',dir=null;
    if(s==='reset'){sim={a:1,h:3,n:0,t:1};const e=equil(sim);sim={...sim,a:e.a,h:e.h,n:e.n};draw(sim);$('#simStatus').textContent='Reset to equilibrium at room temperature.';return}
    if(s==='cat'){$('#simStatus').innerHTML='<b>No shift.</b> A catalyst speeds up the forward and reverse reactions equally. Equilibrium is reached sooner, but the amounts stay the same.';return}
    if(s==='addA'){sim.a+=1;msg='You added N₂. The system uses some up'}
    if(s==='addH'){sim.h+=1.5;msg='You added H₂. The system uses some up'}
    if(s==='addN'){sim.n+=1;msg='You added NH₃. The system uses some up'}
    if(s==='remN'){sim.n=sim.n*0.3;msg='You removed NH₃. The system makes more to replace it'}
    if(s==='press'){sim.a*=2;sim.h*=2;sim.n*=2;msg='All concentrations doubled. The side with fewer gas molecules is favoured (2 vs 4)'}
    if(s==='heat'){if(sim.t===2){$('#simStatus').textContent='Already at the hottest setting.';return}sim.t++;msg='Heat is a product here, so adding heat favours the reverse reaction. K gets smaller'}
    if(s==='cool'){if(sim.t===0){$('#simStatus').textContent='Already at the coolest setting.';return}sim.t--;msg='Removing heat favours the exothermic forward reaction. K gets bigger'}
    draw(sim);
    const e=equil(sim);dir=e.x>1e-6?'right → more NH₃':e.x<-1e-6?'left → more N₂ and H₂':'nowhere';
    $('#simStatus').innerHTML=`${msg}. <b>Shifts ${dir}.</b>`;
    timer=setTimeout(()=>{sim={a:e.a,h:e.h,n:e.n,t:sim.t};draw(sim)},700);
  });
}

const KEYK='flametest-api-key',MODELK='flametest-model';
const getKey=()=>{try{return localStorage.getItem(KEYK)||''}catch(e){return''}};
const setKey=k=>{try{k?localStorage.setItem(KEYK,k):localStorage.removeItem(KEYK)}catch(e){}};
const getModel=()=>{try{return localStorage.getItem(MODELK)||'claude-sonnet-5-5'}catch(e){return'claude-sonnet-5-5'}};
async function toB64(file){
  try{const bmp=await createImageBitmap(file);const sc=Math.min(1,1568/Math.max(bmp.width,bmp.height));const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);return{type:'image/jpeg',data:cv.toDataURL('image/jpeg',.85).split(',')[1]}}
  catch(e){return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res({type:file.type||'image/jpeg',data:String(fr.result).split(',')[1]});fr.onerror=()=>rej({code:'image_rejected'});fr.readAsDataURL(file)})}}
async function apiSample(input,opts={}){
  const key=getKey();if(!key)throw{code:'no_key'};
  const messages=(typeof input==='string'?[{role:'user',content:input}]:input).map(m=>({role:m.role,content:m.content}));
  if(opts.images&&opts.images.length){const last=messages[messages.length-1],blocks=[];
    for(const f of opts.images){const b=await toB64(f);blocks.push({type:'image',source:{type:'base64',media_type:b.type,data:b.data}})}
    blocks.push({type:'text',text:last.content});last.content=blocks}
  let res;
  try{res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:opts.signal,headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:opts.modelTier==='quick'?'claude-haiku-5-5':getModel(),max_tokens:1200,stream:true,messages})})}
  catch(e){throw{code:e&&e.name==='AbortError'?'cancelled':'network'}}
  if(!res.ok){let msg='';try{const j=await res.json();msg=(j.error&&j.error.message)||''}catch(e){}
    const st=res.status;throw{code:st===401||st===403?'bad_key':st===429?'rate_limited':/credit|balance|billing/i.test(msg)?'no_credit':/image/i.test(msg)?'image_rejected':/too long|too large/i.test(msg)||st===413?'prompt_too_large':st===404&&/model/i.test(msg)?'bad_model':'upstream_error',message:msg}}
  const rd=res.body.getReader(),dec=new TextDecoder();let buf='',text='';
  try{for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line.startsWith('data:'))continue;
      let ev;try{ev=JSON.parse(line.slice(5))}catch(e){continue}
      if(ev.type==='content_block_delta'&&ev.delta&&ev.delta.type==='text_delta'){text+=ev.delta.text;opts.onText&&opts.onText({text,delta:ev.delta.text})}
      else if(ev.type==='error')throw{code:/overloaded/i.test(ev.error&&ev.error.type||'')?'rate_limited':'upstream_error',text}}}}
  catch(e){if(e&&e.code)throw e;throw{code:e&&e.name==='AbortError'?'cancelled':'network',text}}
  if(!text)throw{code:'empty_completion'};return{text,truncated:false}}

  <label for="keyIn" class="sr">API key</label><div class="crow"><input type="password" id="keyIn" placeholder="sk-ant-…" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="b3" id="keySave" type="button" style="padding:11px 16px">Save</button></div>

function sampleErr(e){const c=e&&e.code;
  if(c==='no_key')return'Add your Anthropic API key first.';

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function md(t){let s=esc(t);
  s=s.replace(/```[a-z]*\n?([\s\S]*?)```/g,(m,c)=>'<pre>'+c.replace(/\n$/,'')+'</pre>');
  s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>').replace(/`([^`\n]+)`/g,'<code>$1</code>');
  const out=[];let list=null;
  s.split('\n').forEach(line=>{const ul=line.match(/^\s*[-•*]\s+(.*)/),ol=line.match(/^\s*\d+[.)]\s+(.*)/),hd=line.match(/^#{1,4}\s+(.*)/);
    if(ul||ol){const tag=ul?'ul':'ol';if(!list||list.tag!==tag){list&&out.push('</'+list.tag+'>');list={tag};out.push('<'+tag+'>')}out.push('<li>'+(ul||ol)[1]+'</li>');return}
    if(list){out.push('</'+list.tag+'>');list=null}
    if(hd)out.push('<p><b>'+hd[1]+'</b></p>');else if(line.trim())out.push('<p>'+line+'</p>')});
  list&&out.push('</'+list.tag+'>');return out.join('')}
