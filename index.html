     '22.99 + 35.45 = 58.44 g/mol.'),
   B('One more, a bit bigger.',
     '<p>Find the molar mass of calcium carbonate, {CaCO3} (chalk and limestone).</p><p>It has 1 Ca, 1 C and 3 O. Use Ca = 40.08, C = 12.01, O = 16.00.</p>',
     'What is the molar mass of {CaCO3}?', ['68.09 g/mol','100.09 g/mol','52.09 g/mol'], 1,
     '40.08 + 12.01 + 3(16.00) = 40.08 + 12.01 + 48.00 = 100.09 g/mol. Don’t forget to triple the oxygen.')
 ]},
 {id:'k23', title:'Grams to moles', sub:'Divide by the molar mass', bites:[
   B('Here’s the key equation.',
     '<p>To turn grams into moles, use:</p><p><b>n = m ÷ M</b></p><ul><li><b>n</b> = moles (mol)</li><li><b>m</b> = mass (g)</li><li><b>M</b> = molar mass (g/mol)</li></ul>',
     'In n = m ÷ M, what does <b>m</b> stand for?', ['Molar mass','Moles','Mass in grams'], 2,
     'Lowercase m is the mass in grams. Capital M is the molar mass.'),
   B('Watch me do one.',
     '<p>How many moles are in 24.02 g of carbon?</p><ol><li>Molar mass of C: M = 12.01 g/mol</li><li>n = m ÷ M = 24.02 g ÷ 12.01 g/mol</li><li>n = <b>2.00 mol</b></li></ol>',
     'How many moles are in 24.02 g of carbon?', ['2.00 mol','12.01 mol','288 mol'], 0,
     '24.02 ÷ 12.01 = 2.00 mol.'),
   B('Same steps for a compound.',
     '<p>How many moles are in 9.01 g of water?</p><ol><li>M of {H2O} = 18.02 g/mol</li><li>n = 9.01 g ÷ 18.02 g/mol</li><li>n = <b>0.500 mol</b></li></ol><p>Less than one molar mass of stuff means less than 1 mol.</p>',
     'How many moles are in 9.01 g of {H2O}?', ['2.00 mol','0.500 mol','162 mol'], 1,
     '9.01 ÷ 18.02 = 0.500 mol.'),
   B('Your turn!',
     '<p>How many moles are in 116.88 g of {NaCl}?</p><p>You found its molar mass earlier: 58.44 g/mol. Now use n = m ÷ M.</p>',
     'How many moles are in 116.88 g of {NaCl}?', ['0.500 mol','6830 mol','2.00 mol'], 2,
     'n = 116.88 ÷ 58.44 = 2.00 mol.'),
   B('Check your units.',
     '<p>Units can tell you if you did it right. Grams divided by grams per mole leaves <b>mol</b>:</p><p>g ÷ (g/mol) = mol</p><p>Try one more: 50.0 g of {CaCO3}, where M = 100.09 g/mol.</p>',
     'About how many moles are in 50.0 g of {CaCO3}?', ['0.500 mol','2.00 mol','5000 mol'], 0,
     '50.0 ÷ 100.09 = 0.4996, which rounds to 0.500 mol.')
 ]},
 {id:'k24', title:'Moles to grams', sub:'Multiply by the molar mass', bites:[
   B('Just flip it around.',
     '<p>To go from moles to grams, rearrange the same equation:</p><p><b>m = n × M</b></p><p>Grams → moles: divide by M.<br>Moles → grams: multiply by M.</p>',
     'To change moles into grams, you…', ['divide by M','multiply by M','multiply by 6.02 × 10²³'], 1,
     'm = n × M, so you multiply the moles by the molar mass.'),
   B('Watch me do one.',
     '<p>What is the mass of 3.00 mol of carbon?</p><ol><li>M of C = 12.01 g/mol</li><li>m = n × M = 3.00 mol × 12.01 g/mol</li><li>m = <b>36.0 g</b> (36.03, rounded to 3 sig figs)</li></ol>',
     'What is the mass of 3.00 mol of carbon?', ['4.00 g','36.0 g','12.0 g'], 1,
     '3.00 × 12.01 = 36.03, which is 36.0 g to 3 sig figs.'),
   B('Now a compound.',
     '<p>What is the mass of 0.500 mol of water?</p><ol><li>M of {H2O} = 18.02 g/mol</li><li>m = 0.500 mol × 18.02 g/mol</li><li>m = <b>9.01 g</b></li></ol>',
     'What is the mass of 0.500 mol of {H2O}?', ['36.0 g','18.5 g','9.01 g'], 2,
     '0.500 × 18.02 = 9.01 g.'),
   B('Your turn!',
     '<p>What is the mass of 2.00 mol of {CO2}?</p><p>Its molar mass is 44.01 g/mol. Use m = n × M.</p>',
     'What is the mass of 2.00 mol of {CO2}?', ['88.0 g','22.0 g','44.0 g'], 0,
     '2.00 × 44.01 = 88.02, which is 88.0 g.'),
   B('Pick the right direction.',
     '<p>Before you calculate, ask: what do I have, and what do I want?</p><ul><li>Have grams, want moles: <b>÷ M</b></li><li>Have moles, want grams: <b>× M</b></li></ul>',
     'You have 54.06 g of water and want moles. What do you do?', ['Multiply by 18.02','Divide by 18.02','Divide by 6.02 × 10²³'], 1,
     'Grams to moles means dividing by the molar mass: 54.06 ÷ 18.02 = 3.00 mol.')
 ]},
 {id:'k25', title:'Moles to particles', sub:'Using Avogadro’s number', bites:[
   B('Counting the actual particles.',
     '<p>To find how many atoms or molecules you have, multiply moles by Avogadro’s number:</p><p><b>particles = n × 6.02 × 10<sup>23</sup></b></p>',
     'To go from moles to number of particles, you multiply by…', ['the molar mass','6.02 × 10²³','100'], 1,
     'Each mole holds 6.02 × 10²³ particles, so multiply moles by that number.'),
   B('Watch me do one.',
     '<p>How many atoms are in 0.500 mol of iron?</p><p>0.500 × 6.02 × 10<sup>23</sup><br>= <b>3.01 × 10<sup>23</sup> atoms</b></p><p>Only multiply the front numbers. The × 10<sup>23</sup> part rides along.</p>',
     'How many atoms are in 0.500 mol of iron?', ['3.01 × 10²³','6.02 × 10²³','1.20 × 10²⁴'], 0,
     '0.500 × 6.02 = 3.01, so the answer is 3.01 × 10²³ atoms.'),
   B('Tidying up big numbers.',
     '<p>2.00 mol × 6.02 × 10<sup>23</sup> = 12.04 × 10<sup>23</sup>.</p><p>In scientific notation the front number should be between 1 and 10. Move the decimal one place left and raise the power by 1:</p><p>12.04 × 10<sup>23</sup> = <b>1.20 × 10<sup>24</sup></b></p>',
     'What is 12.04 × 10²³ written properly?', ['12.0 × 10²⁴','1.20 × 10²²','1.20 × 10²⁴'], 2,
     'Moving the decimal one place left (12.04 → 1.204) means the power goes up by one, from 23 to 24.'),
   B('Going backwards.',
     '<p>To go from particles to moles, <b>divide</b> by Avogadro’s number.</p><p>1.204 × 10<sup>24</sup> ÷ 6.02 × 10<sup>23</sup> = <b>2.00 mol</b></p>',
     'How many moles are 3.01 × 10²³ atoms?', ['2.00 mol','0.500 mol','3.01 mol'], 1,
     '3.01 × 10²³ is half of 6.02 × 10²³, so it’s 0.500 mol.'),
   B('Your turn! Chain two steps.',
     '<p>Grams → moles → particles.</p><p>Example: 18.02 g of water ÷ 18.02 g/mol = 1.00 mol. Then 1.00 × 6.02 × 10<sup>23</sup> = 6.02 × 10<sup>23</sup> molecules.</p><p>Now try 36.04 g of water.</p>',
     'How many molecules are in 36.04 g of {H2O}?', ['6.02 × 10²³','3.01 × 10²³','1.20 × 10²⁴'], 2,
     '36.04 ÷ 18.02 = 2.00 mol. Then 2.00 × 6.02 × 10²³ = 12.04 × 10²³ = 1.20 × 10²⁴ molecules.')
 ]},
 {id:'k1', title:'Percent composition', sub:'What share of the mass each element is', bites:[
   B('What’s in a compound, by mass?',
     '<p><b>Percent composition</b> tells you what percentage of a compound’s mass comes from each element.</p><p><b>% element = (mass of that element in the formula ÷ molar mass) × 100</b></p>',
     'In the percent composition formula, what do you divide by?', ['The molar mass of the compound','Avogadro’s number','The number of atoms'], 0,
     'You divide the element’s mass by the whole compound’s molar mass, then multiply by 100.'),
   B('Watch me do water.',
     '<p>{H2O}: molar mass = 18.02 g/mol.</p><ol><li>H: 2 × 1.01 = 2.02. 2.02 ÷ 18.02 × 100 = <b>11.2%</b></li><li>O: 16.00 ÷ 18.02 × 100 = <b>88.8%</b></li></ol>',
     'What percent of water’s mass is oxygen?', ['11.2%','50.0%','88.8%'], 2,
     '16.00 ÷ 18.02 × 100 = 88.8%.'),
   B('A quick check.',
     '<p>All the percentages in a compound should add up to about <b>100%</b>.</p><p>Water: 11.2% + 88.8% = 100.0%. ✓</p><p>So if you know all but one, subtract from 100 to get the last one.</p>',
     'A compound of only C and O is 27.3% carbon. What percent is oxygen?', ['27.3%','72.7%','100%'], 1,
     '100 − 27.3 = 72.7%.'),
   B('Your turn!',
     '<p>Find the percent of carbon in {CO2}.</p><p>Molar mass of {CO2} = 44.01 g/mol. Carbon in the formula = 1 × 12.01 = 12.01.</p>',
     'What percent of {CO2} is carbon?', ['12.0%','72.7%','27.3%'], 2,
     '12.01 ÷ 44.01 × 100 = 27.3%.'),
   B('The lab version.',
     '<p>In a lab you might measure actual masses instead. Same idea:</p><p><b>% = mass of element ÷ mass of sample × 100</b></p><p>Example: a 50.0 g sample contains 20.0 g of calcium.</p>',
     'What percent of the 50.0 g sample is calcium?', ['20.0%','40.0%','60.0%','250%'], 1,
     '20.0 ÷ 50.0 × 100 = 40.0%.')
 ]},
 {id:'k2', title:'Empirical formulas', sub:'Working backwards from percentages', bites:[
   B('The simplest ratio.',
     '<p>The <b>empirical formula</b> is the simplest whole-number ratio of atoms in a compound.</p><p>Glucose is {C6H12O6}. Divide every subscript by 6 and you get {CH2O}. That’s its empirical formula.</p>',
     'What is the empirical formula of {C2H6}?', ['{C2H6}','{CH3}','{CH2}'], 1,
     'Divide both subscripts by 2: {C2H6} becomes {CH3}.'),
   B('Step 1: pretend you have 100 g.',
     '<p>Lab data usually comes as percentages. Example: a compound is 50.0% S and 50.0% O.</p><p>Assume you have <b>100 g</b>. Then the percentages become grams: 50.0 g S and 50.0 g O.</p>',
     'A compound is 30.0% nitrogen. In a 100 g sample, how many grams are nitrogen?', ['30.0 g','70.0 g','3.00 g'], 0,
     'With 100 g, the percent turns straight into grams: 30.0% is 30.0 g.'),
   B('Step 2: grams to moles.',
     '<p>Divide each mass by its molar mass (n = m ÷ M):</p><p>S: 50.0 ÷ 32.06 = 1.56 mol<br>O: 50.0 ÷ 16.00 = 3.125 mol</p>',
     'How many moles of O are in 50.0 g of oxygen atoms?', ['800 mol','3.125 mol','1.56 mol'], 1,
     '50.0 ÷ 16.00 = 3.125 mol.'),
   B('Step 3: divide by the smallest.',
     '<p>Divide every mole value by the smallest one (here 1.56):</p><p>S: 1.56 ÷ 1.56 = 1<br>O: 3.125 ÷ 1.56 = 2.00</p><p>So the ratio is 1 S : 2 O. If you ever get something like 1.5, multiply all of them by 2.</p>',
     'What is the empirical formula of this compound?', ['{SO}','{S2O}','{SO2}'], 2,
     'The ratio is 1 S to 2 O, so the formula is {SO2}.'),
   B('Your turn!',
     '<p>A compound is 40.0% C, 6.7% H and 53.3% O. Steps 1 and 2 give:</p><p>C: 40.0 ÷ 12.01 = 3.33 mol<br>H: 6.7 ÷ 1.01 = 6.63 mol<br>O: 53.3 ÷ 16.00 = 3.33 mol</p><p>Now do step 3.</p>',
     'What is the empirical formula?', ['{CH2O}','{C2HO}','{CHO}'], 0,
     'Divide by 3.33: C = 1, H = 6.63 ÷ 3.33 ≈ 2, O = 1. That gives {CH2O}.')
 ]},
 {id:'k26', title:'Molecular formulas', sub:'From empirical formula to the real thing', bites:[
   B('The real molecule.',
     '<p>The <b>molecular formula</b> shows the actual number of atoms in one molecule.</p><p>It is always a whole-number multiple of the empirical formula. {CH2O} × 6 = {C6H12O6}.</p>',
     'Which could be a molecular formula for the empirical formula {CH2}?', ['{CH4}','{C2H4}','{C2H6}'], 1,
     '{CH2} × 2 = {C2H4}. The other two don’t keep the 1 : 2 ratio.'),
   B('Find the multiplier.',
     '<p>Multiplier = molar mass ÷ empirical formula mass.</p><p>Example: empirical formula {CH2}, molar mass 28.06 g/mol.<br>{CH2} mass = 12.01 + 2(1.01) = 14.03<br>28.06 ÷ 14.03 = <b>2</b></p>',
     'What is the multiplier in this example?', ['2','14','28'], 0,
     '28.06 ÷ 14.03 = 2, so the molecular formula is {CH2} × 2 = {C2H4}.'),
   B('Watch me do glucose.',
     '<p>Empirical formula {CH2O}, molar mass 180.18 g/mol.</p><ol><li>{CH2O} mass = 12.01 + 2.02 + 16.00 = 30.03</li><li>180.18 ÷ 30.03 = 6</li><li>Multiply every subscript by 6</li></ol>',
     'What is the molecular formula?', ['{CH2O}','{C3H6O3}','{C6H12O6}'], 2,
     'Multiply each subscript in {CH2O} by 6 to get {C6H12O6}.'),
   B('Your turn!',
     '<p>A compound has empirical formula {CH} and a molar mass of 78.12 g/mol.</p><p>{CH} mass = 12.01 + 1.01 = 13.02. Divide, then multiply the subscripts.</p>',
     'What is the molecular formula?', ['{C3H3}','{C6H6}','{C2H2}'], 1,
     '78.12 ÷ 13.02 = 6, so {CH} × 6 = {C6H6}.')
 ]},
 {id:'k27', title:'Mole ratios', sub:'Balanced equations are recipes', bites:[
   B('Coefficients are a recipe.',
     '<p>The big numbers in a balanced equation tell you how many <b>moles</b> react.</p><p>{2H2 + O2 → 2H2O} means: 2 mol of {H2} react with 1 mol of {O2} to make 2 mol of {H2O}.</p>',
     'In {2H2 + O2 → 2H2O}, how many moles of {O2} react with 2 mol of {H2}?', ['2','1','4'], 1,
     'The coefficient on {O2} is 1 (no number written), so 1 mol of {O2} reacts with 2 mol of {H2}.'),
   B('Scale the recipe.',
     '<p>Write the ratio as a fraction and multiply. Want new ÷ have old:</p><p>4 mol {H2} × (1 mol {O2} / 2 mol {H2}) = <b>2 mol {O2}</b></p><p>Double the {H2}, double the {O2}.</p>',
     'How many moles of {O2} are needed for 4 mol of {H2}?', ['1 mol','4 mol','2 mol'], 2,
     '4 × 1/2 = 2 mol of {O2}.'),
   B('Watch me do one.',
     '<p>{N2 + 3H2 → 2NH3}</p><p>How much {NH3} comes from 6 mol of {H2}? The ratio is 3 {H2} : 2 {NH3}.</p><p>6 mol {H2} × (2 mol {NH3} / 3 mol {H2}) = <b>4 mol {NH3}</b></p>',
     'How many moles of {NH3} form from 6 mol of {H2}?', ['4 mol','6 mol','9 mol'], 0,
     '6 × 2/3 = 4 mol of {NH3}.'),
   B('Your turn!',
     '<p>Same reaction: {N2 + 3H2 → 2NH3}.</p><p>You have 2 mol of {N2}. The ratio of {N2} to {H2} is 1 : 3.</p>',
     'How many moles of {H2} react with 2 mol of {N2}?', ['2 mol','3 mol','6 mol'], 2,
     '2 mol {N2} × (3 mol {H2} / 1 mol {N2}) = 6 mol {H2}.'),
   B('Moles only, never grams.',
     '<p>The recipe counts particles, so it only works with <b>moles</b>. 2 g of {H2} does not react with 1 g of {O2}.</p><p>If you’re given grams, change them to moles first.</p>',
     'You’re given grams of a reactant. Before using the mole ratio, you should…', ['convert grams to moles','use the grams directly','multiply by 100'], 0,
     'Mole ratios compare moles. Grams must be turned into moles first.')
 ]},
 {id:'k3', title:'Mass-to-mass stoichiometry', sub:'How much product from how much reactant', bites:[
   B('One path for every question.',
     '<p><b>Stoichiometry</b> uses a balanced equation to predict masses. It always follows the same path:</p><p><b>grams of A → moles of A → (mole ratio) → moles of B → grams of B</b></p>',
     'What step sits in the middle of the path?', ['Divide by 100','The mole ratio','Avogadro’s number'], 1,
     'You switch from moles of A to moles of B using the mole ratio from the equation.'),
   B('Watch me. Step 1.',
     '<p>How many grams of water form when 4.04 g of {H2} burns? {2H2 + O2 → 2H2O}</p><p>Step 1, grams → moles:<br>M of {H2} = 2(1.01) = 2.02 g/mol<br>n = 4.04 ÷ 2.02 = <b>2.00 mol {H2}</b></p>',
     'How many moles of {H2} are in 4.04 g?', ['2.00 mol','8.16 mol','4.04 mol'], 0,
     '4.04 ÷ 2.02 = 2.00 mol.'),
   B('Steps 2 and 3.',
     '<p>Step 2, mole ratio: {H2} : {H2O} = 2 : 2, so 2.00 mol {H2} makes <b>2.00 mol {H2O}</b>.</p><p>Step 3, moles → grams:<br>m = 2.00 × 18.02 = 36.04 g ≈ <b>36.0 g</b> of water</p>',
     'How many grams of water form?', ['18.0 g','36.0 g','4.04 g'], 1,
     '2.00 mol × 18.02 g/mol = 36.0 g of water.'),
   B('Your turn!',
     '<p>{2Mg + O2 → 2MgO}. You burn 48.62 g of Mg.</p><ol><li>Mg: 48.62 ÷ 24.31 = ? mol</li><li>Ratio Mg : MgO = 2 : 2</li><li>× M of MgO (24.31 + 16.00 = 40.31 g/mol)</li></ol>',
     'How many grams of MgO form?', ['40.3 g','48.6 g','80.6 g'], 2,
     '48.62 ÷ 24.31 = 2.00 mol Mg → 2.00 mol MgO → 2.00 × 40.31 = 80.6 g.'),
   B('One more with a different ratio.',
     '<p>{CH4 + 2O2 → CO2 + 2H2O}. You burn 16.05 g of methane.</p><ol><li>M of {CH4} = 12.01 + 4(1.01) = 16.05, so 1.00 mol</li><li>Ratio {CH4} : {CO2} = 1 : 1</li><li>× M of {CO2} = 44.01 g/mol</li></ol>',
     'How many grams of {CO2} form?', ['44.0 g','88.0 g','16.1 g'], 0,
     '1.00 mol {CH4} → 1.00 mol {CO2} → 1.00 × 44.01 = 44.0 g.')
 ]},
 {id:'k4', title:'Limiting reagent', sub:'What runs out first', bites:[
   B('Think sandwiches.',
     '<p>Each cheese sandwich needs 2 slices of bread and 1 slice of cheese. You have 10 bread and 3 cheese.</p><p>Bread is enough for 5 sandwiches. Cheese is enough for only 3. So you make <b>3</b>, and the cheese runs out first.</p>',
     'What limits how many sandwiches you can make?', ['The bread','The cheese','Neither'], 1,
     'Cheese is enough for only 3 sandwiches, fewer than the bread allows, so cheese runs out first.'),
   B('The chemistry words.',
     '<p>The <b>limiting reagent</b> is the reactant that runs out first. It decides how much product you can make.</p><p>The other reactant is <b>in excess</b>. Some of it is left over.</p>',
     'In the sandwich example, the bread is…', ['the limiting reagent','in excess','the product'], 1,
     'Bread is left over after the cheese runs out, so it’s in excess.'),
   B('Watch me find it.',
     '<p>{2H2 + O2 → 2H2O}. You have 4 mol {H2} and 1 mol {O2}. Work out the product from each one:</p><p>{H2}: 4 × (2/2) = 4 mol {H2O}<br>{O2}: 1 × (2/1) = 2 mol {H2O}</p><p>The <b>smaller</b> answer wins. {O2} is limiting, and you make 2 mol of water.</p>',
     'Which reactant is limiting here?', ['{H2}','{O2}','Neither'], 1,
     '{O2} can only make 2 mol of water, less than the 4 mol from {H2}, so {O2} runs out first.'),
   B('Your turn!',
     '<p>{N2 + 3H2 → 2NH3}. You have 2 mol {N2} and 3 mol {H2}.</p><p>{N2}: 2 × (2/1) = 4 mol {NH3}<br>{H2}: 3 × (2/3) = ? mol {NH3}</p>',
     'How many moles of {NH3} can actually form?', ['2 mol','4 mol','6 mol'], 0,
     '{H2} gives 3 × 2/3 = 2 mol, the smaller amount, so {H2} is limiting and only 2 mol of {NH3} form.'),
   B('Careful with grams.',
     '<p>{2Mg + O2 → 2MgO}. You have 24.31 g Mg and 32.00 g {O2}.</p><p>Convert first: Mg = 1.00 mol, {O2} = 1.00 mol.<br>Mg: 1.00 × (2/2) = 1.00 mol MgO<br>{O2}: 1.00 × (2/1) = 2.00 mol MgO</p>',
     'Which reactant is limiting?', ['{O2}','They run out together','Mg'], 2,
     'Mg makes only 1.00 mol of MgO, the smaller amount, so Mg is limiting even though the moles started equal.')
 ]},
 {id:'k28', title:'Percent yield', sub:'How close you got in the lab', bites:[
   B('Two kinds of yield.',
     '<p>The <b>theoretical yield</b> is the most product you could make. It comes from your stoichiometry, using the limiting reagent.</p><p>The <b>actual yield</b> is what you really collect in the lab.</p>',
     'Which is usually bigger?', ['Actual yield','Theoretical yield','They’re always equal'], 1,
     'The theoretical yield is the maximum possible, so the actual yield is usually smaller.'),
   B('Why you get less.',
     '<p>Real labs lose a little product. Some sticks to the glassware, some spills, and some reactions don’t fully finish.</p>',
     'Which is a reason the actual yield is lower?', ['Product sticks to glassware','The equation was balanced','The molar mass is too big'], 0,
     'Product left on beakers and filter paper never gets weighed, so you collect less.'),
   B('Here’s the formula.',
     '<p><b>Percent yield = actual ÷ theoretical × 100</b></p><p>Example: theoretical 50.0 g, actual 40.0 g.<br>40.0 ÷ 50.0 × 100 = <b>80.0%</b></p>',
     'In the percent yield formula, what goes on top?', ['Actual yield','Theoretical yield','Molar mass'], 0,
     'Actual yield goes on top: actual ÷ theoretical × 100.'),
   B('Watch me do one.',
     '<p>You calculated a theoretical yield of 36.0 g of water and collected 30.6 g.</p><p>30.6 ÷ 36.0 = 0.850<br>0.850 × 100 = <b>85.0%</b></p>',
     'What is the percent yield?', ['118%','85.0%','30.6%'], 1,
     '30.6 ÷ 36.0 × 100 = 85.0%.'),
   B('Your turn!',
     '<p>Your theoretical yield of MgO is 80.62 g. You collect 72.6 g.</p><p>Use actual ÷ theoretical × 100. If you ever get more than 100%, something went wrong, like a wet product.</p>',
     'What is the percent yield?', ['72.6%','111%','90.1%'], 2,
     '72.6 ÷ 80.62 × 100 = 90.1%.')
 ]}
]};

const UNIT_O = {name:'Organic Chemistry', lessons:[
 {id:'o20', title:'What is organic chemistry?', sub:'Carbon, the great connector', bites:[
  B('Welcome to carbon’s world.',
   '<p><b>Organic chemistry</b> is the chemistry of carbon compounds. Fuels, plastics, medicines, food and your own body are full of them.</p><p>Most organic compounds contain carbon and hydrogen, often with a few other elements like oxygen or nitrogen.</p>',
   'Organic chemistry is mainly the study of compounds containing…', ['iron','carbon','sodium'], 1,
   'Organic compounds are built around carbon.'),
  B('Here’s why carbon is special.',
   '<p>A <b>covalent bond</b> is a pair of electrons shared between two atoms. We draw it as a line, like C–H.</p><p>Carbon has 4 valence electrons, so it forms <b>4 bonds</b>. Hydrogen forms 1 bond.</p>',
   'How many bonds does a carbon atom make?', ['2','3','4'], 2,
   'Carbon has 4 valence electrons and shares each one, making 4 bonds.'),
  B('Carbon loves other carbons.',
   '<p>Carbon atoms can bond to each other again and again, making long <b>chains</b> like C–C–C–C. The ends can even join up to make a <b>ring</b>.</p><p>That’s why there are millions of different organic compounds.</p>',
   'Why are there so many organic compounds?', ['Carbon only bonds to oxygen','Carbon atoms can link into chains and rings','Carbon is a metal'], 1,
   'Carbon bonds to other carbons, forming chains and rings of any size.'),
  B('Simplest case first.',
   '<p>A <b>hydrocarbon</b> contains only carbon and hydrogen. Methane, {CH4}, is the simplest: one carbon with 4 hydrogens, using all 4 of carbon’s bonds.</p>',
   'Which of these is a hydrocarbon?', ['{CH4}','{CH3OH}','{CO2}'], 0,
   '{CH4} has only C and H. The others contain oxygen.')
 ]},
 {id:'b1', title:'Alkanes', sub:'Single bonds and the prefixes meth- to dec-', bites:[
  B('Meet the simplest family.',
   '<p><b>Alkanes</b> are hydrocarbons with only <b>single bonds</b> (C–C and C–H). Their names end in <b>-ane</b>.</p><p>Every carbon is holding as many hydrogens as it can, so alkanes are called <b>saturated</b>.</p>',
   'What kind of carbon–carbon bonds do alkanes have?', ['Only single bonds','At least one double bond','A triple bond'], 0,
   'Alkanes have only single bonds, which makes them saturated.'),
  B('Memorize these ten.',
   '<p>The prefix tells you how many carbons are in the chain:</p><p>1 <b>meth-</b>, 2 <b>eth-</b>, 3 <b>prop-</b>, 4 <b>but-</b>, 5 <b>pent-</b>, 6 <b>hex-</b>, 7 <b>hept-</b>, 8 <b>oct-</b>, 9 <b>non-</b>, 10 <b>dec-</b></p><p>So propane has 3 carbons and octane has 8.</p>',
   'How many carbons does pentane have?', ['4','5','6'], 1,
   'Pent- means 5 carbons.'),
  B('There’s a formula pattern.',
   '<p>Alkanes follow <b>C<sub>n</sub>H<sub>2n+2</sub></b>. Double the carbons and add 2 to get the hydrogens.</p><p>Propane: 3 carbons, 2×3+2 = 8 hydrogens, so {C3H8}.</p>',
   'What is the formula of butane (4 carbons)?', ['{C4H8}','{C4H10}','{C4H12}'], 1,
   '2×4+2 = 10 hydrogens, so butane is {C4H10}.'),
  B('Your turn!',
   '<p>Use the same steps: prefix gives n, then hydrogens = 2n + 2.</p><p>Hexane starts with hex-, so n = 6.</p>',
   'What is the formula of hexane?', ['{C6H12}','{C6H6}','{C6H14}'], 2,
   'Hex- is 6 carbons, and 2×6+2 = 14 hydrogens: {C6H14}.')
 ]},
 {id:'o21', title:'Structural and condensed formulas', sub:'Different ways to write one molecule', bites:[
  B('A formula can hide the shape.',
   '<p>A <b>molecular formula</b> like {C3H8} just counts atoms. It doesn’t show how they connect.</p><p>A <b>structural formula</b> draws every atom and every bond as a line. For propane, three carbons sit in a row, C–C–C, with hydrogens filling the rest of the bonds.</p>',
   'Which formula shows every bond as a line?', ['Molecular formula','Structural formula'], 1,
   'A structural formula draws all the atoms and bonds.'),
  B('Here’s the shortcut.',
   '<p>A <b>condensed formula</b> writes each carbon with its hydrogens, in order along the chain. Propane is {CH3CH2CH3}.</p><p>End carbons have 3 hydrogens ({CH3}) and middle carbons have 2 ({CH2}). Each still has 4 bonds in total.</p>',
   'In {CH3CH2CH3}, how many hydrogens does the middle carbon have?', ['1','2','3'], 1,
   'The middle carbon is {CH2}: 2 hydrogens plus 2 bonds to its carbon neighbours.'),
  B('Watch me do one.',
   '<p>Butane is 4 carbons in a row. The two ends are {CH3} and the two middles are {CH2}.</p><p>So butane is {CH3CH2CH2CH3}. Count it up: 4 C and 10 H, matching {C4H10}.</p>',
   'What is the condensed formula of butane?', ['{CH3CH2CH2CH3}','{CH3CH3CH3CH3}','{CH2CH2CH2CH2}'], 0,
   'Ends are {CH3}, middles are {CH2}: {CH3CH2CH2CH3}.'),
  B('Repeating bits get squeezed.',
   '<p>Long chains can be shortened with brackets. {CH3(CH2)4CH3} means {CH3}, then four {CH2} groups, then {CH3}.</p><p>That’s 6 carbons in total: hexane.</p>',
   'How many carbons are in {CH3(CH2)3CH3}?', ['3','4','5'], 2,
   'Two {CH3} ends plus three {CH2} groups is 5 carbons: pentane.')
 ]},
 {id:'o22', title:'Alkenes and alkynes', sub:'Double and triple bonds', bites:[
  B('Carbons can share more.',
   '<p>Two carbons can share two pairs of electrons, making a <b>double bond</b>, C=C. Hydrocarbons with a C=C are <b>alkenes</b>, ending in <b>-ene</b>.</p><p>Ethene is {CH2=CH2}. Each carbon has 2 H plus a double bond, so 4 bonds total.</p>',
   'Which bond is found in an alkene?', ['C≡C','C=C','Only C–C'], 1,
   'Alkenes contain a carbon–carbon double bond, C=C.'),
  B('Now a triple.',
   '<p>Sharing three pairs makes a <b>triple bond</b>, C≡C. Hydrocarbons with a C≡C are <b>alkynes</b>, ending in <b>-yne</b>.</p><p>Ethyne, {HC≡CH}, is the gas in welding torches (often called acetylene).</p>',
   'What ending do alkynes have?', ['-ane','-ene','-yne'], 2,
   'Alkynes end in -yne and contain a triple bond.'),
  B('Fewer bonds left for hydrogen.',
   '<p>Every extra bond between carbons uses up spots for hydrogen.</p><ul><li>Alkane: C<sub>n</sub>H<sub>2n+2</sub> (ethane {C2H6})</li><li>Alkene: C<sub>n</sub>H<sub>2n</sub> (ethene {C2H4})</li><li>Alkyne: C<sub>n</sub>H<sub>2n−2</sub> (ethyne {C2H2})</li></ul>',
   'Propene has 3 carbons and one C=C. What is its formula?', ['{C3H6}','{C3H8}','{C3H4}'], 0,
   'Alkenes are C<sub>n</sub>H<sub>2n</sub>, so 3 carbons give 6 hydrogens: {C3H6}.'),
  B('One more word.',
   '<p>Alkenes and alkynes could hold more hydrogen if their multiple bond opened up, so they’re called <b>unsaturated</b>. That multiple bond also makes them more reactive than alkanes.</p>',
   'Which compound is unsaturated?', ['Ethane','Propane','Ethene'], 2,
   'Ethene has a C=C double bond, so it is unsaturated.')
 ]},
 {id:'o23', title:'Isomers', sub:'Same formula, different shape', bites:[
  B('Same atoms, new arrangement.',
   '<p><b>Isomers</b> are compounds with the <b>same molecular formula</b> but a <b>different structure</b>.</p><p>Because they’re shaped differently, isomers are different substances with different properties, like boiling point.</p>',
   'Isomers have the same…', ['structure','molecular formula','boiling point'], 1,
   'Isomers share a molecular formula but have different structures and properties.'),
  B('Here’s the classic example.',
   '<p>{C4H10} can be a straight chain of 4 carbons: butane, {CH3CH2CH2CH3}.</p><p>Or it can be a chain of 3 with one carbon branching off the middle: {CH3CH(CH3)CH3}, called 2-methylpropane.</p>',
   'Butane and 2-methylpropane are isomers. What formula do they share?', ['{C4H10}','{C3H8}','{C4H8}'], 0,
   'Both have 4 carbons and 10 hydrogens, arranged differently.'),
  B('Watch out for this trap.',
   '<p>Bending a chain on paper doesn’t make a new isomer. Bonds can rotate, so a chain of 4 carbons drawn with a kink is still butane.</p><p>A real isomer has a different <b>connection</b> pattern, like a carbon branching off the middle.</p>',
   'A 4-carbon chain drawn in an L shape is…', ['a new isomer of butane','still butane'], 1,
   'All 4 carbons are still connected end to end, so it is the same molecule.'),
  B('Isomers add up fast.',
   '<p>Pentane, {C5H12}, has <b>3</b> isomers: a straight chain, a chain of 4 with one branch, and a chain of 3 with two branches on the middle carbon.</p><p>Bigger alkanes have many more. Decane has 75!</p>',
   'How many isomers does {C5H12} have?', ['2','3','5'], 1,
   '{C5H12} has 3 isomers: straight, one branch, and two branches on one carbon.')
 ]},
 {id:'b2', title:'Naming: the parent chain', sub:'Step one of IUPAC names', bites:[
  B('Names follow rules.',
   '<p>Chemists use <b>IUPAC</b> naming rules so every compound has one clear name.</p><p>Step one: find the <b>parent chain</b>, the longest continuous chain of carbons. It gives the base name, like pentane or hexane.</p>',
   'What is the parent chain?', ['The longest continuous carbon chain','The first carbon written','All the hydrogens'], 0,
   'The parent chain is the longest unbroken chain of carbons.'),
  B('Follow the path, not the line.',
   '<p>The longest chain doesn’t have to be written in a straight line. Trace every path from one end carbon to another and count.</p><p>A carbon hanging off the chain is a <b>branch</b>, not part of the parent.</p>',
   'When finding the parent chain, you should…', ['count only the top row','trace every path and pick the longest','count every carbon in the molecule'], 1,
   'The chain can bend, so check every path and take the longest one.'),
  B('Watch me do one.',
   '<p>Look at {CH3CH(CH3)CH2CH2CH3}. The {(CH3)} in brackets is a branch hanging off carbon 2.</p><p>The main chain is {CH3}, {CH}, {CH2}, {CH2}, {CH3}: 5 carbons. So the parent is <b>pentane</b>, with one branch.</p>',
   'What is the parent chain of {CH3CH(CH3)CH2CH2CH3}?', ['Butane','Hexane','Pentane'], 2,
   'Five carbons run unbroken along the main chain. The bracketed {CH3} is a branch.'),
  B('Your turn!',
   '<p>Same method: ignore the bracketed branches and count the main chain carbons.</p><p>Molecule: {CH3CH2CH(CH3)CH2CH2CH3}</p>',
   'How many carbons are in its parent chain?', ['5','6','7'], 1,
   '{CH3}, {CH2}, {CH}, {CH2}, {CH2}, {CH3}: 6 carbons, so the parent is hexane.')
 ]},
 {id:'o24', title:'Naming branches', sub:'Methyl, ethyl and numbering', bites:[
  B('Branches get their own names.',
   '<p>A branch is called an <b>alkyl group</b>. Take the alkane name and change -ane to <b>-yl</b>.</p><ul><li>{CH3} is <b>methyl</b> (1 carbon)</li><li>{CH2CH3} is <b>ethyl</b> (2 carbons)</li><li>3 carbons is <b>propyl</b></li></ul>',
   'What is a 2-carbon branch called?', ['Methyl','Ethyl','Ethane'], 1,
   'Ethane minus its -ane plus -yl gives ethyl.'),
  B('Number from the closer end.',
   '<p>Number the parent chain from the end that gives the branch the <b>lowest number</b>. That number is the <b>locant</b>.</p><p>{CH3CH(CH3)CH2CH2CH3}: from the left, the branch is on C2. From the right it would be C4. Use 2.</p>',
   'Why do we number from the left in this example?', ['It gives the branch the lowest number','We always start on the left','The left end has more hydrogens'], 0,
   'Pick the direction that gives branches the lowest locants.'),
  B('Put it all together.',
   '<p>Write: locant, hyphen, branch name, then the parent name, all as one word.</p><p>{CH3CH(CH3)CH2CH2CH3} is <b>2-methylpentane</b>.</p>',
   'Which is written correctly?', ['2-methylpentane','methyl-2-pentane','2-pentanemethyl'], 0,
   'Locant, then branch, then parent: 2-methylpentane.'),
  B('Two of the same branch.',
   '<p>If a branch appears twice, use <b>di-</b> (2), and <b>tri-</b> for 3. Give every branch a locant, separated by commas.</p><p>{CH3CH(CH3)CH(CH3)CH3} has methyls on C2 and C3 of a 4-carbon chain: <b>2,3-dimethylbutane</b>.</p>',
   'Methyl groups sit on C2 and C4 of a pentane chain. What is the name?', ['2,4-methylpentane','dimethylpentane','2,4-dimethylpentane'], 2,
   'Two methyls means di-, and each gets a locant: 2,4-dimethylpentane.'),
  B('Try one.',
   '<p>Recap: find the parent, number from the end nearest the branch, then write locant-branch-parent.</p><p>Molecule: {CH3CH2CH(CH3)CH2CH2CH3}. The parent is 6 carbons. From the left, the branch is on C3; from the right, C4.</p>',
   'What is its name?', ['4-methylhexane','3-methylhexane','3-methylpentane'], 1,
   'Use the lower locant, 3, on a hexane parent: 3-methylhexane.')
 ]},
 {id:'o25', title:'Naming alkenes and alkynes', sub:'Where is the multiple bond?', bites:[
  B('The ending changes first.',
   '<p>Alkenes and alkynes use the same prefixes. Just swap the ending: <b>-ene</b> for a C=C, <b>-yne</b> for a C≡C.</p><p>A 3-carbon chain with a double bond is propene. A 4-carbon chain with a triple bond is butyne.</p>',
   'A 5-carbon chain with one C≡C is called…', ['pentene','pentane','pentyne'], 2,
   '5 carbons is pent-, and a triple bond takes -yne: pentyne.'),
  B('Here’s the new rule.',
   '<p>From 4 carbons up, the multiple bond can sit in different places. Number the chain from the end <b>closest to the multiple bond</b>.</p><p>The locant is the lower-numbered carbon of the bond.</p>',
   'Which end do you number from in an alkene?', ['The end closest to the C=C','The end with the most hydrogens','Always the left end'], 0,
   'The double bond gets the lowest possible number.'),
  B('Watch me do two.',
   '<p>{CH2=CHCH2CH3}: the double bond is between C1 and C2, so it’s <b>1-butene</b> (also written but-1-ene).</p><p>{CH3CH=CHCH3}: the double bond is between C2 and C3, so it’s <b>2-butene</b>. They are isomers!</p>',
   'What is {CH3CH=CHCH3}?', ['1-butene','2-butene','3-butene'], 1,
   'The C=C starts at carbon 2 from either end, so it’s 2-butene.'),
  B('Your turn!',
   '<p>Same method for alkynes: count the chain, number from the end nearest the triple bond, and use the lower carbon of the bond.</p><p>Molecule: {CH3C≡CCH2CH3}</p>',
   'What is its name?', ['3-pentyne','2-pentyne','2-pentene'], 1,
   '5 carbons with a triple bond starting at C2 from the left: 2-pentyne. Numbering from the right would give 3, which is higher.')
 ]},
 {id:'o26', title:'Rings and benzene', sub:'Cyclic hydrocarbons', bites:[
  B('Chains can close up.',
   '<p>If the two ends of a chain bond to each other, you get a ring. Ring alkanes are <b>cycloalkanes</b>: add <b>cyclo-</b> to the name.</p><p>Six carbons in a ring is <b>cyclohexane</b>.</p>',
   'What is a ring of 5 carbons with single bonds called?', ['Pentane','Cyclopentane','Cyclohexane'], 1,
   'Cyclo- plus pent- (5) plus -ane: cyclopentane.'),
  B('Closing a ring costs hydrogens.',
   '<p>Joining the ends uses one bond from each end carbon, so the ring loses 2 hydrogens compared with the chain.</p><p>Hexane is {C6H14}. Cyclohexane is {C6H12}. Every carbon in the ring is a {CH2}.</p>',
   'Cyclopropane has 3 carbons. What is its formula?', ['{C3H8}','{C3H6}','{C3H4}'], 1,
   'Each ring carbon is {CH2}, so 3 carbons give {C3H6}.'),
  B('Meet a famous ring.',
   '<p><b>Benzene</b>, {C6H6}, is a 6-carbon ring with one hydrogen on each carbon. It’s often drawn with alternating single and double bonds.</p><p>Really, those extra electrons are spread evenly around the whole ring, which makes benzene very stable.</p>',
   'What is the formula of benzene?', ['{C6H12}','{C6H14}','{C6H6}'], 2,
   'Benzene is a 6-carbon ring with one H per carbon: {C6H6}.'),
  B('One more word.',
   '<p>Compounds containing a benzene ring are called <b>aromatic</b>. Many have strong smells, which is where the name came from.</p><p>Benzene itself is a known carcinogen, so its levels in gasoline are limited in Canada.</p>',
   'A compound with a benzene ring is called…', ['aromatic','saturated','an alkyne'], 0,
   'Benzene-ring compounds are aromatic.')
 ]},
 {id:'b3', title:'Functional groups and alcohols', sub:'The –OH group', bites:[
  B('Now we add other atoms.',
   '<p>A <b>functional group</b> is a specific group of atoms attached to a carbon chain. It decides how the molecule behaves.</p><p>Molecules with the same functional group act alike, so we sort them into families.</p>',
   'What mainly decides how an organic molecule reacts?', ['Its functional group','Its colour','How long its name is'], 0,
   'The functional group controls a molecule’s properties and reactions.'),
  B('First family: alcohols.',
   '<p>An <b>alcohol</b> has an <b>–OH</b> group (hydroxyl group) bonded to a carbon.</p><p>Name it by dropping the -e of the alkane and adding <b>-ol</b>. Methane becomes <b>methanol</b>, {CH3OH}. Ethane becomes <b>ethanol</b>, {CH3CH2OH}.</p>',
   'What functional group do alcohols have?', ['C=C','–OH','C≡C'], 1,
   'Alcohols contain the hydroxyl group, –OH.'),
  B('Location matters too.',
   '<p>For 3 carbons or more, add a locant for the carbon holding the –OH, numbering from the closer end.</p><p>{CH3CH(OH)CH3} has the –OH on the middle carbon: <b>2-propanol</b>, also called isopropyl alcohol. It’s rubbing alcohol.</p>',
   'What is {CH3CH2CH2OH}?', ['2-propanol','1-propanol','propane'], 1,
   'The –OH is on an end carbon, C1, so it’s 1-propanol.'),
  B('Don’t mix these up.',
   '<p>The –OH in an alcohol is covalently bonded to carbon. It is <b>not</b> a hydroxide ion, {OH^-}, so alcohols are not bases.</p><p>Ethanol is the alcohol in drinks and is blended into Canadian gasoline. Methanol is toxic and can cause blindness.</p>',
   'Is ethanol a base?', ['Yes, it has OH','No, its –OH is not a hydroxide ion'], 1,
   'The –OH is part of the molecule, not a free {OH^-} ion, so alcohols aren’t bases.')
 ]},
 {id:'o27', title:'Aldehydes and ketones', sub:'The C=O group', bites:[
  B('Meet the carbonyl.',
   '<p>A carbon double-bonded to an oxygen, C=O, is called a <b>carbonyl group</b>. Two families have it: aldehydes and ketones.</p><p>The difference is <b>where</b> the C=O sits.</p>',
   'What is a carbonyl group?', ['C–OH','C=O','C=C'], 1,
   'A carbonyl is a carbon double-bonded to oxygen.'),
  B('C=O at the end.',
   '<p>In an <b>aldehyde</b>, the C=O is on an <b>end</b> carbon, which also holds an H. It’s written <b>–CHO</b>. Names end in <b>-al</b>.</p><p>Ethanal is {CH3CHO}. Methanal, {HCHO}, is formaldehyde, used to preserve specimens.</p>',
   'What ending do aldehydes have?', ['-ol','-one','-al'], 2,
   'Aldehydes end in -al, like ethanal.'),
  B('C=O in the middle.',
   '<p>In a <b>ketone</b>, the C=O is on a <b>middle</b> carbon, with carbons on both sides. Names end in <b>-one</b>.</p><p>Propanone, {CH3COCH3}, is acetone, found in nail polish remover. A ketone needs at least 3 carbons.</p>',
   'Why can’t a ketone have only 2 carbons?', ['The C=O carbon needs a carbon on each side','Ketones need a triple bond','Oxygen can’t bond to carbon'], 0,
   'A ketone’s C=O must sit between two other carbons, so the minimum is 3.'),
  B('Try one.',
   '<p>Check where the C=O is: on the end means aldehyde (-al), in the middle means ketone (-one).</p><p>Molecule: {CH3CH2CHO}</p>',
   'What is {CH3CH2CHO}?', ['Propanone','Propanal','Propanol'], 1,
   '–CHO is on the end, so it’s an aldehyde with 3 carbons: propanal.')
 ]},
 {id:'o28', title:'Carboxylic acids and esters', sub:'Sour acids and fruity smells', bites:[
  B('These ones really are acids.',
   '<p>A <b>carboxylic acid</b> has a <b>–COOH</b> group: a C=O and an –OH on the same end carbon. Names end in <b>-oic acid</b>.</p><p>Ethanoic acid, {CH3COOH}, is acetic acid, the acid in vinegar.</p>',
   'What group do carboxylic acids have?', ['–OH only','–CHO','–COOH'], 2,
   'Carboxylic acids contain –COOH.'),
  B('Count every carbon.',
   '<p>The carbon in –COOH counts as part of the chain.</p><p>{HCOOH} has 1 carbon: methanoic acid (ant stings). {CH3COOH} has 2: ethanoic acid. They are weak acids, which is why vinegar tastes sour.</p>',
   'What is {CH3CH2COOH}?', ['Ethanoic acid','Propanoic acid','Butanoic acid'], 1,
   'Count the –COOH carbon too: 3 carbons, so propanoic acid.'),
  B('Acid plus alcohol makes this.',
   '<p>A carboxylic acid reacts with an alcohol to make an <b>ester</b> and water. Esters have a <b>–COO–</b> link with carbon on both sides.</p><p>{CH3COOH + CH3CH2OH → CH3COOCH2CH3 + H2O}</p><p>Many esters smell fruity and are used in flavourings.</p>',
   'An acid and an alcohol react to make an ester and…', ['water','carbon dioxide','hydrogen gas'], 0,
   'Making an ester releases a water molecule.'),
  B('Esters have two-part names.',
   '<p>Name the alcohol part first as an alkyl group, then the acid part ending in <b>-oate</b>.</p><p>Ethanol + ethanoic acid gives <b>ethyl ethanoate</b>, a solvent in some glues and nail polish removers.</p>',
   'Methanol + propanoic acid gives which ester?', ['Propyl methanoate','Methyl propanoate','Methyl propanol'], 1,
   'Alcohol part first (methyl), acid part with -oate (propanoate): methyl propanoate.')
 ]},
 {id:'o29', title:'Ethers and alkyl halides', sub:'Oxygen bridges and halogen swaps', bites:[
  B('Oxygen in the middle.',
   '<p>An <b>ether</b> has an oxygen bonded between two carbon groups: C–O–C.</p><p>{CH3OCH3} is methoxymethane (dimethyl ether). {CH3CH2OCH2CH3} is ethoxyethane (diethyl ether), once used as a surgical anaesthetic.</p>',
   'What link is found in an ether?', ['C–O–C','–OH','C=O'], 0,
   'Ethers have an oxygen bridging two carbons.'),
  B('Here’s a neat isomer.',
   '<p>Ethanol, {CH3CH2OH}, and methoxymethane, {CH3OCH3}, both have the formula {C2H6O}.</p><p>So they are isomers. Ethanol is a liquid at room temperature, while methoxymethane is a gas.</p>',
   'Why are ethanol and methoxymethane isomers?', ['Same formula, different structure','Both are alcohols','Both are gases'], 0,
   'Both are {C2H6O}, but the atoms connect differently.'),
  B('Swap in a halogen.',
   '<p>An <b>alkyl halide</b> has a halogen (F, Cl, Br or I) in place of a hydrogen. Name the halogen as a branch: <b>fluoro, chloro, bromo, iodo</b>.</p><p>{CH3Cl} is chloromethane. {CH2Cl2} is dichloromethane, a paint stripper solvent.</p>',
   'What is {CH3Br}?', ['Bromide methane','Bromomethane','Methyl bromine'], 1,
   'Halogens are named as prefixes: bromo + methane = bromomethane.'),
  B('Some cause big problems.',
   '<p><b>CFCs</b> (chlorofluorocarbons) contain carbon, chlorine and fluorine. They were used in fridges and spray cans.</p><p>CFCs destroy the ozone layer, so they were phased out under the <b>Montreal Protocol</b> (1987).</p>',
   'Which elements are in CFCs?', ['Carbon, fluorine, chlorine','Carbon, fluorine, calcium','Copper, fluorine, chlorine'], 0,
   'CFC stands for chlorofluorocarbon: chlorine, fluorine and carbon.')
 ]},
 {id:'o30', title:'Amines and amides', sub:'Organic compounds with nitrogen', bites:[
  B('Nitrogen joins the party.',
   '<p>Nitrogen forms <b>3 bonds</b>. Ammonia is {NH3}. If you replace an H with a carbon group, you get an <b>amine</b>.</p><p>{CH3NH2} is methanamine (methylamine). Amines often smell fishy.</p>',
   'What group does methanamine have?', ['–OH','–NH2','–COOH'], 1,
   'Amines contain nitrogen, here as –NH2.'),
  B('Amines are bases.',
   '<p>Like ammonia, amines are <b>weak bases</b>. That’s why squeezing lemon (an acid) on fish cuts the fishy smell.</p>',
   'Amines behave as…', ['weak acids','weak bases','neither'], 1,
   'Amines are related to ammonia and act as weak bases.'),
  B('Add a C=O next to N.',
   '<p>An <b>amide</b> has a C=O carbon bonded directly to a nitrogen: <b>–CONH2</b>. Names end in <b>-amide</b>.</p><p>{CH3CONH2} is ethanamide.</p>',
   'What makes an amide different from an amine?', ['An amide has a C=O beside the nitrogen','An amide has no nitrogen','An amide has a triple bond'], 0,
   'In an amide, the nitrogen is bonded to a carbonyl carbon.'),
  B('Amides hold you together.',
   '<p>Amide links join amino acids into <b>proteins</b>, like the keratin in your hair. The same link holds together <b>nylon</b>.</p>',
   'Which material uses amide links?', ['Nylon','Benzene','Methane'], 0,
   'Nylon is held together by amide links, like proteins.')
 ]},
 {id:'o1', title:'Polarity and intermolecular forces', sub:'Why some things boil and dissolve easily', bites:[
  B('Some atoms pull harder.',
   '<p><b>Electronegativity</b> is how strongly an atom pulls on shared electrons. O and N pull much harder than C and H.</p><p>In a C–O or O–H bond, electrons sit closer to the O, making the bond <b>polar</b>. C–H bonds are nearly nonpolar.</p>',
   'Which bond is polar?', ['C–H','O–H','C–C'], 1,
   'Oxygen pulls electrons much harder than hydrogen, so O–H is polar.'),
  B('So hydrocarbons are nonpolar.',
   '<p>Hydrocarbons have only C–C and C–H bonds, so they are <b>nonpolar</b>. Adding –OH, C=O, or –NH2 makes a molecule more polar.</p><p>Molecules attract each other with <b>intermolecular forces</b>. Stronger forces mean a higher boiling point.</p>',
   'Which is nonpolar?', ['Ethanol','Ethanoic acid','Hexane'], 2,
   'Hexane is a hydrocarbon with only C–C and C–H bonds.'),
  B('Three forces, weakest to strongest.',
   '<ol><li><b>London dispersion</b>: in all molecules, and stronger in bigger molecules.</li><li><b>Dipole–dipole</b>: between polar molecules.</li><li><b>Hydrogen bonding</b>: when H is bonded to O or N. Alcohols, acids and amines have it.</li></ol>',
   'Which molecules can hydrogen bond?', ['Those with H on O or N','Only hydrocarbons','Only gases'], 0,
   'Hydrogen bonding needs an H attached to O or N, like the –OH in alcohols.'),
  B('See it in boiling points.',
   '<p>Ethane boils at −89 °C. Methoxymethane (polar ether) boils at −24 °C. Ethanol, with hydrogen bonding, boils at 78 °C.</p><p>Size matters too: methane boils at −162 °C, but octane boils at 126 °C thanks to stronger dispersion forces.</p>',
   'Why does ethanol boil much higher than ethane?', ['It has hydrogen bonding','It is smaller','It is nonpolar'], 0,
   'Ethanol’s –OH group lets it hydrogen bond, so more energy is needed to boil it.'),
  B('Like dissolves like.',
   '<p>Polar substances dissolve in polar ones, and nonpolar in nonpolar. Ethanol mixes with water. Hexane and oil don’t.</p><p>But a long carbon chain is nonpolar, so big alcohols like octanol barely dissolve in water.</p>',
   'Which dissolves best in water?', ['Hexane','Ethanol','Octane'], 1,
   'Ethanol is polar and can hydrogen bond with water. Hexane and octane are nonpolar.')
 ]},
 {id:'b5', title:'Polymers', sub:'Long chains made of repeating units', bites:[
  B('Tiny links, giant chains.',
   '<p>A <b>polymer</b> is a huge molecule made of many small repeating units called <b>monomers</b>, joined like links in a chain.</p><p>Plastics, rubber, proteins and starch are all polymers.</p>',
   'The small repeating units in a polymer are called…', ['monomers','isomers','alkyls'], 0,
   'Monomers link together to form a polymer.'),
  B('Pop open the double bond.',
   '<p>In <b>addition polymerization</b>, alkene monomers open their <b>C=C</b> double bonds and join end to end. Nothing else is made.</p><p>Ethene, {CH2=CH2}, becomes <b>polyethylene</b>, used in plastic bags and bottles.</p>',
   'In addition polymerization, which bond opens up?', ['C–H','C=C','O–H'], 1,
   'The alkene’s C=C opens so monomers can bond to each other.'),
  B('Change the monomer, change the plastic.',
   '<ul><li>Propene → polypropylene (yogurt tubs)</li><li>Chloroethene (vinyl chloride) → PVC (pipes)</li><li>Styrene → polystyrene (foam cups)</li></ul><p>All are addition polymers made from monomers with a C=C.</p>',
   'Which monomer makes PVC?', ['Ethene','Styrene','Chloroethene'], 2,
   'Chloroethene, also called vinyl chloride, makes polyvinyl chloride.'),
  B('Now a second kind.',
   '<p>In <b>condensation polymerization</b>, two monomers join and release a small molecule, usually <b>water</b>, at each link.</p><p>Acid + alcohol links make <b>polyesters</b> like PET (drink bottles). Acid + amine links make <b>polyamides</b> like nylon.</p>',
   'What does condensation polymerization release at each link?', ['Nothing','A small molecule like water','A double bond'], 1,
   'Each new link in a condensation polymer gives off a small molecule, usually water.')
 ]},
 {id:'o31', title:'Organic compounds and society', sub:'Fuels, plastics and the environment', bites:[
  B('Most fuels are hydrocarbons.',
   '<p>Natural gas (mostly methane), propane and gasoline are hydrocarbons. Burning them with plenty of oxygen is <b>complete combustion</b>, making {CO2} and {H2O}.</p><p>{C3H8 + 5O2 → 3CO2 + 4H2O}</p>',
   'Complete combustion of a hydrocarbon makes…', ['{CO2} and {H2O}','{CO} and {H2}','{C} and {O2}'], 0,
   'With enough oxygen, hydrocarbons burn to carbon dioxide and water.'),
  B('Two big downsides.',
   '<p>The {CO2} from burning fossil fuels is a greenhouse gas that drives climate change.</p><p>With too little oxygen, <b>incomplete combustion</b> makes <b>carbon monoxide</b>, {CO}, a deadly odourless gas. That’s why Ontario homes with fuel-burning appliances need CO alarms.</p>',
   'Which gas comes from incomplete combustion?', ['{O2}','{CO}','{N2}'], 1,
   'Not enough oxygen gives carbon monoxide, {CO}.'),
  B('Plastics stick around.',
   '<p>Polymers like polyethylene take hundreds of years to break down. They break into tiny <b>microplastics</b> found in oceans, soil and even food.</p><p>Recycling codes (1 PET, 2 HDPE, 3 PVC, 4 LDPE, 5 PP, 6 PS) tell you which polymer an item is.</p>',
   'Recycling code 1 means the plastic is…', ['PVC','PET','polystyrene'], 1,
   'Code 1 is PET, the polyester in most drink bottles.'),
  B('Organic chemistry helps too.',
   '<p>Medicines like ASA (Aspirin) are organic compounds. So are biofuels like ethanol made from corn, which can replace some gasoline.</p><p>Chemists also design replacements for harmful compounds, like the safer refrigerants that replaced CFCs.</p>',
   'Which is a biofuel?', ['Ethanol from corn','Methane from a gas well','PVC'], 0,
   'Ethanol made from crops is a renewable biofuel.')
 ]}
]};

const UNIT_V = {name:'Chemistry in the Environment', lessons:[
 {id:'v1', title:'Solutions', sub:'Solute, solvent and electrolytes', bites:[
  B('Let’s mix some stuff.',
   '<p>A <b>solution</b> is an even mixture where one substance is spread through another so well you can’t see the separate parts. Salt water and air are both solutions.</p>',
   'Which of these is a solution?',['Sand in water','Oil floating on water','Salt fully dissolved in water'],2,
   'Dissolved salt spreads evenly and you can’t see it. Sand and oil stay visibly separate.'),
  B('Two words to know.',
   '<p>The <b>solute</b> is the substance that gets dissolved. The <b>solvent</b> is the substance doing the dissolving, usually the one there’s more of.</p><p>In salt water, salt is the solute and water is the solvent.</p>',
   'In sugar water, what is the solvent?',['Water','Sugar','The sugar water'],0,
   'Water does the dissolving, so it is the solvent. Sugar is the solute.'),
  B('Water is the big one.',
   '<p>When water is the solvent, we call it an <b>aqueous</b> solution and write <b>(aq)</b> after the formula. {NaCl(aq)} means salt dissolved in water.</p><p>Water dissolves so many things that it’s called the universal solvent.</p>',
   'What does (aq) after a formula tell you?',['It is a solid','It is a gas','It is dissolved in water'],2,
   '(aq) means aqueous: dissolved in water.'),
  B('Ions in water carry electricity.',
   '<p>Ionic compounds like {NaCl} split into ions when they dissolve: {Na^+} and {Cl^-}. Those moving charged ions let the solution conduct electricity.</p><p>A solute that does this is an <b>electrolyte</b>. Sugar dissolves as whole molecules, so it’s a <b>non-electrolyte</b>.</p>',
   'Why does salt water conduct electricity?',['It contains moving ions','It is wet','It contains sugar molecules'],0,
   'Dissolved {NaCl} splits into {Na^+} and {Cl^-} ions, and moving ions carry charge.'),
  B('Quick check.',
   '<p>Remember: ionic compounds (a metal ion with a non-metal ion) make electrolytes. Molecular compounds made only of non-metals, like sugar or alcohol, usually don’t.</p>',
   'Which would make an electrolyte when dissolved in water?',['Potassium chloride, {KCl}','Sugar, {C12H22O11}','Ethanol, {C2H5OH}'],0,
   '{KCl} is ionic and splits into {K^+} and {Cl^-} ions. Sugar and ethanol are molecular.')
 ]},
 {id:'v20', title:'Solubility and precipitates', sub:'Predicting when a solid forms', bites:[
  B('Not everything dissolves.',
   '<p>A substance that dissolves well in water is <b>soluble</b>. One that barely dissolves is <b>insoluble</b>.</p><p>Chalk ({CaCO3}) is insoluble. Table salt is soluble.</p>',
   'A substance that barely dissolves in water is called…',['soluble','insoluble','aqueous'],1,
   'Insoluble means it barely dissolves.'),
  B('Here are the rules of thumb.',
   '<p><b>Almost always soluble:</b> compounds with {Na^+}, {K^+}, {NH4^+} or nitrate {NO3^-}.</p><p><b>Mostly soluble:</b> chlorides, except with silver {Ag^+} or lead {Pb^2+}.</p><p><b>Mostly insoluble:</b> carbonates and hydroxides, unless paired with {Na^+}, {K^+} or {NH4^+}.</p>',
   'Which compound is soluble?',['{AgCl}','{CaCO3}','{KNO3}'],2,
   '{KNO3} has both {K^+} and nitrate, so it’s always soluble. {AgCl} and {CaCO3} are exceptions that don’t dissolve.'),
  B('When solutions make a solid.',
   '<p>Mix two clear solutions and sometimes a cloudy solid appears. That solid is a <b>precipitate</b>, written <b>(s)</b>.</p><p>It forms when the ions swap partners and one new pair is insoluble.</p>',
   'What is a precipitate?',['A gas that bubbles off','A solvent','A solid that forms when solutions mix'],2,
   'A precipitate is an insoluble solid made when two solutions are mixed.'),
  B('Watch me do one.',
   '<p>Mix {AgNO3(aq)} with {NaCl(aq)}. Swap partners: {Ag^+} with {Cl^-}, and {Na^+} with {NO3^-}.</p><p>{NaNO3} is soluble. {AgCl} is a chloride with silver, so it’s insoluble.</p><p>{AgNO3(aq) + NaCl(aq) → AgCl(s) + NaNO3(aq)}</p>',
   'In this reaction, what is the precipitate?',['{AgCl}','{NaNO3}','{NaCl}'],0,
   'Silver chloride is insoluble, so it drops out as a white solid.'),
  B('Your turn!',
   '<p>Mix {CaCl2(aq)} with {Na2CO3(aq)}. Swapping gives {CaCO3} and {NaCl}.</p><p>Use the rules: sodium compounds dissolve; carbonates mostly don’t unless paired with {Na^+}, {K^+} or {NH4^+}.</p>',
   'Which product is the precipitate?',['{NaCl}','{CaCO3}','Neither'],1,
   'Calcium carbonate is a carbonate without {Na^+}, {K^+} or {NH4^+}, so it’s insoluble.')
 ]},
 {id:'f5', title:'Concentration', sub:'Moles per litre', bites:[
  B('How strong is a solution?',
   '<p><b>Concentration</b> tells you how much solute is in a certain volume of solution. More solute in the same volume means a more concentrated solution.</p>',
   'Two cups have the same volume. Cup A has more dissolved sugar. Which is more concentrated?',['Cup A','Cup B','They are the same'],0,
   'Same volume but more solute means higher concentration.'),
  B('Quick mole refresher.',
   '<p>A <b>mole</b> is a counting unit for particles. Find moles from mass with <b>n = m ÷ M</b>, where M is the molar mass (g/mol).</p><p>Example: {NaCl} has M = 22.99 + 35.45 = 58.44 g/mol. So 29.22 g is 29.22 ÷ 58.44 = 0.500 mol.</p>',
   'How many moles are in 116.88 g of {NaCl} (M = 58.44 g/mol)?',['0.500 mol','2.00 mol','58.44 mol'],1,
   'n = m ÷ M = 116.88 ÷ 58.44 = 2.00 mol.'),
  B('Here’s the formula.',
   '<p><b>c = n ÷ V</b></p><p>c is concentration in mol/L, n is moles of solute, V is volume of solution in <b>litres</b>.</p><p>Example: 0.500 mol of {NaCl} in 0.250 L gives c = 0.500 ÷ 0.250 = 2.00 mol/L.</p>',
   'What unit must V be in for c = n ÷ V?',['Litres','Millilitres','Grams'],0,
   'Concentration is mol per litre, so volume must be in litres.'),
  B('Watch out for millilitres.',
   '<p>Volumes are often in mL. Divide by 1000 to get litres: 500 mL = 0.500 L.</p><p>Example: 0.20 mol in 500 mL. c = 0.20 ÷ 0.500 = 0.40 mol/L.</p>',
   'What is the concentration of 0.30 mol dissolved in 600 mL?',['0.50 mol/L','0.18 mol/L','2.0 mol/L'],0,
   '600 mL = 0.600 L, and 0.30 ÷ 0.600 = 0.50 mol/L.'),
  B('Flip it around.',
   '<p>Rearrange to find moles: <b>n = c × V</b>.</p><p>Example: 0.300 L of 0.10 mol/L solution holds 0.10 × 0.300 = 0.030 mol.</p>',
   'How many moles are in 2.0 L of 0.50 mol/L solution?',['0.25 mol','4.0 mol','1.0 mol'],2,
   'n = c × V = 0.50 × 2.0 = 1.0 mol.')
 ]},
 {id:'v21', title:'Parts per million', sub:'Tiny amounts in drinking water', bites:[
  B('Some amounts are super tiny.',
   '<p>Pollutants in water are often far too small for mol/L to be handy. So we use <b>parts per million (ppm)</b>: parts of solute for every million parts of solution.</p>',
   'What does ppm stand for?',['Particles per molecule','Percent per mass','Parts per million'],2,
   'ppm means parts per million.'),
  B('Here’s the shortcut for water.',
   '<p>One litre of water has a mass of about 1 kg, which is one million mg. So in water, <b>1 ppm = 1 mg of solute per litre</b>.</p><p>ppm = mass of solute (mg) ÷ volume of water (L)</p>',
   'In water, 1 ppm equals…',['1 g per L','1 mg per L','1 mol per L'],1,
   'A litre of water is about a million mg, so 1 mg in it is 1 part per million.'),
  B('Watch me do one.',
   '<p>A 2.0 L water sample contains 3.0 mg of fluoride.</p><p>ppm = 3.0 mg ÷ 2.0 L = 1.5 ppm.</p>',
   'A 4.0 L sample has 2.0 mg of nitrate. What is the concentration?',['0.50 ppm','2.0 ppm','8.0 ppm'],0,
   '2.0 mg ÷ 4.0 L = 0.50 mg/L, which is 0.50 ppm.'),
  B('Canada sets safe limits.',
   '<p>Health Canada sets a maximum for each substance in drinking water. Fluoride’s limit is <b>1.5 mg/L</b>. Lead’s is only <b>0.005 mg/L</b>, because lead is toxic even in tiny amounts.</p>',
   'Tap water has 0.008 mg/L of lead. Is that safe by Health Canada’s limit?',['Yes, it is below the limit','No, it is above the limit'],1,
   '0.008 mg/L is more than the 0.005 mg/L limit, so it’s unsafe.')
 ]},
 {id:'v22', title:'Dilution', sub:'Using c₁V₁ = c₂V₂', bites:[
  B('Add water, same solute.',
   '<p><b>Dilution</b> means adding more solvent to make a solution weaker. The amount of solute (moles) stays the same. It’s just spread through more volume.</p>',
   'When you dilute a solution, what stays the same?',['The volume','The concentration','The moles of solute'],2,
   'Adding water changes volume and concentration, but the moles of solute don’t change.'),
  B('Here’s the formula.',
   '<p>Since moles = c × V and moles don’t change:</p><p><b>c<sub>1</sub>V<sub>1</sub> = c<sub>2</sub>V<sub>2</sub></b></p><p>1 is before diluting, 2 is after. Both volumes just need the same unit, so mL is fine.</p>',
   'In c₁V₁ = c₂V₂, what does V₂ mean?',['The volume before diluting','The final volume after diluting','The volume of water added'],1,
   'The 2 means after dilution, so V₂ is the final total volume.'),
  B('Watch me do one.',
   '<p>Dilute 50.0 mL of 2.00 mol/L acid to 250 mL. Find c<sub>2</sub>.</p><p>c<sub>2</sub> = c<sub>1</sub>V<sub>1</sub> ÷ V<sub>2</sub> = 2.00 × 50.0 ÷ 250 = <b>0.400 mol/L</b></p>',
   '100 mL of 1.0 mol/L solution is diluted to 500 mL. What is c₂?',['5.0 mol/L','0.20 mol/L','0.50 mol/L'],1,
   'c₂ = 1.0 × 100 ÷ 500 = 0.20 mol/L.'),
  B('Your turn!',
   '<p>To find how much stock solution you need, solve for V<sub>1</sub>.</p><p>Make 500 mL of 0.10 mol/L from 1.0 mol/L stock: V<sub>1</sub> = c<sub>2</sub>V<sub>2</sub> ÷ c<sub>1</sub> = 0.10 × 500 ÷ 1.0 = 50 mL. Then add water up to 500 mL.</p>',
   'How much 2.0 mol/L stock do you need to make 200 mL of 0.50 mol/L?',['50 mL','800 mL','100 mL'],0,
   'V₁ = 0.50 × 200 ÷ 2.0 = 50 mL.'),
  B('Safety first.',
   '<p>When diluting a strong acid, always <b>add acid to water</b>, slowly. Adding water to acid can heat up so fast it splashes.</p>',
   'When diluting a strong acid, you should…',['add water to the acid','add the acid to water','mix them both at once'],1,
   'Pour acid into water slowly so the heat spreads out safely.')
 ]},
 {id:'f6', title:'Acids and bases', sub:'Properties and indicators', bites:[
  B('Meet the acids.',
   '<p><b>Acids</b> taste sour, react with some metals like magnesium to give hydrogen gas, and release <b>hydrogen ions</b> ({H^+}) in water.</p><p>{HCl → H^+ + Cl^-}</p><p>Vinegar, lemon juice and stomach acid are all acids.</p>',
   'Which ion do acids release in water?',['{H^+}','{OH^-}','{Na^+}'],0,
   'Acids release {H^+} ions.'),
  B('Now the bases.',
   '<p><b>Bases</b> taste bitter, feel slippery and release <b>hydroxide ions</b> ({OH^-}) in water.</p><p>{NaOH → Na^+ + OH^-}</p><p>Baking soda, ammonia cleaner and drain cleaner are bases. Never taste or touch lab chemicals!</p>',
   'Which household item is a base?',['Lemon juice','Vinegar','Ammonia cleaner'],2,
   'Ammonia cleaner is a base. Lemon juice and vinegar are acids.'),
  B('Indicators change colour.',
   '<p>An <b>indicator</b> is a dye that changes colour in acid or base.</p><p><b>Litmus:</b> acids turn blue litmus red. Bases turn red litmus blue.</p>',
   'A solution turns blue litmus paper red. The solution is…',['an acid','a base','neutral'],0,
   'Acids turn blue litmus red.'),
  B('Two more indicators.',
   '<p><b>Phenolphthalein:</b> colourless in acid, pink in base.</p><p><b>Bromothymol blue:</b> yellow in acid, green when neutral, blue in base.</p>',
   'A few drops of phenolphthalein turn a solution pink. It is…',['acidic','basic','neutral'],1,
   'Phenolphthalein turns pink in a base.')
 ]},
 {id:'v23', title:'The pH scale', sub:'How acidic or basic', bites:[
  B('Here’s a number for acidity.',
   '<p>The <b>pH scale</b> usually runs from 0 to 14.</p><ul><li>Below 7: <b>acidic</b></li><li>Exactly 7: <b>neutral</b> (pure water)</li><li>Above 7: <b>basic</b></li></ul>',
   'A solution has pH 9. It is…',['acidic','neutral','basic'],2,
   'Above 7 is basic.'),
  B('Lower means more acidic.',
   '<p>The lower the pH, the stronger the acid. The higher the pH, the stronger the base.</p><p>Stomach acid is about pH 1 to 2. Blood is about 7.4. Bleach is about 12 to 13.</p>',
   'Which is the most acidic?',['pH 6','pH 4','pH 2'],2,
   'The lowest pH is the most acidic.'),
  B('Each step is ten times.',
   '<p>Each pH step means <b>10 times</b> more or less {H^+}. pH 4 is 10 times more acidic than pH 5.</p><p>Two steps is 10 × 10 = 100 times. pH 3 is 100 times more acidic than pH 5.</p>',
   'How many times more acidic is pH 2 than pH 5?',['3 times','30 times','1000 times'],2,
   'That is 3 steps: 10 × 10 × 10 = 1000 times.'),
  B('Universal indicator shows pH.',
   '<p><b>Universal indicator</b> is a mix of indicators that turns a different colour at each pH: red for strong acid, through orange, yellow and green near neutral, to blue and purple for strong base. A <b>pH meter</b> gives an exact reading.</p>',
   'Universal indicator turns green. The pH is about…',['1','7','13'],1,
   'Green on universal indicator means close to neutral, around pH 7.')
 ]},
 {id:'v24', title:'Neutralization', sub:'Acid + base → salt + water', bites:[
  B('Acids and bases cancel out.',
   '<p>When an acid and a base react, they <b>neutralize</b> each other. The products are a <b>salt</b> and <b>water</b>.</p><p>acid + base → salt + water</p>',
   'What are the products of neutralization?',['Salt and water','Acid and water','Hydrogen and oxygen'],0,
   'An acid and a base react to form a salt and water.'),
  B('Here’s why water forms.',
   '<p>The acid’s {H^+} joins the base’s {OH^-} to make water:</p><p>{H^+ + OH^- → H2O}</p><p>The leftover ions form the salt.</p>',
   'Which two ions combine to make water?',['{Na^+} and {Cl^-}','{H^+} and {OH^-}','{H^+} and {Cl^-}'],1,
   '{H^+} from the acid and {OH^-} from the base make {H2O}.'),
  B('Watch me do one.',
   '<p>{HCl + NaOH → NaCl + H2O}</p><p>The salt takes the metal ion from the base ({Na^+}) and the non-metal ion from the acid ({Cl^-}). In chemistry, "salt" means any ionic compound made this way.</p>',
   'What salt forms from {HNO3} and {KOH}?',['{KOH}','{HNO3}','{KNO3}'],2,
   '{K^+} from the base joins {NO3^-} from the acid to make {KNO3}.'),
  B('Neutralization in real life.',
   '<p>Antacid tablets contain bases like {Mg(OH)2} that neutralize extra stomach acid.</p><p>Farmers and lake managers add limestone ({CaCO3}) to neutralize acidic soil and water. It also gives off {CO2} gas.</p>',
   'Why do antacids help heartburn?',['They add more acid','They contain a base that neutralizes stomach acid','They dissolve food'],1,
   'The base in an antacid reacts with stomach acid and neutralizes it.')
 ]},
 {id:'v2', title:'Titration', sub:'Equipment and procedure', bites:[
  B('Let’s find an unknown.',
   '<p>A <b>titration</b> finds the concentration of an unknown solution. You slowly add a solution of known concentration until the reaction is just complete, and measure exactly how much you used.</p>',
   'What is a titration used to find?',['The mass of a solid','An unknown concentration','The boiling point'],1,
   'Titration measures the concentration of an unknown solution.'),
  B('Meet the equipment.',
   '<ul><li><b>Burette:</b> long tube with a tap. Holds the known solution and measures how much you add.</li><li><b>Pipette:</b> delivers an exact volume of the unknown.</li><li><b>Erlenmeyer flask:</b> holds the unknown plus indicator. It’s easy to swirl.</li></ul>',
   'Which tool measures how much known solution you add?',['Burette','Pipette','Erlenmeyer flask'],0,
   'The burette has a scale and a tap, so it measures the volume added.'),
  B('Here’s the method.',
   '<ol><li>Pipette the unknown into the flask and add indicator.</li><li>Fill the burette and record the start reading.</li><li>Add from the burette while swirling. Go drop by drop near the end.</li><li>Stop at the first lasting colour change: the <b>endpoint</b>.</li><li>Record the final reading.</li></ol>',
   'What is the endpoint?',['When the burette is empty','The first lasting colour change','When you start adding solution'],1,
   'The endpoint is when the indicator first changes colour permanently.'),
  B('Reading the burette.',
   '<p>A burette reads 0 at the top and counts <b>down</b> the tube. Read at the bottom of the curved surface (the meniscus).</p><p>Volume used = final reading − initial reading.</p>',
   'Initial reading 1.20 mL, final reading 23.70 mL. Volume used?',['24.90 mL','22.50 mL','23.70 mL'],1,
   '23.70 − 1.20 = 22.50 mL.'),
  B('Do it more than once.',
   '<p>Repeat the titration until two trials agree within about <b>0.2 mL</b>. Then average those trials. This makes your result reliable.</p>',
   'Trials gave 22.50, 24.10 and 22.40 mL. Which two should you average?',['22.50 and 24.10','22.40 and 24.10','22.50 and 22.40'],2,
   '22.50 and 22.40 agree within 0.2 mL. 24.10 is way off.')
 ]},
 {id:'v25', title:'Titration calculations', sub:'From burette reading to concentration', bites:[
  B('Three steps, every time.',
   '<ol><li>Moles of the known: <b>n = c × V</b></li><li>Use the balanced equation’s mole ratio to get moles of the unknown.</li><li>Concentration of the unknown: <b>c = n ÷ V</b></li></ol><p>Volumes in litres!</p>',
   'What is the first step?',['Find moles of the known solution','Find c of the unknown','Use the mole ratio'],0,
   'Start with what you know fully: c and V of the known give its moles.'),
  B('Watch me do one.',
   '<p>25.00 mL of {HCl} needs 20.00 mL of 0.100 mol/L {NaOH}.</p><p>1. n({NaOH}) = 0.100 × 0.02000 = 0.00200 mol</p><p>2. {HCl + NaOH → NaCl + H2O} is 1:1, so n({HCl}) = 0.00200 mol</p><p>3. c = 0.00200 ÷ 0.02500 = <b>0.0800 mol/L</b></p>',
   'In this example, why is n(HCl) equal to n(NaOH)?',['They react 1:1','They have the same volume','They are both acids'],0,
   'The balanced equation has one {HCl} for every {NaOH}.'),
  B('Your turn!',
   '<p>Same steps. 10.00 mL of {HCl} needs 15.00 mL of 0.200 mol/L {NaOH}.</p><p>n({NaOH}) = 0.200 × 0.01500 = 0.00300 mol, and the ratio is 1:1.</p>',
   'What is the concentration of the {HCl}?',['0.300 mol/L','0.133 mol/L','0.0300 mol/L'],0,
   'n({HCl}) = 0.00300 mol, and 0.00300 ÷ 0.01000 L = 0.300 mol/L.'),
  B('Watch the ratio.',
   '<p>{H2SO4 + 2NaOH → Na2SO4 + 2H2O}</p><p>Here 2 mol {NaOH} react with 1 mol {H2SO4}, so divide the base moles by 2.</p><p>If 0.00300 mol {NaOH} is used, n({H2SO4}) = 0.00300 ÷ 2 = 0.00150 mol.</p>',
   'That 0.00150 mol of {H2SO4} was in 10.00 mL. What is its concentration?',['0.300 mol/L','0.150 mol/L','0.0150 mol/L'],1,
   'c = 0.00150 ÷ 0.01000 L = 0.150 mol/L.')
 ]},
 {id:'v3', title:'Crude oil', sub:'Fractional distillation', bites:[
  B('Let’s talk fuel.',
   '<p><b>Crude oil</b> is a thick mixture of <b>hydrocarbons</b>: compounds made of only carbon and hydrogen. It formed over millions of years from the buried remains of tiny sea creatures, under heat and pressure.</p>',
   'Hydrocarbons are made of which elements?',['Carbon and oxygen','Carbon and hydrogen','Hydrogen and oxygen'],1,
   'Hydro = hydrogen, carbon = carbon. Nothing else.'),
  B('Size matters.',
   '<p>Hydrocarbons come in different sizes, from methane ({CH4}) with 1 carbon to huge molecules with 40 or more.</p><p>Bigger molecules have <b>higher boiling points</b>. That’s the key to separating them.</p>',
   'Which has the higher boiling point?',['A small hydrocarbon like {C3H8}','A large hydrocarbon like {C20H42}'],1,
   'Bigger hydrocarbon molecules have higher boiling points.'),
  B('Here’s how a refinery sorts it.',
   '<p>In <b>fractional distillation</b>, crude oil is heated until most of it turns to vapour. The vapour rises up a tall column that is hot at the bottom and cool at the top.</p><p>Each part condenses back to liquid at the height where it cools below its boiling point. Each part collected is a <b>fraction</b>.</p>',
   'What property is used to separate the fractions?',['Colour','Density of the crude oil','Boiling point'],2,
   'Each fraction condenses at a different height because of its boiling point.'),
  B('Top to bottom.',
   '<ul><li>Top (smallest, coolest): fuel gases like propane and butane</li><li>Gasoline</li><li>Kerosene and jet fuel</li><li>Diesel</li><li>Lubricating oil</li><li>Bottom (biggest): bitumen for asphalt roads</li></ul>',
   'Where does bitumen collect in the column?',['At the top','In the middle','At the bottom'],2,
   'Bitumen has the biggest molecules and highest boiling point, so it stays at the bottom.')
 ]},
 {id:'v26', title:'Combustion', sub:'Complete vs incomplete', bites:[
  B('Burning is a reaction.',
   '<p><b>Combustion</b> is burning a fuel in oxygen to release energy. With plenty of oxygen, a hydrocarbon burns <b>completely</b>:</p><p>hydrocarbon + oxygen → carbon dioxide + water</p><p>{CH4 + 2O2 → CO2 + 2H2O}</p>',
   'What are the products of complete combustion of a hydrocarbon?',['{CO} and soot','{CO2} and {H2O}','{H2} and {O2}'],1,
   'Complete combustion gives carbon dioxide and water.'),
  B('Not enough oxygen?',
   '<p>With too little oxygen, combustion is <b>incomplete</b>. It makes <b>carbon monoxide</b> ({CO}) and/or <b>soot</b> (carbon, C), plus water.</p><p>{2CH4 + 3O2 → 2CO + 4H2O}</p>',
   'What causes incomplete combustion?',['Too little oxygen','Too much oxygen','Too much water'],0,
   'Without enough oxygen, carbon ends up as {CO} or soot instead of {CO2}.'),
  B('You can see the difference.',
   '<p>Complete combustion: clean <b>blue</b> flame, more energy released.</p><p>Incomplete combustion: smoky <b>yellow-orange</b> flame, leaves black soot, less energy.</p>',
   'A gas stove flame is yellow and sooty. What is happening?',['Complete combustion','Incomplete combustion'],1,
   'A yellow, sooty flame means there isn’t enough oxygen.'),
  B('Why CO is dangerous.',
   '<p>Carbon monoxide has no colour or smell. It sticks to your blood and stops it carrying oxygen. That’s why Ontario homes with fuel-burning furnaces or stoves must have <b>CO alarms</b>.</p>',
   'Why can’t you notice carbon monoxide on your own?',['It is colourless and odourless','It smells like rotten eggs','It is a bright brown gas'],0,
   '{CO} can’t be seen or smelled, so you need an alarm to detect it.'),
  B('Try balancing one.',
   '<p>Propane burns completely: {C3H8 + 5O2 → 3CO2 + 4H2O}</p><p>Check: 3 C on each side, 8 H on each side, and 10 O on each side (6 in {CO2} plus 4 in {H2O}).</p>',
   'In this equation, how many {CO2} molecules form per propane?',['1','3','4'],1,
   'Propane has 3 carbons, so it makes 3 {CO2}.')
 ]},
 {id:'v4', title:'Acid rain and smog', sub:'Air pollution from burning fuel', bites:[
  B('Rain is a little acidic already.',
   '<p>Normal rain has a pH of about 5.6 because a bit of {CO2} dissolves in it. <b>Acid rain</b> has a pH below that, sometimes around 4.</p>',
   'Which pH would count as acid rain?',['7.0','5.6','4.2'],2,
   'Acid rain is more acidic than normal rain, so its pH is below 5.6.'),
  B('Where it comes from.',
   '<p>Coal and oil contain sulfur. Burning them releases <b>sulfur dioxide</b> ({SO2}). Hot car engines make <b>nitrogen oxides</b> like {NO2}.</p><p>In the air, these react with oxygen and water to form <b>sulfuric acid</b> ({H2SO4}) and <b>nitric acid</b> ({HNO3}).</p>',
   'Which gas from burning coal leads to sulfuric acid in rain?',['{SO2}','{O2}','{N2}'],0,
   'Sulfur in coal burns to {SO2}, which turns into sulfuric acid in the air.'),
  B('What acid rain damages.',
   '<p>Acid rain lowers the pH of lakes, which can kill fish. It harms trees and soil. It also eats away limestone and marble buildings and statues, since {CaCO3} reacts with acid.</p><p>Lakes near Sudbury, Ontario were badly hit by smelter pollution, then recovered as emissions dropped.</p>',
   'Why do marble statues wear away in acid rain?',['Marble is {CaCO3}, which reacts with acid','Marble dissolves in pure water','Rain is basic'],0,
   'Calcium carbonate reacts with acids, so the stone slowly dissolves.'),
  B('Now smog.',
   '<p><b>Smog</b> is a brownish haze over cities. Sunlight drives reactions between nitrogen oxides and fuel vapours that make <b>ground-level ozone</b> ({O3}). It irritates lungs and makes asthma worse.</p><p>Fixes include catalytic converters on cars and scrubbers on smokestacks.</p>',
   'What harmful gas forms in smog when sunlight hits car pollution?',['Ground-level ozone, {O3}','Oxygen, {O2}','Water vapour'],0,
   'Sunlight helps nitrogen oxides and fuel vapours react to make ozone near the ground.')
 ]},
 {id:'v27', title:'Greenhouse effect and ozone', sub:'Two different problems', bites:[
  B('Earth has a blanket.',
   '<p>Sunlight warms Earth’s surface. The surface gives off heat. <b>Greenhouse gases</b> like {CO2}, methane ({CH4}) and water vapour absorb some of that heat and keep it in.</p><p>This <b>greenhouse effect</b> is natural. Without it, Earth would average about −18 °C.</p>',
   'Which is a greenhouse gas?',['{N2}','{CO2}','{O2}'],1,
   'Carbon dioxide traps heat. Nitrogen and oxygen don’t.'),
  B('Too much blanket.',
   '<p>Burning fossil fuels adds extra {CO2}. Air had about 280 ppm of {CO2} before the 1800s. Now it’s over 420 ppm.</p><p>More greenhouse gas traps more heat, which drives <b>climate change</b>.</p>',
   'What is the main human source of extra {CO2}?',['Burning fossil fuels','Drinking water','Breathing oxygen'],0,
   'Combustion of coal, oil and gas releases {CO2}.'),
  B('Ozone up high protects us.',
   '<p>High in the atmosphere, the <b>ozone layer</b> ({O3}) absorbs harmful <b>UV light</b> from the Sun.</p><p>Old fridges and spray cans used <b>CFCs</b>. Their chlorine atoms break down ozone, thinning the layer.</p>',
   'What do CFCs do to the ozone layer?',['They make it thicker','They turn it into {CO2}','They break down ozone'],2,
   'Chlorine from CFCs destroys ozone molecules.'),
  B('A Canadian success story.',
   '<p>The <b>Montreal Protocol</b> (1987) was a worldwide deal to phase out CFCs. The ozone layer is now slowly healing.</p><p>Remember: ozone up high is good. Ozone at ground level, in smog, is harmful.</p>',
   'Where is ozone harmful to people?',['High in the atmosphere','At ground level in smog'],1,
   'Ground-level ozone irritates lungs. High-up ozone shields us from UV.')
 ]},
 {id:'v28', title:'Water pollution and treatment', sub:'What gets in, and how we clean it', bites:[
  B('Heavy metals build up.',
   '<p><b>Heavy metals</b> like lead and mercury are toxic. Lead can come from old pipes. Mercury can come from industry and builds up in fish.</p><p>Living things can’t get rid of them easily, so the metals build up in their bodies over time.</p>',
   'Why are heavy metals so dangerous?',['They build up in living things','They are always harmless in water','They evaporate quickly'],0,
   'Heavy metals stay in the body and accumulate over time.'),
  B('Up the food chain.',
   '<p>Small fish eat contaminated plankton. Big fish eat many small fish. The metal gets more concentrated at each step. This is <b>biomagnification</b>.</p>',
   'Which animal likely has the most mercury?',['Plankton','A small minnow','A large pike that eats fish'],2,
   'Top predators eat many smaller animals, so the mercury concentrates in them.'),
  B('Too much fertilizer.',
   '<p>Fertilizer runoff adds <b>nitrates</b> and <b>phosphates</b> to lakes. Algae grow out of control in an <b>algal bloom</b>.</p><p>When the algae die, bacteria decompose them and use up the dissolved oxygen. Fish suffocate. Lake Erie has had big blooms like this.</p>',
   'Why do fish die after an algal bloom?',['Algae poison the water with salt','Decomposing algae use up the oxygen','The water gets too cold'],1,
   'Bacteria breaking down dead algae use up the dissolved oxygen fish need.'),
  B('How water gets cleaned.',
   '<ol><li><b>Coagulation:</b> add alum ({Al2(SO4)3}) so tiny particles clump together.</li><li><b>Sedimentation:</b> clumps sink to the bottom.</li><li><b>Filtration:</b> water passes through sand, gravel and charcoal.</li><li><b>Disinfection:</b> chlorine or UV light kills germs.</li></ol>',
   'Which step kills bacteria?',['Sedimentation','Coagulation','Disinfection'],2,
   'Disinfection with chlorine or UV kills microbes.'),
  B('Quick check.',
   '<p>Order matters: first clump the particles, then let them settle, then filter what’s left, then kill germs.</p>',
   'What comes right after coagulation?',['Disinfection','Sedimentation','Filtration'],1,
   'Once particles clump, they settle out in sedimentation.')
 ]}
]};

const UNIT_X = {name:'Electrochemistry', lessons:[
 {id:'x1', title:'Oxidation and reduction', sub:'OIL RIG: electrons on the move', bites:[
   B('New unit! It’s all about electrons.',
     '<p>In a <b>redox reaction</b>, electrons move from one substance to another.</p><p>The word comes from <b>red</b>uction and <b>ox</b>idation, the two halves of every one of these reactions.</p>',
     'In a redox reaction, what moves from one substance to another?', ['Protons','Electrons','Neutrons'], 1,
     'Redox reactions are all about electrons being passed from one substance to another.'),
   B('Here’s the memory trick.',
     '<p>Remember <b>OIL RIG</b>:</p><ul><li><b>O</b>xidation <b>I</b>s <b>L</b>oss of electrons.</li><li><b>R</b>eduction <b>I</b>s <b>G</b>ain of electrons.</li></ul>',
     'An atom that loses electrons is…', ['reduced','oxidized','neutralized'], 1,
     'OIL: Oxidation Is Loss. Losing electrons means being oxidized.'),
   B('Watch it happen.',
     '<p>Drop zinc metal into a solution of copper ions: {Zn + Cu^2+ → Zn^2+ + Cu}.</p><p>Each zinc atom loses 2 electrons and becomes {Zn^2+}. Each {Cu^2+} ion gains those 2 electrons and becomes copper metal, which coats the zinc.</p>',
     'In this reaction, the {Cu^2+} ion is…', ['oxidized','reduced','unchanged'], 1,
     '{Cu^2+} gains 2 electrons to become Cu. RIG: Reduction Is Gain.'),
   B('One more key fact.',
     '<p>Electrons can’t just vanish. If one substance loses electrons, another must pick them up.</p><p>So oxidation and reduction <b>always happen together</b>, and the electrons lost equal the electrons gained.</p>',
     'Can oxidation happen without reduction?', ['Yes, it happens often','No, they always happen together'], 1,
     'Lost electrons must go somewhere, so every oxidation comes with a reduction.')
 ]},
 {id:'x20', title:'Oxidation number rules', sub:'A bookkeeping system for electrons', bites:[
   B('Let’s keep score of electrons.',
     '<p>An <b>oxidation number</b> is a number we give each atom to track its electrons.</p><p>If an atom’s oxidation number <b>goes up</b>, it was <b>oxidized</b>. If it <b>goes down</b>, it was <b>reduced</b>.</p>',
