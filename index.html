<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flame Test"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F5F4" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0E1215" media="(prefers-color-scheme: dark)">
<meta name="description" content="Ontario Grade 12 College Chemistry (SCH4C) study app with Fizz the flask.">
<script src="supabase.js"></script>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Flame Test SCH4C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: nav | winding lesson path (centre) | goal + Fizz panel. Units wear flame-test colours; chunky pressable controls. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --sunk:#E6EBE9; --ink:#141A20; --muted:#55616B; --line:#D3DBD8;
  --good:#1F7A46; --goodbtn:#23874D; --bad:#B3261E; --badbtn:#C2372F; --gold:#E9A800; --glass:#EAF3F4;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --c:#E3A008; --on:#1a1405;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1215;--surface:#161B20;--sunk:#1F262C;--ink:#E6EBEE;--muted:#9AA6AF;--line:#2B343B;
  --good:#5CC98A;--bad:#FF8A80;--glass:#1C2A30;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1215;--surface:#161B20;--sunk:#1F262C;--ink:#E6EBEE;--muted:#9AA6AF;--line:#2B343B;
  --good:#5CC98A;--bad:#FF8A80;--glass:#1C2A30;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font:17px/1.6 var(--body);-webkit-font-smoothing:antialiased}
::selection{background:color-mix(in oklab,var(--c) 35%,transparent)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
select{font-size:16px}
:focus-visible{outline:3px solid color-mix(in oklab,var(--c) 75%,var(--ink));outline-offset:3px;border-radius:8px}
h1,h2,h3{font-family:var(--display);line-height:1.12;text-wrap:balance;margin:0}
.f{font-family:var(--mono);font-size:.92em;white-space:nowrap}
.f sub,.f sup{font-size:.72em}
.ic{flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ic.solid{fill:currentColor}
.ctext{color:color-mix(in oklab,var(--c) 70%,var(--ink))}
.small{font-size:13px;color:var(--muted);font-family:var(--mono)}

/* chunky buttons */
.b3{font:800 15px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:15px 22px;border-radius:14px;border:0;background:var(--c);color:var(--on);
  box-shadow:0 4px 0 color-mix(in oklab,var(--c) 62%,#000);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .08s,box-shadow .08s,filter .15s}
.b3:hover{filter:brightness(1.06)}
.b3:active{transform:translateY(4px);box-shadow:0 0 0 transparent}
.b3.ghost{background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line);outline:2px solid var(--line);outline-offset:-2px}
.b3.okb{background:var(--goodbtn);color:#fff;box-shadow:0 4px 0 #165a33}
.b3.nob{background:var(--badbtn);color:#fff;box-shadow:0 4px 0 #7f1a14}
.b3:disabled{background:var(--sunk);color:var(--muted);box-shadow:0 4px 0 var(--line);cursor:default;filter:none;transform:none}
.b3.wide{width:100%}

/* app shell */
.app{display:grid;grid-template-columns:230px minmax(0,1fr) 330px;min-height:100vh}
.nav{position:sticky;top:0;height:100vh;padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px;text-decoration:none}
.brand b{font:800 23px var(--display);letter-spacing:-.02em}
.nav a.tab{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:12px;text-decoration:none;font:800 14px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:2px solid transparent}
.nav a.tab:hover{background:var(--sunk)}
.nav a.tab[aria-current="true"]{color:color-mix(in oklab,var(--c) 70%,var(--ink));background:color-mix(in oklab,var(--c) 12%,var(--surface));border-color:color-mix(in oklab,var(--c) 45%,var(--line))}
main{min-width:0;overflow-x:clip;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 80px}
.col{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.aside{position:sticky;top:0;height:100vh;overflow:auto;padding-block:22px;padding-right:max(20px,env(safe-area-inset-right,0px));padding-left:8px;display:flex;flex-direction:column;gap:16px}

.topstats{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;gap:6px;justify-content:space-between;align-items:center;padding-block:14px;max-width:600px;margin:0 auto}
.stat{display:inline-flex;align-items:center;gap:6px;font:800 16px var(--display);padding:6px 10px;border-radius:10px}
.stat:hover{background:var(--sunk)}
.stat.streak{color:#E8691C}.stat.streak.cold{color:var(--muted)}
.stat.xp{color:#C98A06}
.lvl{display:inline-flex;align-items:center;gap:8px;font:800 14px var(--display);padding:5px 12px 5px 5px;border-radius:99px;background:var(--surface);border:2px solid var(--line);text-decoration:none}
.lvl i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-content:center;font-size:13px}

.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px}
.card h3{font-size:18px}

/* Fizz */
.fizz{display:block;overflow:visible}
.fizz .fz-all{transform-box:fill-box;transform-origin:50% 100%;animation:bob 3s ease-in-out infinite}
.fizz .fz-liq{animation:wave 2.2s linear infinite}
.fizz .fz-eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.fizz .fz-b{animation:rise 3s ease-in infinite;opacity:0}
.fizz .fz-b:nth-of-type(2){animation-delay:1s}.fizz .fz-b:nth-of-type(3){animation-delay:2s}
.fizz .fz-arm{transform-box:fill-box}
.fizz .fz-armL{transform-origin:100% 0}.fizz .fz-armR{transform-origin:0 0}
.fizz.happy .fz-all{animation:hop .9s cubic-bezier(.3,.8,.4,1) infinite}
.fizz.happy .fz-armL{animation:waveL .45s ease-in-out infinite alternate}
.fizz.happy .fz-armR{animation:waveR .45s ease-in-out infinite alternate}
.fizz.sad .fz-all{animation:none;transform:rotate(-7deg) translateY(3px)}
.fizz.sad .fz-armL,.fizz.sad .fz-armR{transform:rotate(0)}
.fizz.think .fz-all{animation:sway 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.06,.92)}45%{transform:translateY(-16px) scale(.96,1.05)}75%{transform:translateY(0) scale(1.04,.95)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes wave{to{transform:translateX(60px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.85}100%{transform:translateY(-38px);opacity:0}}
@keyframes waveL{from{transform:rotate(0)}to{transform:rotate(38deg)}}
@keyframes waveR{from{transform:rotate(0)}to{transform:rotate(-38deg)}}
.say{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:700;font-size:15.5px;line-height:1.4}
.say::before{content:"";position:absolute;left:-9px;top:22px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.fizzline{display:flex;align-items:flex-start;gap:12px}

/* goal card */
.goal{display:flex;gap:14px;align-items:center}
.goal .ring{position:relative;width:64px;height:64px;flex:none}
.goal .ring svg{transform:rotate(-90deg)}
.goal .ring b{position:absolute;inset:0;display:grid;place-content:center;font:800 14px var(--display)}
.goaltrack{height:14px;border-radius:99px;background:var(--sunk);overflow:hidden}
.goaltrack span{display:block;height:100%;border-radius:99px;background:var(--gold);transition:width .8s cubic-bezier(.16,1,.3,1)}

/* path */
.unit{--c:#888;display:flex;flex-direction:column;gap:6px;margin-bottom:30px}
.ubanner{background:var(--c);color:var(--on);border-radius:18px;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 5px 0 color-mix(in oklab,var(--c) 62%,#000);margin-bottom:22px}
.ubanner .lbl{font:800 13px var(--display);letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.ubanner h2{font-size:22px}
.ubanner p{margin:2px 0 0;font-size:14.5px;opacity:.9;line-height:1.4}
.ubanner .notes{margin-left:auto;flex:none;border:2px solid currentColor;background:transparent;color:inherit;border-radius:12px;padding:8px;display:grid;place-content:center;opacity:.9;text-decoration:none}
.ubanner .crown{font:800 13px var(--display);display:inline-flex;gap:4px;align-items:center;margin-top:6px;background:color-mix(in oklab,#000 18%,transparent);padding:3px 8px;border-radius:99px}
.prow{position:relative;height:98px;display:flex;justify-content:center;align-items:center}
.prow>.node{left:var(--off)}
.node{position:relative;width:74px;height:68px;border-radius:50%;border:0;background:var(--c);color:var(--on);box-shadow:0 7px 0 color-mix(in oklab,var(--c) 62%,#000);display:grid;place-content:center;transition:transform .08s,box-shadow .08s}
.node:active{transform:translateY(6px);box-shadow:0 1px 0 color-mix(in oklab,var(--c) 62%,#000)}
.node.locked{background:var(--sunk);color:var(--muted);box-shadow:0 7px 0 var(--line)}
.node.done{background:color-mix(in oklab,var(--c) 82%,#fff)}
.node.chest{width:84px;height:76px;border-radius:22px}
.node.current::before{content:"";position:absolute;inset:-11px;border-radius:50%;border:6px solid color-mix(in oklab,var(--c) 35%,transparent);animation:pulse 1.8s ease-out infinite}
.node.chest.current::before{border-radius:28px}
.node.pop{animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes pulse{0%{transform:scale(.92);opacity:1}100%{transform:scale(1.18);opacity:0}}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.startbub{position:absolute;top:-30px;left:calc(50% + var(--off));transform:translateX(-50%);background:var(--surface);color:color-mix(in oklab,var(--c) 70%,var(--ink));border:2px solid var(--line);font:800 13px var(--display);letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:12px;white-space:nowrap;animation:bobx 1.6s ease-in-out infinite;z-index:2}
.startbub::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bobx{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-5px)}}
.peek{position:absolute;top:2px;width:84px;left:calc(50% + var(--off));margin-left:-42px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.45);z-index:40;animation:fade .2s}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);z-index:41;background:var(--surface);border-radius:22px 22px 0 0;border:2px solid var(--line);border-bottom:0;padding:22px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .32s cubic-bezier(.16,1,.3,1)}
.sheet h3{font-size:22px}
.sheet p{margin:0;color:var(--muted)}
.sheet .btns{display:flex;flex-direction:column;gap:12px}
@keyframes up{from{transform:translate(-50%,100%)}}
@keyframes fade{from{opacity:0}}

/* session overlay */
.session{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.shead{flex:none;display:flex;align-items:center;gap:14px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:760px;width:100%;margin:0 auto}
.xbtn{border:0;background:none;color:var(--muted);padding:6px;border-radius:10px;display:grid}
.xbtn:hover{background:var(--sunk)}
.sbar{flex:1;height:16px;border-radius:99px;background:var(--sunk);overflow:hidden}
.sbar span{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .5s cubic-bezier(.16,1,.3,1);box-shadow:inset 0 4px 0 rgba(255,255,255,.28)}
.hearts{display:flex;align-items:center;gap:4px;color:#E5484D;font:800 17px var(--display)}
.hearts.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.combo{font:800 13px var(--display);color:#E8691C;letter-spacing:.04em}
.sbody{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-block:8px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sinner{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px;animation:slidein .35s cubic-bezier(.16,1,.3,1)}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}}
.sfoot{flex:none;border-top:2px solid var(--line);padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg)}
.sfoot.ok{background:color-mix(in oklab,var(--good) 14%,var(--bg));border-color:transparent}
.sfoot.no{background:color-mix(in oklab,var(--bad) 12%,var(--bg));border-color:transparent}
.sfin{max-width:760px;margin:0 auto;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sfin .msg{flex:1;min-width:220px;display:flex;gap:12px;align-items:flex-start}
.sfin .msg .ico{width:44px;height:44px;border-radius:50%;display:grid;place-content:center;flex:none;background:var(--surface)}
.ok .msg h3{color:var(--good)} .no .msg h3{color:var(--bad)}
.ok .msg .ico{color:var(--good)} .no .msg .ico{color:var(--bad)}
.msg p{margin:2px 0 0;font-size:15px}
.sfin .b3{min-width:170px}
.qprompt{font:800 22px/1.3 var(--display)}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 3px 0 var(--line);font-size:17px}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-content:center;font:600 13px var(--mono);color:var(--muted)}
.opt:hover:not(:disabled){background:var(--sunk)}
.opt[aria-pressed="true"]{border-color:color-mix(in oklab,var(--c) 70%,var(--line));background:color-mix(in oklab,var(--c) 12%,var(--surface));box-shadow:0 3px 0 color-mix(in oklab,var(--c) 55%,var(--line))}
.opt[aria-pressed="true"] .k{border-color:var(--c);color:var(--ink)}
.opt.right{border-color:var(--good);background:color-mix(in oklab,var(--good) 12%,var(--surface));box-shadow:0 3px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:color-mix(in oklab,var(--bad) 10%,var(--surface));box-shadow:0 3px 0 var(--bad)}
.opt:disabled{cursor:default}
.review{display:inline-flex;gap:6px;align-items:center;font:800 13px var(--display);letter-spacing:.06em;text-transform:uppercase;color:#C98A06}

/* reading */
.prose{display:flex;flex-direction:column;gap:14px}
.prose p{margin:0}
.prose h2{font-size:22px;margin-top:6px}
.prose ol{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px}
.lede{font-size:19px;line-height:1.55;margin:0}
.points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.points li{padding-left:22px;position:relative}
.points li::before{content:"";position:absolute;left:2px;top:.62em;width:9px;height:9px;border-radius:2px;background:var(--c)}
.analogy{background:color-mix(in oklab,var(--c) 11%,var(--surface));border-radius:14px;padding:14px 18px}
.analogy b{display:block;font-family:var(--display);font-size:15px;margin-bottom:2px}
.ex{border:2px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.ex .q{padding:16px 18px;border-bottom:2px solid var(--line);font-weight:700}
.ex ol{margin:0;padding:14px 18px 16px 40px;display:flex;flex-direction:column;gap:6px}
.ex ol li{opacity:0;animation:stepin .45s cubic-bezier(.16,1,.3,1) forwards}
.ex ol li:nth-child(1){animation-delay:.1s}.ex ol li:nth-child(2){animation-delay:.5s}.ex ol li:nth-child(3){animation-delay:.9s}.ex ol li:nth-child(4){animation-delay:1.3s}.ex ol li:nth-child(5){animation-delay:1.7s}
@keyframes stepin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tbl{overflow-x:auto;border:2px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;font-family:var(--display);font-size:14px;background:var(--sunk)}
td.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:14px}
figure{margin:0;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px;overflow-x:auto}
figure svg{display:block;max-width:100%;height:auto;margin:0 auto}
figcaption{font-size:14px;color:var(--muted);margin-top:8px}
.crumb{font-size:14px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;padding-top:20px}
.crumb a{text-decoration:none;font-weight:700}

/* sim */
.sim{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:16px}
.sim .eq{font-size:17px;text-align:center;white-space:normal}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;height:190px;align-items:end;padding:0 6px;border-bottom:2px solid var(--line)}
.bar{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar .fill{width:100%;max-width:90px;border-radius:8px 8px 0 0;background:var(--c);transition:height .9s cubic-bezier(.16,1,.3,1);min-height:2px}
.bar .v{font:600 14px var(--mono);font-variant-numeric:tabular-nums}
.barlabels{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;text-align:center;margin-top:-8px}
.controls{display:flex;flex-wrap:wrap;gap:8px}
.controls button{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;font-size:14.5px;font-weight:700}
.controls button:hover{border-color:var(--c)}
.status{min-height:52px;padding:10px 14px;border-radius:12px;background:var(--sunk);font-size:15.5px}
.readout{display:flex;gap:18px;flex-wrap:wrap;font:14px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}

/* tools */
.tool{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.tool h2{font-size:24px}
.tool p{margin:0;color:var(--muted)}
.inrow{display:flex;gap:10px;flex-wrap:wrap}
input[type=text]{font:18px var(--mono);padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);flex:1;min-width:0;caret-color:var(--c)}
input[type=text]:focus{outline:none;border-color:var(--c)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

<script>
/* ---------- formula markup ---------- */
function fmt(f){let out='',prev='',inSub=false;
  for(let i=0;i<f.length;i++){const c=f[i];
    if(c==='^'){let j=i+1,s='';while(j<f.length&&!' ()[]'.includes(f[j])){s+=f[j];j++}out+='<sup>'+s+'</sup>';i=j-1;prev='';inSub=false;continue}
    if(/\d/.test(c)&&(inSub||/[A-Za-z)]/.test(prev))){out+='<sub>'+c+'</sub>';inSub=true;prev=c;continue}
    inSub=false;out+=c;prev=c}
  return out}
const chem=s=>s.replace(/\{([^}]+)\}/g,(m,f)=>'<span class="f">'+fmt(f)+'</span>');
const $=s=>document.querySelector(s);

/* ---------- content ---------- */

const OLDUNITS=[
{id:'f',sym:'Na',z:11,c:'#E3A008',light:true,name:'Foundations',flame:'sodium · yellow',
 blurb:'The Grade 11 basics this course assumes you know. Start here.',lessons:[
 {id:'f1',title:'Atoms and the periodic table',sub:'What everything is made of',
  lede:'Everything around you is built from about 90 kinds of atoms. Each kind is an <b>element</b>, and the periodic table is the map of them.',
  body:`<p>An atom has a tiny, heavy <b>nucleus</b> made of <b>protons</b> (positive charge) and <b>neutrons</b> (no charge). Around it moves a cloud of <b>electrons</b> (negative charge), which are very light.</p>
  <p>The number of protons is the <b>atomic number</b>, and it decides which element you have. Carbon always has 6 protons. If it had 7, it would be nitrogen. A neutral atom has the same number of electrons as protons.</p>
  <p>The table is arranged in rows called <b>periods</b> and columns called <b>groups</b>. Elements in the same group behave alike because they have the same number of <b>valence electrons</b>, the outermost electrons that take part in reactions.</p>`,
  points:['Metals sit on the left and middle; non-metals on the upper right; noble gases (group 18) on the far right barely react.','Group 1 atoms have 1 valence electron, group 2 have 2, groups 13 to 18 have 3 to 8.','An <b>ion</b> is an atom that gained or lost electrons. Metals lose electrons and become positive ({Na^+}); non-metals gain them and become negative ({Cl^-}).','<b>Isotopes</b> are atoms of the same element with different numbers of neutrons, such as carbon-12 and carbon-14.'],
  analogy:'Think of the atomic number as an element’s ID number. Neutrons can vary and electrons can be gained or lost, but the proton count never changes without the element changing.',
  example:{q:'Chlorine has atomic number 17. How many protons and electrons does a {Cl^-} ion have?',steps:['Protons = atomic number = 17.','A neutral Cl atom has 17 electrons.','The 1− charge means it gained one electron: 17 + 1 = <b>18 electrons</b>.']},
  quiz:[{q:'Carbon has atomic number 6. How many protons does every carbon atom have?',o:['12','6','4','It varies'],a:1,w:'The atomic number is the proton count, and it is fixed for an element.'},
        {q:'Why do sodium and potassium react in similar ways?',o:['Same number of neutrons','Same atomic mass','Same number of valence electrons','Both are gases'],a:2,w:'Both are in group 1, so each has one valence electron to give away.'}]},
 {id:'f2',title:'Chemical bonding',sub:'How atoms stick together',
  lede:'Atoms bond to reach a stable arrangement of electrons, usually 8 in the outer shell. This is called the <b>octet rule</b>.',
  body:`<p>There are two main ways to do it. In an <b>ionic bond</b>, a metal hands electrons to a non-metal. The resulting positive and negative ions attract each other. Table salt, {NaCl}, is the classic example.</p>
  <p>In a <b>covalent bond</b>, two non-metals share a pair of electrons. Water, {H2O}, has two covalent bonds between O and H. Sharing two pairs makes a double bond; three pairs makes a triple bond.</p>
  <p>Atoms do not share equally. <b>Electronegativity</b> measures how strongly an atom pulls on shared electrons. When two atoms differ a lot, the bond is <b>polar</b>: one end is slightly negative (δ−) and the other slightly positive (δ+).</p>`,
  points:['Metal + non-metal → usually ionic. Non-metal + non-metal → covalent.','<b>Lewis structures</b> draw valence electrons as dots and shared pairs as lines.','Electronegativity difference: under 0.5 non-polar, 0.5 to 1.7 polar covalent, above about 1.7 mostly ionic.','Metals bond to each other with a “sea” of shared electrons, which is why they conduct electricity.'],
  example:{q:'What type of bond forms between Mg and O in {MgO}?',steps:['Mg is a metal (group 2) and O is a non-metal.','Mg gives its 2 valence electrons to O, forming {Mg^2+} and {O^2-}.','So the bond is <b>ionic</b>.']},
  quiz:[{q:'Which compound has ionic bonding?',o:['{CO2}','{CH4}','{KBr}','{NH3}'],a:2,w:'K is a metal and Br is a non-metal, so K transfers an electron to Br.'},
        {q:'In a covalent bond, atoms…',o:['transfer electrons','share electrons','lose protons','share neutrons'],a:1,w:'Covalent bonds are shared electron pairs between non-metals.'}]},
 {id:'f3',title:'The mole',sub:'Counting atoms by weighing them',
  lede:'Atoms are far too small to count one by one, so chemists count them in batches called <b>moles</b>.',
  body:`<p>One mole is 6.02 × 10<sup>23</sup> particles. This number is <b>Avogadro’s number</b>. It is like a dozen, just enormous.</p>
  <p>The useful part: one mole of an element weighs its atomic mass in grams. One mole of carbon is 12.01 g. This is the <b>molar mass</b>, written <i>M</i>, in g/mol. For a compound, add up the masses of every atom in the formula.</p>
  <p>The key equation is <span class="f">n = m / M</span>, where <i>n</i> is moles, <i>m</i> is mass in grams, and <i>M</i> is molar mass. You will use this in almost every unit.</p>`,
  points:['Molar mass of {H2O} = 2(1.01) + 16.00 = 18.02 g/mol.','To go from grams to moles, divide by <i>M</i>. To go from moles to grams, multiply by <i>M</i>.','Moles × 6.02 × 10<sup>23</sup> = number of particles.','Try the molar mass calculator in Lab tools for any formula.'],
  example:{q:'How many moles are in 36.0 g of water?',steps:['<i>M</i>({H2O}) = 18.02 g/mol.','n = m / M = 36.0 g ÷ 18.02 g/mol.','n = <b>2.00 mol</b>.']},
  quiz:[{q:'The molar mass of {CO2} is 44.01 g/mol. How many moles are in 88.02 g?',o:['0.50 mol','1.00 mol','2.00 mol','88.02 mol'],a:2,w:'n = 88.02 ÷ 44.01 = 2.00 mol.'},
        {q:'What is the molar mass of {NaCl}? (Na = 22.99, Cl = 35.45)',o:['58.44 g/mol','12.46 g/mol','35.45 g/mol','22.99 g/mol'],a:0,w:'Add one Na and one Cl: 22.99 + 35.45 = 58.44 g/mol.'}]},
 {id:'f4',title:'Chemical equations',sub:'Writing and balancing reactions',
  lede:'A chemical equation is a recipe: reactants on the left, products on the right. Atoms are never created or destroyed, so both sides must have the same atoms.',
  body:`<p>To <b>balance</b> an equation, change only the <b>coefficients</b> (the big numbers in front), never the subscripts. Changing a subscript changes the substance.</p>
  <p>Example: methane burning. Unbalanced: {CH4 + O2 → CO2 + H2O}. There are 4 H on the left but only 2 on the right, so put a 2 in front of water. Now there are 4 O on the right, so put a 2 in front of {O2}. Balanced: {CH4 + 2O2 → CO2 + 2H2O}.</p>
  <p>State symbols show the phase: (s) solid, (l) liquid, (g) gas, (aq) dissolved in water.</p>`,
  points:['<b>Synthesis</b>: A + B → AB.','<b>Decomposition</b>: AB → A + B.','<b>Single displacement</b>: A + BC → AC + B.','<b>Double displacement</b>: AB + CD → AD + CB.','<b>Combustion</b>: fuel + {O2 → CO2 + H2O}.'],
  analogy:'Balance one element at a time. Leave H and O for last, since they usually appear in several places.',
  example:{q:'Balance: {C3H8 + O2 → CO2 + H2O}',steps:['3 C on the left, so put 3 in front of {CO2}.','8 H on the left, so put 4 in front of {H2O}.','Right side O: 3×2 + 4×1 = 10, so put 5 in front of {O2}.','<b>{C3H8 + 5O2 → 3CO2 + 4H2O}</b>']},
  quiz:[{q:'What coefficient goes in front of {O2}: {2H2 + _O2 → 2H2O}?',o:['1','2','3','4'],a:0,w:'2 water molecules contain 2 O atoms, which is one {O2} molecule.'},
        {q:'When balancing an equation, you may change…',o:['subscripts only','coefficients only','both','neither'],a:1,w:'Changing subscripts would turn the substance into a different one.'}]},
 {id:'f5',title:'Stoichiometry and solutions',sub:'Using mole ratios and concentration',
  lede:'The coefficients in a balanced equation are a mole ratio. They tell you how much product you get from a given amount of reactant.',
  body:`<p>In {2H2 + O2 → 2H2O}, 2 mol of hydrogen react with 1 mol of oxygen to make 2 mol of water. The standard method is: grams → moles → use the ratio → moles → grams.</p>
  <p>Most reactions in this course happen in <b>solutions</b>. The <b>concentration</b> of a solution is how many moles are dissolved per litre: <span class="f">c = n / V</span>, in mol/L (also written M).</p>
  <p>The <b>limiting reactant</b> is the one that runs out first. It decides how much product forms.</p>`,
  points:['Always balance the equation before using ratios.','Convert mL to L by dividing by 1000.','Rearrange as needed: n = c × V.'],
  example:{q:'0.20 mol of NaCl is dissolved in 500 mL of water. What is the concentration?',steps:['V = 500 mL = 0.500 L.','c = n / V = 0.20 ÷ 0.500.','c = <b>0.40 mol/L</b>.']},
  quiz:[{q:'In {N2 + 3H2 → 2NH3}, how many mol of {NH3} form from 3 mol of {H2}?',o:['1 mol','2 mol','3 mol','6 mol'],a:1,w:'The ratio {H2} : {NH3} is 3 : 2, so 3 mol of {H2} gives 2 mol of {NH3}.'},
        {q:'How many moles are in 2.0 L of a 0.50 mol/L solution?',o:['0.25 mol','1.0 mol','2.5 mol','4.0 mol'],a:1,w:'n = c × V = 0.50 × 2.0 = 1.0 mol.'}]},
 {id:'f6',title:'Acids and bases',sub:'pH and neutralization',
  lede:'An <b>acid</b> donates hydrogen ions ({H^+}). A <b>base</b> accepts them. This is the Brønsted–Lowry definition you use in Grade 12.',
  body:`<p>In water, {H^+} attaches to a water molecule to form the hydronium ion, {H3O^+}. The more hydronium in a solution, the more acidic it is.</p>
  <p>The <b>pH scale</b> measures this: {pH = −log[H3O^+]}. Below 7 is acidic, 7 is neutral, above 7 is basic. Each step of one pH unit is a tenfold change.</p>
  <p>Acids and bases cancel each other out in <b>neutralization</b>: acid + base → salt + water. For example, {HCl + NaOH → NaCl + H2O}.</p>`,
  points:['Square brackets mean concentration in mol/L. [{H3O^+}] reads “concentration of hydronium”.','If [{H3O^+}] = 1 × 10<sup>−3</sup> mol/L, then pH = 3.','pH 3 is 10 times more acidic than pH 4 and 100 times more than pH 5.'],
  example:{q:'A solution has [{H3O^+}] = 1.0 × 10<sup>−5</sup> mol/L. What is the pH?',steps:['pH = −log(1.0 × 10<sup>−5</sup>).','The log of 10<sup>−5</sup> is −5.','pH = <b>5.00</b>, so it is acidic.']},
  quiz:[{q:'[{H3O^+}] = 1 × 10<sup>−3</sup> mol/L. The pH is…',o:['−3','3','11','0.001'],a:1,w:'pH = −log(10<sup>−3</sup>) = 3.'},
        {q:'How much more acidic is pH 2 than pH 4?',o:['2 times','20 times','100 times','1000 times'],a:2,w:'Two pH units is 10 × 10 = 100 times.'}]}
]},
{id:'b',sym:'Ba',z:56,c:'#3E9B4F',name:'Organic Chemistry',flame:'barium · green',
 blurb:'Carbon compounds: naming, functional groups, reactions and polymers.',lessons:[
 {id:'b1',title:'Hydrocarbons',sub:'Alkanes, alkenes and alkynes',
  lede:'Organic chemistry is the chemistry of carbon. Carbon makes four bonds and can link to itself in long chains and rings, which gives millions of compounds.',
  body:`<p>The simplest organic compounds are <b>hydrocarbons</b>: only carbon and hydrogen. They are named by chain length and by the type of carbon–carbon bond.</p>
  <p><b>Alkanes</b> have only single bonds (C<sub>n</sub>H<sub>2n+2</sub>): methane {CH4}, ethane {C2H6}, propane {C3H8}. <b>Alkenes</b> have at least one double bond ({C=C}), and <b>alkynes</b> have a triple bond.</p>`,
  table:{head:['Carbons','Prefix','Alkane'],rows:[['1','meth-','methane'],['2','eth-','ethane'],['3','prop-','propane'],['4','but-','butane'],['5','pent-','pentane'],['6','hex-','hexane'],['7','hept-','heptane'],['8','oct-','octane'],['9','non-','nonane'],['10','dec-','decane']]},
  points:['Ending tells the bond: -ane single, -ene double, -yne triple.','A number shows where the multiple bond is: but-2-ene has the double bond starting at carbon 2.','<b>Cyclic</b> hydrocarbons form rings: cyclohexane. <b>Benzene</b> ({C6H6}) is a special flat ring, called aromatic.','Isomers have the same formula but different structures.'],
  analogy:'Memory trick for the first four: “Monkeys Eat Peeled Bananas” → meth, eth, prop, but.',
  quiz:[{q:'What is the name of {C3H8}?',o:['methane','propane','propene','butane'],a:1,w:'3 carbons = prop-, and {C3H8} fits C<sub>n</sub>H<sub>2n+2</sub>, so it is an alkane: propane.'},
        {q:'A hydrocarbon with a {C=C} double bond is an…',o:['alkane','alkene','alkyne','alcohol'],a:1,w:'The -ene ending means at least one double bond.'}]},
 {id:'b2',title:'Naming organic compounds',sub:'IUPAC rules, step by step',
  lede:'IUPAC naming gives every compound one exact name, so anyone can draw it from the name alone.',
  body:`<p>Follow the same steps every time:</p>
  <ol><li>Find the <b>longest continuous carbon chain</b>. That is the parent name.</li><li>Number the chain from the end that gives the branches (or the main functional group) the <b>lowest numbers</b>.</li><li>Name each branch: {CH3}– is <b>methyl</b>, {C2H5}– is <b>ethyl</b>. Halogens are fluoro, chloro, bromo, iodo.</li><li>Use di-, tri-, tetra- for repeated branches, and list branches <b>alphabetically</b>.</li></ol>`,
  points:['Numbers and words are separated by hyphens; numbers from each other by commas.','Ignore di-, tri- when alphabetizing: ethyl comes before dimethyl.'],
  example:{q:'Name {CH3CH(CH3)CH2CH3}.',steps:['Longest chain: 4 carbons → butane.','A {CH3} branch is on carbon 2 when numbered from the left (carbon 3 from the right, so use left).','Name: <b>2-methylbutane</b>.']},
  quiz:[{q:'How many carbon atoms are in 2-methylpropane?',o:['2','3','4','5'],a:2,w:'Propane has 3 carbons plus a 1-carbon methyl branch = 4.'},
        {q:'When numbering the main chain you choose the direction that…',o:['starts at the left','gives the lowest numbers to branches','gives the highest numbers','makes the chain shortest'],a:1,w:'The lowest-locant rule decides the direction.'}]},
 {id:'b3',title:'Functional groups',sub:'The parts that make molecules react',
  lede:'A <b>functional group</b> is a specific group of atoms that gives a family of compounds its properties. Learn to spot these and most of the unit falls into place.',
  table:{head:['Family','Group','Ending','Example'],rows:[['Alcohol','–OH','-ol','ethanol {C2H5OH}'],['Alkyl halide','–F, –Cl, –Br, –I','halo- prefix','chloromethane {CH3Cl}'],['Aldehyde','–CHO (C=O at end)','-al','methanal {HCHO}'],['Ketone','C=O in the middle','-one','propanone (acetone)'],['Carboxylic acid','–COOH','-oic acid','ethanoic acid (vinegar)'],['Ester','–COO–','-oate','methyl ethanoate'],['Ether','–O–','-oxy','methoxymethane'],['Amine','–NH2','-amine','methanamine'],['Amide','–CONH2','-amide','ethanamide']]},
  body:`<p>Functional groups also explain physical properties. Groups with O–H or N–H can form <b>hydrogen bonds</b>, so alcohols and acids have much higher boiling points than alkanes of similar size and dissolve better in water.</p>`,
  points:['More polar groups → higher boiling point and better solubility in water.','A longer carbon chain makes a molecule less soluble in water, since the chain is non-polar.','Esters often smell fruity; they are used in flavourings.'],
  quiz:[{q:'Ethanol contains which functional group?',o:['carbonyl','hydroxyl (–OH)','carboxyl','amino'],a:1,w:'The -ol ending signals an alcohol, which has an –OH group.'},
        {q:'A compound whose name ends in “-oic acid” is a…',o:['ketone','ester','carboxylic acid','ether'],a:2,w:'-oic acid names carboxylic acids, which contain –COOH.'}]},
 {id:'b4',title:'Organic reactions',sub:'Six reaction types to recognize',
  lede:'Most SCH4U reaction questions ask you to name the reaction type or predict the product. There are only a handful of types.',
  table:{head:['Type','What happens','Example'],rows:[['Addition','Atoms add across a double or triple bond','{C2H4 + H2O → C2H5OH}'],['Substitution','One atom swaps for another (often H for a halogen)','{CH4 + Cl2 → CH3Cl + HCl}'],['Elimination','Atoms are removed, forming a double bond','{C2H5OH → C2H4 + H2O}'],['Esterification','Acid + alcohol → ester + water','{CH3COOH + CH3OH → CH3COOCH3 + H2O}'],['Oxidation','Alcohol gains O / loses H','ethanol → ethanal → ethanoic acid'],['Combustion','Burns in oxygen','fuel + {O2 → CO2 + H2O}']]},
  body:`<p>Addition and elimination are opposites. Esterification is a type of <b>condensation</b> reaction because a small molecule (water) is released when two molecules join.</p>`,
  points:['Primary alcohols oxidize to aldehydes, then to carboxylic acids.','Secondary alcohols oxidize to ketones.','Alkenes react more readily than alkanes because the double bond is reactive.'],
  quiz:[{q:'Ethene + water → ethanol is which type of reaction?',o:['substitution','addition','elimination','combustion'],a:1,w:'Water adds across the {C=C} double bond.'},
        {q:'A carboxylic acid and an alcohol react to form…',o:['an ether and water','an ester and water','an alkene','an amide'],a:1,w:'This is esterification, a condensation reaction.'}]},
 {id:'b5',title:'Polymers',sub:'Long chains made of repeating units',
  lede:'A <b>polymer</b> is a huge molecule made by linking many small molecules called <b>monomers</b>. Plastics, proteins and starch are all polymers.',
  body:`<p><b>Addition polymers</b> form when alkene monomers open their double bonds and link up. Ethene becomes polyethylene (grocery bags). Nothing else is produced.</p>
  <p><b>Condensation polymers</b> form when monomers with two functional groups join and release a small molecule, usually water. Nylon (an amide link) and polyester (an ester link) are examples, as are proteins, built from amino acids.</p>
  <p>SCH4U also asks you to weigh impacts: plastics are cheap and durable, but that durability means they persist in the environment for centuries. Recycling, bioplastics and reduced use are common discussion points.</p>`,
  points:['Addition polymer: monomer must have a double bond.','Condensation polymer: monomer needs two reactive ends; water is a by-product.','Natural polymers: proteins, cellulose, starch, DNA.'],
  quiz:[{q:'Condensation polymerization produces the polymer and…',o:['nothing else','a small molecule such as water','oxygen gas','heat only'],a:1,w:'Each link releases a small molecule, often {H2O}.'},
        {q:'Which monomer could form an addition polymer?',o:['ethane','ethene','ethanol','ethanoic acid'],a:1,w:'Addition polymers need a double bond to open, and ethene has one.'}]}
]},
{id:'c',sym:'K',z:19,c:'#8A63D2',name:'Structure and Properties',flame:'potassium · lilac',
 blurb:'The quantum atom, electron configurations, shapes of molecules, forces between them.',lessons:[
 {id:'c1',title:'The quantum model of the atom',sub:'Energy levels and orbitals',
  lede:'Electrons do not orbit like planets. They exist in specific energy levels and occupy regions of space called <b>orbitals</b>.',
  body:`<p>Bohr noticed that heated elements give off only certain colours of light (a <b>line spectrum</b>). That is the science behind flame tests, and behind this app’s colours. Electrons can only have certain energies. When one drops from a higher level to a lower one, it releases light of one exact colour.</p>
  <p>The modern model describes each electron with four <b>quantum numbers</b>:</p>`,
  table:{head:['Symbol','Name','Tells you'],rows:[['n','principal','energy level / size (1, 2, 3…)'],['l','secondary','orbital shape: s (0), p (1), d (2), f (3)'],['m<sub>l</sub>','magnetic','orientation in space'],['m<sub>s</sub>','spin','+½ or −½']]},
  points:['Each orbital holds at most 2 electrons, with opposite spins.','s has 1 orbital (2 e⁻), p has 3 (6 e⁻), d has 5 (10 e⁻), f has 7 (14 e⁻).','Level n contains n<sup>2</sup> orbitals.'],
  quiz:[{q:'What is the maximum number of electrons in one orbital?',o:['1','2','6','8'],a:1,w:'The Pauli exclusion principle allows 2, with opposite spins.'},
        {q:'Why does each element give a unique flame colour?',o:['Different nuclei glow','Electrons drop between specific energy levels','The flame reacts with oxygen','Protons release light'],a:1,w:'Each element has its own set of energy levels, so its emitted light has specific wavelengths.'}]},
 {id:'c2',title:'Electron configurations',sub:'Where the electrons go',
  lede:'An electron configuration lists which orbitals an atom’s electrons occupy, filled from lowest energy upward.',
  body:`<p>Three rules decide the order. <b>Aufbau</b>: fill the lowest energy first. <b>Pauli</b>: two electrons per orbital, opposite spins. <b>Hund</b>: in a set of equal orbitals (like the three p), spread electrons out one each before pairing.</p>
  <p>The fill order is {1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p}. Note that 4s fills before 3d.</p>
  <p>Shorthand uses the previous noble gas in brackets. Iron (26 e⁻) is {[Ar] 4s^2 3d^6}.</p>`,
  points:['Superscripts add up to the total electron count.','Exceptions: chromium is {[Ar] 4s^1 3d^5} and copper is {[Ar] 4s^1 3d^10}; half-full and full d sets are extra stable.','The periodic table itself is a map of this: the s-block is groups 1–2, the p-block groups 13–18, the d-block the transition metals.','Tap any element in Lab tools to see its configuration.'],
  example:{q:'Write the configuration for oxygen (8 electrons).',steps:['1s holds 2 → 6 left.','2s holds 2 → 4 left.','2p takes the remaining 4.','<b>{1s^2 2s^2 2p^4}</b>']},
  quiz:[{q:'Which is the configuration for sodium (11 e⁻)?',o:['{1s^2 2s^2 2p^7}','{1s^2 2s^2 2p^6 3s^1}','{1s^2 2s^2 3s^2 3p^5}','{1s^2 2p^6 3s^3}'],a:1,w:'Fill 1s, 2s, 2p (10 electrons), then the 11th goes into 3s.'},
        {q:'Which sublevel fills right before 3d?',o:['3p','4s','4p','3s'],a:1,w:'4s is slightly lower in energy than 3d, so it fills first.'}]},
 {id:'c3',title:'Periodic trends',sub:'Size, ionization energy, electronegativity',
  lede:'Properties change in predictable ways across the table. Two ideas explain all of them: <b>more protons pull harder</b>, and <b>more shells put electrons farther away</b>.',
  table:{head:['Property','Across a period →','Down a group ↓'],rows:[['Atomic radius','decreases','increases'],['Ionization energy (energy to remove an e⁻)','increases','decreases'],['Electronegativity','increases','decreases'],['Metallic character','decreases','increases']]},
  body:`<p>Across a period, protons are added but the shell stays the same, so electrons are pulled in tighter: atoms shrink and hold their electrons more strongly. Down a group, a new shell is added each row, so the outer electrons are farther away and easier to remove.</p>`,
  points:['Fluorine is the most electronegative element (3.98).','Positive ions are smaller than their atoms; negative ions are larger.','Noble gases have the highest ionization energies in each period.'],
  quiz:[{q:'Which atom is larger: Na or Cl?',o:['Na','Cl','Same size'],a:0,w:'Across period 3, the growing nuclear charge pulls electrons closer, so Cl is smaller.'},
        {q:'Which element is most electronegative?',o:['Cs','O','F','Cl'],a:2,w:'Electronegativity peaks at the top right (excluding noble gases): fluorine.'}]},
 {id:'c4',title:'Molecular shapes (VSEPR)',sub:'Why molecules are 3D',
  lede:'Electron pairs repel each other, so they spread out as far as possible around a central atom. This is <b>VSEPR</b> theory, and it predicts a molecule’s shape.',
  body:`<p>Count the electron groups around the central atom (bonds count as one group each, whether single or double, plus lone pairs). That sets the arrangement. Then the shape is named by where the atoms sit, ignoring lone pairs.</p>`,
  table:{head:['Groups','Lone pairs','Shape','Angle','Example'],rows:[['2','0','linear','180°','{CO2}'],['3','0','trigonal planar','120°','{BF3}'],['4','0','tetrahedral','109.5°','{CH4}'],['4','1','trigonal pyramidal','≈107°','{NH3}'],['4','2','bent','≈104.5°','{H2O}'],['5','0','trigonal bipyramidal','90°, 120°','{PCl5}'],['6','0','octahedral','90°','{SF6}']]},
  points:['Lone pairs push harder than bonds, which squeezes the angle (109.5° → 107° → 104.5°).','A molecule is <b>polar</b> if it has polar bonds <i>and</i> an asymmetric shape.','{CO2} has polar bonds but is non-polar, because the two pulls cancel in a straight line. {H2O} is bent, so it is polar.'],
  quiz:[{q:'What is the shape of {CH4}?',o:['linear','trigonal planar','tetrahedral','bent'],a:2,w:'4 bonding groups, no lone pairs → tetrahedral, 109.5°.'},
        {q:'Is {CO2} polar?',o:['Yes, C=O bonds are polar','No, the linear shape cancels the bond dipoles'],a:1,w:'Equal and opposite dipoles in a straight line cancel out.'}]},
 {id:'c5',title:'Intermolecular forces and solids',sub:'Forces between molecules',
  lede:'Bonds hold atoms together <i>inside</i> a molecule. <b>Intermolecular forces</b> hold separate molecules to each other, and they decide boiling points, melting points and solubility.',
  table:{head:['Force','Found in','Strength'],rows:[['London dispersion','all molecules; grows with size','weakest (per contact)'],['Dipole–dipole','polar molecules','medium'],['Hydrogen bonding','H bonded to N, O or F','strongest of the three']]},
  body:`<p>Water ({H2O}) boils at 100 °C while the similar but larger {H2S} boils at −60 °C. The difference is hydrogen bonding in water.</p>
  <p>Solids fall into four types:</p>`,
  points:['<b>Ionic</b> (NaCl): high melting point, brittle, conducts only when melted or dissolved.','<b>Molecular</b> (ice, sugar): low melting point, soft, does not conduct.','<b>Metallic</b> (Cu): conducts as a solid, malleable.','<b>Covalent network</b> (diamond, quartz {SiO2}): extremely hard, very high melting point.','“Like dissolves like”: polar dissolves polar, non-polar dissolves non-polar.'],
  quiz:[{q:'Why does water boil at a much higher temperature than {H2S}?',o:['Water molecules are larger','Hydrogen bonding between water molecules','{H2S} is ionic','Water has covalent network bonds'],a:1,w:'O is very electronegative, so O–H bonds allow hydrogen bonding; S–H bonds do not.'},
        {q:'Diamond is an example of which type of solid?',o:['ionic','molecular','metallic','covalent network'],a:3,w:'Every carbon is covalently bonded to 4 others in a giant network.'}]}
]},
{id:'d',sym:'Sr',z:38,c:'#D2334C',name:'Energy and Rates',flame:'strontium · crimson',
 blurb:'Heat in reactions, Hess’s law, and what controls how fast reactions go.',lessons:[
 {id:'d1',title:'Enthalpy and calorimetry',sub:'Measuring heat in reactions',
  lede:'Breaking bonds takes energy; forming bonds releases energy. The overall heat change at constant pressure is called <b>enthalpy change</b>, ΔH.',
  body:`<p>An <b>exothermic</b> reaction releases heat to the surroundings (they get warmer) and has <b>ΔH &lt; 0</b>. Burning fuel is exothermic. An <b>endothermic</b> reaction absorbs heat (the surroundings get colder) and has <b>ΔH &gt; 0</b>. A cold pack is endothermic.</p>
  <p>In a <b>calorimeter</b>, you measure the temperature change of water and calculate heat with <span class="f">q = mcΔT</span>. For water, c = 4.18 J/(g·°C). Then ΔH = −q / n for the reaction, since the heat the water gained came from the reaction.</p>`,
  points:['A thermochemical equation includes ΔH: {CH4 + 2O2 → CO2 + 2H2O}, ΔH = −890 kJ.','If the equation is doubled, ΔH doubles.','Units: q in J, divide by 1000 for kJ; molar enthalpy in kJ/mol.'],
  example:{q:'50.0 g of water warms by 10.0 °C. How much heat did it absorb?',steps:['q = mcΔT = 50.0 × 4.18 × 10.0','q = 2090 J','q = <b>2.09 kJ</b>']},
  quiz:[{q:'A reaction has ΔH = −890 kJ. It is…',o:['endothermic','exothermic','neither','impossible to tell'],a:1,w:'Negative ΔH means heat is released.'},
        {q:'100 g of water cools by 2.0 °C. How much heat did it lose?',o:['418 J','836 J','200 J','8.36 J'],a:1,w:'q = 100 × 4.18 × 2.0 = 836 J.'}]},
 {id:'d2',title:'Hess’s law',sub:'Adding reactions together',
  lede:'The total ΔH of a reaction is the same no matter what path you take. So you can build an unknown reaction from known ones and add their ΔH values.',
  body:`<p>When you manipulate equations, apply the same change to ΔH:</p>`,
  points:['Reverse an equation → flip the sign of ΔH.','Multiply an equation by a number → multiply ΔH by that number.','Add the equations; cancel anything that appears on both sides.','With standard enthalpies of formation: ΔH° = Σ nΔH°<sub>f</sub>(products) − Σ nΔH°<sub>f</sub>(reactants). Elements in their standard state have ΔH°<sub>f</sub> = 0.'],
  example:{q:'Find ΔH for {C + 1/2O2 → CO}, given (1) {C + O2 → CO2} ΔH = −393.5 kJ and (2) {CO + 1/2O2 → CO2} ΔH = −283.0 kJ.',steps:['Keep (1) as is: −393.5 kJ.','Reverse (2): {CO2 → CO + 1/2O2}, ΔH = +283.0 kJ.','Add: {CO2} cancels, ½{O2} is left on the reactant side.','ΔH = −393.5 + 283.0 = <b>−110.5 kJ</b>']},
  quiz:[{q:'A → B has ΔH = +50 kJ. What is ΔH for B → A?',o:['+50 kJ','−50 kJ','0','+100 kJ'],a:1,w:'Reversing a reaction flips the sign.'},
        {q:'If you multiply an equation by 3, its ΔH…',o:['stays the same','is divided by 3','is multiplied by 3','flips sign'],a:2,w:'Three times the amount of reaction gives three times the heat.'}]},
 {id:'d3',title:'Reaction rates and collision theory',sub:'Why some reactions are fast',
  lede:'For a reaction to happen, particles must collide with enough energy and in the right orientation. That minimum energy is the <b>activation energy</b>, E<sub>a</sub>.',
  diagram:'pe',
  body:`<p>Rate is how fast a concentration changes: rate = Δ[product] / Δt, in mol/(L·s). Anything that increases the number of effective collisions speeds up a reaction:</p>`,
  points:['<b>Concentration</b> or pressure up → more collisions.','<b>Temperature</b> up → particles move faster and more of them exceed E<sub>a</sub>. A 10 °C rise often roughly doubles the rate.','<b>Surface area</b> up (powder vs lump) → more particles exposed.','<b>Catalyst</b> → provides a path with a lower E<sub>a</sub>; it is not used up and does not change ΔH.','<b>Nature of reactants</b> → ions in solution react faster than solids with strong bonds.'],
  quiz:[{q:'A catalyst speeds up a reaction by…',o:['raising the temperature','lowering the activation energy','changing ΔH','adding more reactant'],a:1,w:'It opens an alternative pathway with a lower energy barrier.'},
        {q:'Why does powdered zinc react faster with acid than a zinc lump?',o:['Powder is hotter','Powder has more surface area','Powder has lower ΔH','Powder is a catalyst'],a:1,w:'More exposed surface allows more collisions per second.'}]},
 {id:'d4',title:'Rate laws and mechanisms',sub:'Putting numbers to speed',
  lede:'A <b>rate law</b> shows how rate depends on each concentration: <span class="f">rate = k[A]<sup>m</sup>[B]<sup>n</sup></span>.',
  body:`<p><i>k</i> is the rate constant (it changes with temperature). The exponents <i>m</i> and <i>n</i> are the <b>orders</b>, and they must be found from experiment, not from the balanced equation.</p>
  <p>Compare two trials where only one concentration changes:</p>`,
  table:{head:['[A] change','Rate change','Order in A'],rows:[['× 2','no change','0'],['× 2','× 2','1'],['× 2','× 4','2']]},
  points:['The overall order is m + n.','Most reactions happen in several small steps called a <b>mechanism</b>.','The slowest step is the <b>rate-determining step</b>, and the rate law matches it.','A species made in one step and used in a later step is an <b>intermediate</b>.'],
  quiz:[{q:'Doubling [A] makes the rate 4 times faster. The order in A is…',o:['0','1','2','4'],a:2,w:'2<sup>m</sup> = 4, so m = 2.'},
        {q:'The rate-determining step is the…',o:['first step','fastest step','slowest step','last step'],a:2,w:'The slowest step limits the overall rate, like the narrowest point in a funnel.'}]}
]},
{id:'e',sym:'Ca',z:20,c:'#DE6A1F',light:true,name:'Equilibrium',flame:'calcium · orange',
 blurb:'Reversible reactions, K, Le Châtelier, acids, bases and solubility.',lessons:[
 {id:'e1',title:'Dynamic equilibrium',sub:'Reactions that go both ways',
  lede:'Many reactions are <b>reversible</b>. In a closed system they reach a point where the forward and reverse reactions run at the same rate. That is <b>equilibrium</b>.',
  body:`<p>We write reversible reactions with a double arrow: {N2 + 3H2 ⇌ 2NH3}. At equilibrium, reactions have not stopped. Both directions are still happening, just at equal speeds, so the concentrations stay constant. That is why it is called dynamic.</p>`,
  points:['At equilibrium, concentrations are <b>constant</b>, not necessarily equal.','Equilibrium needs a closed system, where nothing enters or leaves.','You can reach the same equilibrium starting from either side.'],
  analogy:'Picture an escalator going up while you walk down at the same speed. You stay in place even though both motions continue.',
  quiz:[{q:'At equilibrium…',o:['the reaction stops','reactant and product concentrations are equal','forward and reverse rates are equal','only products remain'],a:2,w:'Both reactions continue at equal rates, so concentrations stay constant.'},
        {q:'Equilibrium can only be established in…',o:['an open system','a closed system','a solid','a vacuum'],a:1,w:'If products escape, the reverse reaction cannot keep up.'}]},
 {id:'e2',title:'The equilibrium constant, K',sub:'A number for where equilibrium lies',
  lede:'For {aA + bB ⇌ cC + dD}, the equilibrium constant is products over reactants, each raised to its coefficient.',
  body:`<p class="f" style="font-size:1.05em">K = [C]<sup>c</sup>[D]<sup>d</sup> / ([A]<sup>a</sup>[B]<sup>b</sup>)</p>
  <p>For the Haber process, {N2 + 3H2 ⇌ 2NH3}: K = [{NH3}]<sup>2</sup> / ([{N2}][{H2}]<sup>3</sup>).</p>
  <p>Leave out pure solids and liquids; their concentrations do not change. K changes only with temperature.</p>
  <p>To predict which way a mixture will move, calculate the <b>reaction quotient Q</b> with the current concentrations and compare it to K.</p>`,
  table:{head:['Compare','Meaning'],rows:[['K &gt; 1','products favoured at equilibrium'],['K &lt; 1','reactants favoured'],['Q &lt; K','shifts right, toward products'],['Q &gt; K','shifts left, toward reactants'],['Q = K','at equilibrium']]},
  points:['ICE tables (Initial, Change, Equilibrium) organize equilibrium calculations.'],
  example:{q:'At equilibrium, [{H2}] = 0.10, [{I2}] = 0.10 and [{HI}] = 0.70 mol/L for {H2 + I2 ⇌ 2HI}. Find K.',steps:['K = [HI]<sup>2</sup> / ([H<sub>2</sub>][I<sub>2</sub>])','K = (0.70)<sup>2</sup> / (0.10 × 0.10) = 0.49 / 0.010','K = <b>49</b>, so products are favoured.']},
  quiz:[{q:'If Q < K, the reaction will…',o:['shift right','shift left','stay put','stop'],a:0,w:'There are not enough products yet, so the forward reaction wins until Q = K.'},
        {q:'Which substances are left out of a K expression?',o:['gases','aqueous ions','pure solids and liquids','products'],a:2,w:'Their concentrations are effectively constant.'}]},
 {id:'e3',title:'Le Châtelier’s principle',sub:'How equilibrium responds to change',
  lede:'If you disturb a system at equilibrium, it shifts in the direction that partly undoes the disturbance.',
  sim:true,
  points:['Add a substance → shift away from it. Remove a substance → shift toward it.','Increase pressure (decrease volume) → shift to the side with fewer gas molecules.','For temperature, treat heat as a reactant or product. In an exothermic reaction heat is a product, so heating shifts left.','Temperature is the only change that alters the value of K.','A catalyst speeds up both directions equally, so no shift happens.'],
  quiz:[{q:'An exothermic reaction is at equilibrium. You heat it. It shifts…',o:['right','left','not at all'],a:1,w:'Heat is a product in an exothermic reaction, so adding heat shifts left.'},
        {q:'For {N2 + 3H2 ⇌ 2NH3}, increasing the pressure shifts…',o:['right (2 gas molecules)','left (4 gas molecules)','nowhere'],a:0,w:'The right side has fewer gas molecules (2 vs 4).'}]},
 {id:'e4',title:'Acid–base equilibria',sub:'Strong vs weak, Ka, Kb and buffers',
  lede:'<b>Strong</b> acids ionize completely in water. <b>Weak</b> acids ionize only a little and reach an equilibrium.',
  body:`<p>Strong acids to know: HCl, HBr, HI, {HNO3}, {H2SO4}, {HClO4}. Most others, like ethanoic acid, are weak. For a weak acid: {HA + H2O ⇌ H3O^+ + A^-}, with K<sub>a</sub> = [{H3O^+}][{A^-}] / [HA]. A bigger K<sub>a</sub> means a stronger acid.</p>
  <p>Water itself ionizes slightly: K<sub>w</sub> = [{H3O^+}][{OH^-}] = 1.0 × 10<sup>−14</sup> at 25 °C. That gives <b>pH + pOH = 14</b>.</p>
  <p>A <b>buffer</b> is a mix of a weak acid and its conjugate base. It resists pH change when small amounts of acid or base are added. Your blood is buffered.</p>`,
  points:['Conjugate pair: an acid and the base it becomes after losing {H^+}, e.g. {NH4^+} / {NH3}.','For a strong acid, [{H3O^+}] = concentration of the acid.','Titration finds an unknown concentration; the equivalence point is where moles of acid = moles of base.'],
  example:{q:'What is the pH of 0.010 mol/L HCl?',steps:['HCl is strong, so [{H3O^+}] = 0.010 mol/L.','pH = −log(0.010)','pH = <b>2.00</b>']},
  quiz:[{q:'If pH = 4, the pOH is…',o:['4','10','14','−4'],a:1,w:'pH + pOH = 14, so pOH = 10.'},
        {q:'Which acid is weak?',o:['HCl','{HNO3}','ethanoic acid','{H2SO4}'],a:2,w:'Ethanoic (acetic) acid only partially ionizes.'}]},
 {id:'e5',title:'Solubility equilibria',sub:'Ksp and precipitates',
  lede:'Even “insoluble” salts dissolve a tiny bit. The equilibrium between the solid and its ions is described by the <b>solubility product</b>, K<sub>sp</sub>.',
  body:`<p>For silver chloride: {AgCl(s) ⇌ Ag^+(aq) + Cl^-(aq)}, so K<sub>sp</sub> = [{Ag^+}][{Cl^-}]. The solid is left out.</p>
  <p>Mix two solutions and calculate the ion product Q. If <b>Q &gt; K<sub>sp</sub></b>, a <b>precipitate</b> forms. If Q ≤ K<sub>sp</sub>, everything stays dissolved.</p>`,
  points:['Smaller K<sub>sp</sub> → less soluble.','<b>Common ion effect</b>: adding an ion already in the equilibrium (e.g. NaCl to AgCl) shifts it left and lowers solubility.','For {AgCl}, if solubility is s mol/L then K<sub>sp</sub> = s<sup>2</sup>.'],
  quiz:[{q:'A precipitate forms when…',o:['Q &lt; K<sub>sp</sub>','Q = K<sub>sp</sub>','Q &gt; K<sub>sp</sub>','K<sub>sp</sub> > 1'],a:2,w:'The solution holds more ions than it can, so solid comes out.'},
        {q:'Adding NaCl to a saturated AgCl solution makes AgCl…',o:['more soluble','less soluble','unchanged'],a:1,w:'Extra {Cl^-} pushes the equilibrium left: the common ion effect.'}]}
]},
{id:'x',sym:'Cu',z:29,c:'#1B8FA3',name:'Electrochemistry',flame:'copper · blue-green',
 blurb:'Redox reactions, batteries, and using electricity to drive chemistry.',lessons:[
 {id:'x1',title:'Oxidation and reduction',sub:'Electron transfer and oxidation numbers',
  lede:'<b>Redox</b> reactions move electrons from one substance to another. Remember <b>OIL RIG</b>: Oxidation Is Loss, Reduction Is Gain (of electrons).',
  body:`<p>Drop zinc into copper(II) sulfate: {Zn + Cu^2+ → Zn^2+ + Cu}. Zinc loses 2 electrons (oxidized). Copper ions gain them (reduced) and coat the zinc in copper metal.</p>
  <p>The substance that gets reduced is the <b>oxidizing agent</b> ({Cu^2+}); the one that gets oxidized is the <b>reducing agent</b> (Zn).</p>
  <p><b>Oxidation numbers</b> track electrons. Rules: elements alone = 0; a simple ion = its charge; O is usually −2; H is usually +1; the numbers add to the overall charge.</p>`,
  points:['Oxidation number goes up → oxidized. Goes down → reduced.','Oxidation and reduction always happen together.'],
  example:{q:'Find the oxidation number of S in {SO4^2-}.',steps:['4 O × (−2) = −8.','S + (−8) = −2 (the ion’s charge).','S = <b>+6</b>']},
  quiz:[{q:'In {Zn + Cu^2+ → Zn^2+ + Cu}, zinc is…',o:['reduced','oxidized','a catalyst','unchanged'],a:1,w:'Zn goes from 0 to +2: it lost electrons.'},
        {q:'What is the oxidation number of Mn in {KMnO4}?',o:['+1','+4','+7','−1'],a:2,w:'K = +1, 4 O = −8, so Mn = +7 for a total of 0.'}]},
 {id:'x2',title:'Balancing redox equations',sub:'The half-reaction method',
  lede:'Split the reaction into an oxidation half and a reduction half, balance each, then make the electrons match.',
  body:`<p>In acidic solution:</p>
  <ol><li>Write the two half-reactions.</li><li>Balance atoms other than O and H.</li><li>Balance O by adding {H2O}.</li><li>Balance H by adding {H^+}.</li><li>Balance charge by adding electrons (e⁻).</li><li>Multiply so both halves have the same number of electrons, then add and cancel.</li></ol>
  <p>For basic solution, finish in acid, then add {OH^-} to both sides to cancel each {H^+} (they form water).</p>`,
  example:{q:'Balance the reduction half: {MnO4^- → Mn^2+} (acidic).',steps:['Mn is balanced.','Add 4 {H2O} to the right for oxygen.','Add 8 {H^+} to the left for hydrogen.','Charge: left +7, right +2 → add 5 e⁻ to the left.','<b>{MnO4^- + 8H^+ + 5e^- → Mn^2+ + 4H2O}</b>']},
  quiz:[{q:'In acidic solution, oxygen atoms are balanced by adding…',o:['{O2}','{H2O}','{OH^-}','{H^+}'],a:1,w:'Water supplies O atoms; then {H^+} fixes hydrogen.'},
        {q:'Before adding two half-reactions you must…',o:['equalize the electrons','remove all water','double both','reverse one'],a:0,w:'Electrons lost must equal electrons gained.'}]},
 {id:'x3',title:'Galvanic cells',sub:'Batteries from redox reactions',
  lede:'A <b>galvanic cell</b> separates the two halves of a spontaneous redox reaction so the electrons have to flow through a wire. That flow is electricity.',
  diagram:'cell',
  body:`<p>Oxidation happens at the <b>anode</b> and reduction at the <b>cathode</b> (“An Ox, Red Cat”). Electrons flow through the wire from anode to cathode. A <b>salt bridge</b> lets ions move between the beakers to keep both sides electrically neutral.</p>
  <p>Cell voltage comes from a table of standard reduction potentials: <span class="f">E°<sub>cell</sub> = E°<sub>cathode</sub> − E°<sub>anode</sub></span>. A positive E°<sub>cell</sub> means the reaction is spontaneous.</p>`,
  example:{q:'Find E°<sub>cell</sub> for the zinc–copper cell. E°({Cu^2+}/Cu) = +0.34 V, E°({Zn^2+}/Zn) = −0.76 V.',steps:['The higher E° is reduced: copper is the cathode.','E°<sub>cell</sub> = 0.34 − (−0.76)','E°<sub>cell</sub> = <b>+1.10 V</b>, spontaneous.']},
  quiz:[{q:'Oxidation takes place at the…',o:['cathode','anode','salt bridge','voltmeter'],a:1,w:'An Ox: anode, oxidation.'},
        {q:'Electrons flow through the external wire from…',o:['cathode to anode','anode to cathode','salt bridge to anode','they do not flow'],a:1,w:'The anode releases electrons, the cathode consumes them.'}]},
 {id:'x4',title:'Electrolytic cells and applications',sub:'Electroplating, Faraday, corrosion',
  lede:'An <b>electrolytic cell</b> uses an outside power source to force a non-spontaneous reaction. It is a galvanic cell run backwards.',
  body:`<p>Uses include <b>electroplating</b> (coating jewellery or car parts with a metal), refining copper, and producing aluminium and chlorine. Recharging a phone battery is electrolysis too.</p>
  <p>The amount of product depends on charge. <span class="f">Q = I·t</span> (coulombs = amps × seconds). Moles of electrons = Q / F, where <b>F = 96 485 C/mol</b> (Faraday’s constant). Then use the half-reaction ratio.</p>
  <p><b>Corrosion</b> (rusting) is unwanted redox: iron is oxidized by oxygen and water. It is prevented by paint, galvanizing with zinc, or a <b>sacrificial anode</b>, a more reactive metal that corrodes instead.</p>`,
  points:['Anode is still oxidation and cathode still reduction; in electrolysis the anode is the positive terminal.','{Cu^2+ + 2e^- → Cu}: 2 mol of electrons deposit 1 mol of copper.','Fuel cells run continuously as long as fuel is supplied, e.g. hydrogen + oxygen → water.'],
  example:{q:'A current of 2.00 A runs for 965 s through {Cu^2+}. What mass of copper is plated?',steps:['Q = 2.00 × 965 = 1930 C','n(e⁻) = 1930 ÷ 96 485 = 0.0200 mol','n(Cu) = 0.0200 ÷ 2 = 0.0100 mol','m = 0.0100 × 63.55 = <b>0.636 g</b>']},
  quiz:[{q:'How much charge passes when 2.0 A flows for 100 s?',o:['50 C','102 C','200 C','2.0 C'],a:2,w:'Q = I × t = 2.0 × 100 = 200 C.'},
        {q:'A sacrificial anode protects iron because it…',o:['is less reactive','is more easily oxidized','is a catalyst','blocks light'],a:1,w:'It gives up electrons before iron does, so it corrodes instead.'}]}
]}
];

 {id:'m1',title:'Periodic trends',sub:'Why the table is shaped the way it is',
  lede:'The periodic table is organized so that properties change in a predictable way as you move across a row or down a column.',
  body:`<p>Two ideas explain almost every trend. Moving <b>across a period</b>, each atom has one more proton but the same number of shells, so the nucleus pulls the electrons in tighter. Moving <b>down a group</b>, each row adds a whole new shell, so the outer electrons sit farther from the nucleus.</p>`,
  table:{head:['Property','Across a period →','Down a group ↓'],rows:[['Atomic radius (size)','gets smaller','gets bigger'],['Ionization energy (energy to remove an electron)','increases','decreases'],['Electronegativity (pull on shared electrons)','increases','decreases'],['Metal reactivity','decreases','increases'],['Non-metal reactivity','increases','decreases']]},
  points:['Group 1 metals get more reactive going down: lithium fizzes in water, potassium bursts into flame.','Group 17 non-metals (halogens) get more reactive going up: fluorine is the most reactive non-metal.','Metals form positive ions by losing electrons; non-metals form negative ions by gaining them.','The charge an element usually forms is set by its group: group 1 → 1+, group 2 → 2+, group 16 → 2−, group 17 → 1−.'],
  analogy:'Think of the outer electrons as a dog on a leash. More protons is a stronger owner; more shells is a longer leash.',
  quiz:[{q:'Which atom is largest?',o:['Li','Na','K','Rb'],a:3,w:'Size increases down a group because each row adds a shell. Rb is lowest.'},
        {q:'Which is the most reactive metal?',o:['Mg','Na','K','Ca'],a:2,w:'Reactivity of metals increases down and to the left. K is lowest and farthest left of these.'},
        {q:'What charge does an oxygen ion usually have?',o:['2+','1−','2−','6+'],a:2,w:'O is in group 16, so it gains 2 electrons to fill its outer shell: {O^2-}.'}]},
 {id:'m2',title:'Naming compounds',sub:'Ionic, covalent and acids',
  lede:'Every compound has a systematic name. The rules depend on whether it is ionic (metal + non-metal) or molecular (non-metals only).',
  body:`<h2>Ionic compounds</h2><p>Name the metal, then the non-metal with its ending changed to <b>-ide</b>: {NaCl} is sodium chloride, {MgO} is magnesium oxide. To write the formula, balance the charges so they add to zero: {Al^3+} and {O^2-} give {Al2O3}.</p>
  <p>Some metals can form more than one ion. Use a Roman numeral for the charge: {FeCl2} is iron(II) chloride and {FeCl3} is iron(III) chloride.</p>
  <h2>Polyatomic ions</h2><p>Some ions are groups of atoms with an overall charge. Learn these common ones:</p>`,
  table:{head:['Ion','Formula','Ion','Formula'],rows:[['nitrate','{NO3^-}','hydroxide','{OH^-}'],['sulfate','{SO4^2-}','carbonate','{CO3^2-}'],['phosphate','{PO4^3-}','ammonium','{NH4^+}'],['hydrogen carbonate','{HCO3^-}','chlorate','{ClO3^-}']]},
  points:['Molecular compounds use prefixes: mono-, di-, tri-, tetra-, penta-. {CO2} is carbon dioxide, {N2O4} is dinitrogen tetroxide. Drop “mono” on the first element.','Use brackets for more than one polyatomic ion: {Ca(OH)2} is calcium hydroxide.','Common acids: HCl hydrochloric acid, {H2SO4} sulfuric acid, {HNO3} nitric acid.'],
  example:{q:'Write the formula for calcium phosphate.',steps:['Ions: {Ca^2+} and {PO4^3-}.','Find the lowest common multiple of 2 and 3: 6.','3 Ca (6+) and 2 phosphate (6−).','<b>{Ca3(PO4)2}</b>']},
  quiz:[{q:'What is the name of {CaCl2}?',o:['calcium dichloride','calcium chloride','calcium chlorine','chlorine calcide'],a:1,w:'Ionic compounds don’t use prefixes. Metal name + non-metal with -ide.'},
        {q:'What is the formula for dinitrogen trioxide?',o:['{N2O3}','{N3O2}','{NO3}','{2NO3}'],a:0,w:'di = 2 nitrogen, tri = 3 oxygen.'},
        {q:'What is the formula for aluminium sulfate? ({Al^3+}, {SO4^2-})',o:['{AlSO4}','{Al2SO4}','{Al2(SO4)3}','{Al3(SO4)2}'],a:2,w:'2 × 3+ = 6+ and 3 × 2− = 6−, so {Al2(SO4)3}.'}]},
 R('f4',{title:'Equations and reaction types'}),
 {id:'m3',title:'The activity series',sub:'Predicting single displacement',
  lede:'In a single displacement reaction, a more reactive element pushes a less reactive one out of a compound. The <b>activity series</b> ranks metals so you can predict whether it will happen.',
  body:`<p>A metal can replace any metal <b>below</b> it in the series. Zinc is above copper, so zinc in copper(II) sulfate reacts: {Zn + CuSO4 → ZnSO4 + Cu}. Copper is below zinc, so copper in zinc sulfate does nothing.</p>
  <p>Hydrogen sits in the list too. Metals above hydrogen react with acids to make hydrogen gas. Metals below it, like copper, silver and gold, don’t react with ordinary acids, which is why they are used for coins and jewellery.</p>`,
  table:{head:['Most reactive at top','Reacts with'],rows:[['lithium, potassium, calcium, sodium','cold water'],['magnesium, aluminium, zinc, iron','acids (and steam)'],['nickel, tin, lead','acids, slowly'],['hydrogen','(reference point)'],['copper, silver, mercury, gold','none of the above']]},
  points:['Halogens have their own series: {F2} > {Cl2} > {Br2} > {I2}. Chlorine can replace bromide, but iodine can’t replace chloride.','If the free element is lower than the one in the compound, write “no reaction”.'],
  quiz:[{q:'Will iron react with copper(II) chloride solution?',o:['Yes, iron is above copper','No, iron is below copper','Only if heated'],a:0,w:'Iron is more reactive, so it replaces copper: {Fe + CuCl2 → FeCl2 + Cu}.'},
        {q:'Which metal will NOT react with hydrochloric acid?',o:['Mg','Zn','Fe','Ag'],a:3,w:'Silver is below hydrogen in the activity series.'}]},
 {id:'m4',title:'Qualitative analysis',sub:'Identifying unknown substances',
  lede:'<b>Qualitative analysis</b> means figuring out what is in a sample (not how much). You use the clues a substance gives off: colour, a precipitate, a gas, or a flame colour.',
  body:`<h2>Flame tests</h2><p>Heat a metal ion in a flame and its electrons jump to higher energy levels, then fall back and give off light of a specific colour. That is where this app’s colours come from.</p>`,
  table:{head:['Ion','Flame colour'],rows:[['lithium {Li^+}','red'],['sodium {Na^+}','bright yellow'],['potassium {K^+}','lilac'],['calcium {Ca^2+}','orange-red'],['strontium {Sr^2+}','crimson'],['barium {Ba^2+}','pale green'],['copper {Cu^2+}','blue-green']]},
  points:['<b>Precipitate tests</b>: adding silver nitrate to a chloride gives a white precipitate (AgCl). Adding barium chloride to a sulfate gives a white precipitate ({BaSO4}).','<b>Gas tests</b>: hydrogen makes a “pop” with a burning splint; oxygen relights a glowing splint; carbon dioxide turns limewater cloudy.','<b>Indicators</b>: litmus turns red in acid and blue in base.','Solution colours help too: {Cu^2+} is blue, {Fe^3+} is yellow-brown, {MnO4^-} is purple.','Always do one test at a time and compare against a known sample.'],
  quiz:[{q:'A sample burns with a crimson flame. Which ion is it most likely?',o:['{Na^+}','{Sr^2+}','{Cu^2+}','{K^+}'],a:1,w:'Strontium gives crimson. It’s also used in red fireworks.'},
        {q:'A gas turns limewater cloudy. What is it?',o:['oxygen','hydrogen','carbon dioxide','nitrogen'],a:2,w:'{CO2} reacts with limewater to form a cloudy calcium carbonate precipitate.'},
        {q:'Adding silver nitrate gives a white precipitate. The sample probably contains…',o:['chloride ions','sodium ions','sulfate ions','hydrogen gas'],a:0,w:'{Ag^+} and {Cl^-} form insoluble white AgCl.'}]}
]},
