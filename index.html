 {id:'k1',title:'Percent composition',sub:'What fraction of a compound each element is',
  lede:'<b>Percent composition</b> tells you what percentage of a compound’s mass comes from each element.',
  body:`<p>Use the molar mass. For each element: <span class="f">% = (mass of element in 1 mol ÷ molar mass) × 100</span>. The percentages should add up to about 100%.</p>`,
  example:{q:'What is the percent composition of water, {H2O}?',steps:['Molar mass = 2(1.01) + 16.00 = 18.02 g/mol.','% H = 2.02 ÷ 18.02 × 100 = <b>11.2%</b>','% O = 16.00 ÷ 18.02 × 100 = <b>88.8%</b>','Check: 11.2 + 88.8 = 100.0 ✓']},
  points:['Percent composition is the same for any sample size. A drop of water and an ocean are both 11.2% hydrogen by mass.','In a lab, % = mass of element ÷ mass of sample × 100.','Fertilizer bags list percent nitrogen, phosphorus and potassium this way.'],
  quiz:[{q:'{CO2} has a molar mass of 44.01 g/mol. What percent of it is carbon (12.01)?',o:['12.0%','27.3%','50.0%','72.7%'],a:1,w:'12.01 ÷ 44.01 × 100 = 27.3%.'},
        {q:'A 50.0 g sample contains 20.0 g of calcium. What percent is calcium?',o:['20%','40%','50%','60%'],a:1,w:'20.0 ÷ 50.0 × 100 = 40%.'}]},
 {id:'k2',title:'Empirical and molecular formulas',sub:'Working backwards from percentages',
  lede:'The <b>empirical formula</b> is the simplest whole-number ratio of atoms. The <b>molecular formula</b> is the actual number of atoms in one molecule.',
  body:`<p>Glucose is {C6H12O6} (molecular). Divide everything by 6 and you get {CH2O} (empirical). You can find the empirical formula from lab data in four steps:</p>
  <ol><li>Assume 100 g, so percentages become grams.</li><li>Convert each mass to moles (divide by molar mass).</li><li>Divide every mole value by the smallest one.</li><li>Round to whole numbers (multiply all by 2 or 3 if you get .5 or .33).</li></ol>
  <p>To get the molecular formula, divide the real molar mass by the empirical formula’s mass. Multiply the subscripts by that whole number.</p>`,
  example:{q:'A compound is 40.0% C, 6.7% H and 53.3% O. Find its empirical formula.',steps:['In 100 g: 40.0 g C, 6.7 g H, 53.3 g O.','Moles: C 40.0 ÷ 12.01 = 3.33; H 6.7 ÷ 1.01 = 6.63; O 53.3 ÷ 16.00 = 3.33.','Divide by 3.33: C 1, H 2, O 1.','Empirical formula: <b>{CH2O}</b>']},
  quiz:[{q:'What is the empirical formula of {C2H6}?',o:['{CH3}','{C2H6}','{CH2}','{C2H3}'],a:0,w:'Divide both subscripts by 2.'},
        {q:'Empirical formula {CH2} (14 g/mol), molar mass 42 g/mol. Molecular formula?',o:['{CH2}','{C2H4}','{C3H6}','{C4H8}'],a:2,w:'42 ÷ 14 = 3, so multiply by 3: {C3H6}.'}]},
 {id:'k3',title:'Stoichiometry',sub:'How much product from how much reactant',
  lede:'The coefficients in a balanced equation are a recipe in moles. Stoichiometry uses that recipe to predict masses.',
  body:`<p>Every stoichiometry question follows the same path: <b>grams of A → moles of A → (mole ratio) → moles of B → grams of B</b>.</p>
  <p>In {2H2 + O2 → 2H2O}, the ratio is 2 mol {H2} : 1 mol {O2} : 2 mol {H2O}.</p>`,
  example:{q:'How many grams of water form when 4.04 g of {H2} burns completely? {2H2 + O2 → 2H2O}',steps:['Moles of {H2} = 4.04 ÷ 2.02 = 2.00 mol.','Ratio {H2} : {H2O} = 2 : 2, so 2.00 mol of water.','Mass = 2.00 × 18.02 = <b>36.0 g</b>']},
  points:['Always balance the equation first.','Never compare grams directly. Only moles follow the ratio.','Write units on every number. They show you when a step is missing.'],
  quiz:[{q:'In {N2 + 3H2 → 2NH3}, how many moles of {NH3} form from 6 mol of {H2}?',o:['2','3','4','6'],a:2,w:'Ratio 3 : 2, so 6 × 2/3 = 4 mol.'},
        {q:'What is the correct order of steps?',o:['grams → grams','grams → moles → ratio → moles → grams','moles → grams → ratio','ratio → grams → moles'],a:1,w:'The mole ratio only works on moles.'}]},
 {id:'k4',title:'Limiting reagent and percent yield',sub:'What runs out, and how close you got',
  lede:'Reactions rarely start with perfect amounts. The <b>limiting reagent</b> runs out first and decides how much product you can make. The other one is <b>in excess</b>.',
  body:`<p>To find it, work out how much product each reactant could make on its own. The one that gives <b>less</b> product is limiting. That smaller amount is the <b>theoretical yield</b>.</p>
  <p>In a real lab you get less: some product sticks to glassware, some reactions don’t finish. <span class="f">Percent yield = actual ÷ theoretical × 100</span>.</p>`,
  analogy:'Making sandwiches with 10 slices of bread and 3 slices of cheese: you can only make 3 cheese sandwiches. Cheese is limiting; bread is in excess.',
  example:{q:'Theoretical yield is 36.0 g and you collected 30.6 g. What is the percent yield?',steps:['Percent yield = 30.6 ÷ 36.0 × 100','= <b>85.0%</b>']},
  quiz:[{q:'In {2H2 + O2 → 2H2O}, you have 4 mol {H2} and 1 mol {O2}. Which is limiting?',o:['{H2}','{O2}','neither'],a:1,w:'4 mol {H2} needs 2 mol {O2}, but only 1 mol is there. {O2} runs out first.'},
        {q:'Theoretical yield 50.0 g, actual 40.0 g. Percent yield?',o:['40%','80%','125%','90%'],a:1,w:'40.0 ÷ 50.0 × 100 = 80%.'}]}
]},
{id:'o',sym:'Ba',z:56,c:'#3E9B4F',name:'Organic Chemistry',flame:'barium · green',strand:'Strand C',
 blurb:'Hydrocarbons, isomers, functional groups, polarity, and organic chemistry in everyday life.',lessons:[
 R('b1'),
 R('b2'),
 R('b3'),
 {id:'o1',title:'Polarity and intermolecular forces',sub:'Why some things boil and dissolve easily',
  lede:'<b>Electronegativity</b> is how hard an atom pulls on shared electrons. When two bonded atoms pull unequally, the bond is <b>polar</b>, and that changes how molecules attract each other.',
  body:`<p>In an O–H bond, oxygen pulls harder, so it gets a small negative charge (δ−) and hydrogen a small positive charge (δ+). A C–H bond is nearly even, so hydrocarbons are <b>non-polar</b>.</p>
  <p>Forces <i>between</i> molecules are called <b>intermolecular forces</b>. Stronger forces mean a higher boiling point.</p>`,
  table:{head:['Force','Found in','Strength'],rows:[['London dispersion','all molecules; bigger molecules have more','weakest'],['Dipole–dipole','polar molecules','medium'],['Hydrogen bonding','molecules with O–H or N–H','strongest']]},
  points:['Ethanol ({C2H5OH}) boils at 78 °C, but ethane ({C2H6}) boils at −89 °C. The –OH group allows hydrogen bonding.','“Like dissolves like”: polar dissolves in polar (sugar in water); non-polar in non-polar (grease in gasoline).','That’s why oil and water don’t mix, and why soap (one polar end, one non-polar end) can wash grease away.','Longer hydrocarbon chains have higher boiling points: more surface for London forces.'],
  quiz:[{q:'Which has the highest boiling point?',o:['methane','ethane','ethanol','propane'],a:2,w:'Ethanol can hydrogen bond through its –OH group.'},
        {q:'Why doesn’t oil dissolve in water?',o:['Oil is too heavy','Oil is non-polar and water is polar','Water is non-polar','Oil is ionic'],a:1,w:'Like dissolves like.'}]},
 R('b5',{title:'Organic chemistry in society',sub:'Fuels, plastics and their impact',
  body:`<p><b>Addition polymers</b> form when alkene monomers open their double bonds and link up. Ethene becomes polyethylene (grocery bags). <b>Condensation polymers</b> like nylon and polyester join while releasing water.</p>
  <p>Organic compounds are everywhere in daily life: fuels (propane, gasoline), solvents (acetone in nail polish remover), flavours (esters), medicines (aspirin) and plastics.</p>
  <p>SCH4C asks you to weigh impacts. Plastics are cheap and durable, but that durability means they last for centuries in landfills and oceans. Burning fossil fuels releases {CO2}. Options include recycling, bioplastics, and using less.</p>`})
]},
{id:'v',sym:'Ca',z:20,c:'#DE6A1F',light:true,name:'Chemistry in the Environment',flame:'calcium · orange',strand:'Strand F',
 blurb:'Solutions, acids and bases, titration, fuels, and air and water quality.',lessons:[
 {id:'v1',title:'Solutions and solubility',sub:'What dissolves, and why',
  lede:'A <b>solution</b> is a mixture where one substance (the <b>solute</b>) is spread evenly through another (the <b>solvent</b>). Water dissolves so many things it’s called the universal solvent.',
  body:`<p>Ionic compounds dissolve when water molecules pull their ions apart. The ions then conduct electricity, so these are called <b>electrolytes</b>. Polar covalent compounds like sugar dissolve too, but as whole molecules, so they don’t conduct.</p>
  <p>Not every ionic compound dissolves. Use a solubility table to predict whether a <b>precipitate</b> (an insoluble solid) will form when two solutions are mixed.</p>`,
  table:{head:['Usually soluble','Exceptions'],rows:[['Group 1 ions, {NH4^+}, nitrates {NO3^-}','none'],['chlorides, bromides, iodides','with {Ag^+}, {Pb^2+}'],['sulfates {SO4^2-}','with {Ba^2+}, {Ca^2+}, {Pb^2+}'],['<b>Usually insoluble</b>: carbonates, phosphates, hydroxides','except with group 1 and {NH4^+}']]},
  points:['A saturated solution holds as much solute as it can at that temperature.','Most solids dissolve better in hot water; gases dissolve better in cold water. Warm lakes hold less oxygen, which stresses fish.'],
  quiz:[{q:'Which compound is insoluble in water?',o:['NaCl','{KNO3}','AgCl','{Na2SO4}'],a:2,w:'Chlorides are soluble except with {Ag^+} and {Pb^2+}.'},
        {q:'Why does salt water conduct electricity?',o:['It contains free ions','Water is a metal','Salt is covalent','It contains free electrons'],a:0,w:'Dissolved {Na^+} and {Cl^-} ions carry charge.'}]},
 R('f5',{title:'Concentration and dilution',sub:'mol/L, ppm and making solutions',
  body:`<p><b>Concentration</b> is how much solute is in a volume of solution. The main unit is mol/L: <span class="f">c = n / V</span>.</p>
  <p>For very dilute solutions, like pollutants in drinking water, chemists use <b>parts per million (ppm)</b>. 1 ppm is 1 mg of solute per litre of water. Health Canada sets limits in ppm, for example for lead and nitrates.</p>
  <p>To <b>dilute</b> a solution, add water. The moles of solute stay the same, so <span class="f">c<sub>1</sub>V<sub>1</sub> = c<sub>2</sub>V<sub>2</sub></span>.</p>`,
  points:['Convert mL to L by dividing by 1000.','Rearrange as needed: n = c × V.','Dilution example: 100 mL of 2.0 mol/L diluted to 400 mL gives 0.50 mol/L.'],
  quiz:[{q:'How many moles are in 2.0 L of a 0.50 mol/L solution?',o:['0.25 mol','1.0 mol','2.5 mol','4.0 mol'],a:1,w:'n = c × V = 0.50 × 2.0 = 1.0 mol.'},
        {q:'50 mL of 4.0 mol/L acid is diluted to 200 mL. New concentration?',o:['1.0 mol/L','2.0 mol/L','8.0 mol/L','16 mol/L'],a:0,w:'c₂ = c₁V₁ ÷ V₂ = 4.0 × 50 ÷ 200 = 1.0 mol/L.'}]}),
 R('f6'),
 {id:'v2',title:'Titration',sub:'Measuring an unknown concentration',
  lede:'A <b>titration</b> finds the concentration of an acid or base by slowly adding a solution of known concentration until they exactly neutralize each other.',
  body:`<p>Set-up: the known solution (the <b>titrant</b>) goes in a <b>burette</b>. A measured volume of the unknown goes in a flask with a few drops of <b>indicator</b>. Add titrant drop by drop and swirl until the indicator changes colour permanently. That is the <b>endpoint</b>.</p>
  <p>Then calculate: moles of titrant used → mole ratio from the balanced equation → moles of unknown → concentration of unknown.</p>`,
  example:{q:'25.0 mL of HCl is neutralized by 20.0 mL of 0.100 mol/L NaOH. Find [HCl]. ({HCl + NaOH → NaCl + H2O})',steps:['n(NaOH) = 0.100 × 0.0200 = 0.00200 mol.','Ratio 1 : 1, so n(HCl) = 0.00200 mol.','c(HCl) = 0.00200 ÷ 0.0250 = <b>0.0800 mol/L</b>']},
  points:['Phenolphthalein is colourless in acid and pink in base. It’s the most common indicator.','Do at least three trials and average the ones that agree within 0.1 mL.','Read the burette at the bottom of the curved meniscus, at eye level.'],
  quiz:[{q:'What is the piece of glassware used to add the titrant?',o:['beaker','burette','graduated cylinder','test tube'],a:1,w:'A burette delivers precise, measurable volumes drop by drop.'},
        {q:'10.0 mL of 0.20 mol/L NaOH neutralizes 20.0 mL of HCl. [HCl] is…',o:['0.050','0.10','0.20','0.40 mol/L'],a:1,w:'n = 0.0020 mol; c = 0.0020 ÷ 0.0200 = 0.10 mol/L.'}]},
 {id:'v3',title:'Crude oil and fuels',sub:'Fractional distillation',
  lede:'Crude oil is a thick mixture of thousands of hydrocarbons. <b>Fractional distillation</b> separates it into useful <b>fractions</b> by boiling point.',
  body:`<p>Crude oil is heated until most of it vaporizes, then fed into a tall column that is hot at the bottom and cool at the top. Small molecules (low boiling points) rise to the top before condensing. Large molecules condense near the bottom.</p>`,
  table:{head:['Fraction','Carbons','Use'],rows:[['refinery gas','1–4','propane, butane for heating'],['gasoline','5–10','car fuel'],['kerosene','10–16','jet fuel'],['diesel','14–20','trucks, trains'],['lubricating oil','20–50','motor oil, wax'],['residue (bitumen)','50+','asphalt roads']]},
  points:['<b>Cracking</b> breaks large, less useful molecules into smaller ones like gasoline.','Burning hydrocarbons releases energy, {CO2} and water. Too little oxygen makes toxic carbon monoxide (CO) and soot.','Alberta’s oil sands contain bitumen, which needs extra processing before refining.'],
  quiz:[{q:'Where in the column do the smallest molecules come out?',o:['bottom','middle','top'],a:2,w:'They have the lowest boiling points, so they rise farthest before condensing.'},
        {q:'Incomplete combustion produces which toxic gas?',o:['{CO2}','CO','{O2}','{H2}'],a:1,w:'Without enough oxygen, carbon only gets one O: carbon monoxide.'}]},
 {id:'v4',title:'Air and water quality',sub:'How chemistry affects the environment',
  lede:'Natural processes and human activity both change the chemistry of air and water. Knowing the reactions helps you understand the problems and the fixes.',
  table:{head:['Issue','Chemistry','Effects'],rows:[['Acid rain','{SO2} and {NOx} from burning fuel react with water to form {H2SO4} and {HNO3}','damages lakes, forests, buildings'],['Smog','{NOx} and hydrocarbons + sunlight → ground-level ozone ({O3})','breathing problems'],['Greenhouse effect','{CO2}, {CH4} and water vapour trap heat','climate change'],['Ozone depletion','CFCs break down {O3} in the upper atmosphere','more UV radiation'],['Heavy metals','mercury, lead dissolve in water and build up in food chains','nerve and organ damage'],['Excess nutrients','fertilizer nitrates and phosphates run into lakes','algae blooms, low oxygen']]},
  points:['Limestone ({CaCO3}) naturally neutralizes acid, so lakes on limestone resist acid rain better than lakes on the Canadian Shield.','Catalytic converters change CO and {NOx} into {CO2} and {N2}.','Water treatment: screening, coagulation, filtration, then chlorine to kill microbes.','Mercury from industry built up in fish near Grassy Narrows, Ontario, a well-known Canadian case.'],
  quiz:[{q:'Which gas is mainly responsible for acid rain from coal burning?',o:['{CO2}','{SO2}','{O2}','{CH4}'],a:1,w:'Sulfur dioxide reacts with water to form sulfuric acid.'},
        {q:'Why are lakes on limestone less affected by acid rain?',o:['Limestone is acidic','Limestone neutralizes acid','Limestone blocks rain','They are colder'],a:1,w:'Calcium carbonate reacts with and neutralizes acids.'}]}
]},
{id:'x',sym:'Cu',z:29,c:'#1B8FA3',name:'Electrochemistry',flame:'copper · blue-green',strand:'Strand D',
 blurb:'Oxidation numbers, redox reactions, batteries, corrosion and electroplating.',lessons:[
 R('x1'),
 {id:'x5',title:'Half-reactions and agents',sub:'Splitting a redox reaction in two',
  lede:'Every redox reaction can be split into two <b>half-reactions</b>: one that shows the loss of electrons and one that shows the gain.',
  body:`<p>Take {Zn + Cu^2+ → Zn^2+ + Cu}.</p>
  <p><b>Oxidation</b> (loses e⁻): {Zn → Zn^2+ + 2e^-}<br><b>Reduction</b> (gains e⁻): {Cu^2+ + 2e^- → Cu}</p>
  <p>The electrons cancel when you add them back together. The number lost must equal the number gained.</p>
  <p>The substance that gets <b>reduced</b> is the <b>oxidizing agent</b>, because it causes the other one to be oxidized. The substance that gets <b>oxidized</b> is the <b>reducing agent</b>.</p>`,
  points:['Remember OIL RIG: Oxidation Is Loss, Reduction Is Gain.','In an oxidation half-reaction, electrons appear on the right. In a reduction, on the left.','If one half loses 2 e⁻ and the other gains 1 e⁻, double the second half before adding.'],
  example:{q:'Identify the agents in {Mg + 2Ag^+ → Mg^2+ + 2Ag}.',steps:['Mg goes 0 → +2: oxidized, so Mg is the <b>reducing agent</b>.','{Ag^+} goes +1 → 0: reduced, so {Ag^+} is the <b>oxidizing agent</b>.','Halves: {Mg → Mg^2+ + 2e^-} and {Ag^+ + e^- → Ag} (× 2).']},
  quiz:[{q:'In {Cu^2+ + 2e^- → Cu}, copper is being…',o:['oxidized','reduced','neither'],a:1,w:'It gains electrons: reduction.'},
        {q:'The oxidizing agent is the substance that is…',o:['oxidized','reduced','a catalyst','unchanged'],a:1,w:'It takes electrons, so it gets reduced, causing the other to be oxidized.'}]},
 R('x3'),
 {id:'x6',title:'Batteries, corrosion and electroplating',sub:'Electrochemistry in real life',
  lede:'The redox ideas from this unit explain the batteries in your phone, the rust on a car and the gold layer on cheap jewellery.',
  body:`<p><b>Batteries</b> are galvanic cells packaged to be portable. Alkaline batteries use zinc and manganese dioxide. Lithium-ion batteries are rechargeable: charging runs the reaction backwards with outside power.</p>
  <p><b>Electrolysis</b> uses electricity to force a reaction that wouldn’t happen on its own. In <b>electroplating</b>, the object to coat is the cathode. Metal ions in the solution are reduced and form a thin layer on it, such as chrome on car parts or silver on cutlery.</p>
  <p><b>Corrosion</b> is unwanted oxidation. Iron rusts when it reacts with oxygen and water, and road salt speeds it up, which is why cars rust faster in Canadian winters.</p>`,
  points:['Prevent corrosion with paint, oil or plastic coatings that keep water and oxygen out.','<b>Galvanizing</b> coats iron with zinc.','A <b>sacrificial anode</b> is a more reactive metal (like magnesium or zinc) attached to iron. It corrodes instead, protecting ship hulls and pipelines.','Fuel cells combine hydrogen and oxygen to make electricity, with only water as a by-product.'],
  quiz:[{q:'In electroplating, the object being coated is the…',o:['anode','cathode','salt bridge','electrolyte'],a:1,w:'Reduction happens at the cathode, where metal ions become solid metal.'},
        {q:'Why does zinc protect iron from rusting?',o:['It is less reactive','It is more easily oxidized, so it corrodes first','It is a catalyst','It blocks light'],a:1,w:'Zinc is above iron in the activity series, so it gives up electrons first.'},
        {q:'Why do cars rust faster in Canadian winters?',o:['Cold speeds up rusting','Road salt helps electrons move','Snow is acidic','Less oxygen'],a:1,w:'Salt water is an electrolyte, which speeds up the redox reaction.'}]}
]}
];
/* ===== Chemistry from Zero: teach one idea, check it right away ===== */
const B=(say,html,q,o,a,w)=>({say,html,q:{q,o,a,w}});
const ZERO={id:'z',sym:'Cs',z:55,c:'#5B5BD6',name:'Chemistry from Zero',flame:'caesium · blue-violet',strand:'Absolute basics',
 blurb:'No experience needed. Tiny lessons that teach one idea at a time, then check it.',lessons:[
 {id:'z1',title:'What is chemistry?',sub:'Matter and what it’s made of',bites:[
  B('Let’s start at the very beginning.','<p><b>Chemistry</b> is the science of <b>matter</b>: what stuff is made of, and how it changes.</p><p>Matter is anything that has mass and takes up space. Your phone, water, air and you are all matter.</p>',
    'Which of these is matter?',['Air','A thought','A song’s melody'],0,'Air has mass and takes up space, even though you can’t see it. Thoughts and melodies aren’t stuff.'),
  B('Two words you’ll see a lot.','<p><b>Mass</b> is how much stuff something contains. We measure it in grams (g).</p><p><b>Volume</b> is how much space it takes up. We measure it in millilitres (mL) or litres (L).</p>',
    'Which unit measures mass?',['Litres','Grams','Degrees'],1,'Grams measure mass. Litres measure volume.'),
  B('Chemistry happens everywhere.','<p>Cooking an egg, rust on a bike, a battery powering your phone and fireworks exploding are all chemistry: substances changing into new substances.</p>',
    'Which of these is an example of chemistry?',['A bike rusting','Throwing a ball','Folding paper'],0,'Rusting turns iron into a new substance. Throwing or folding doesn’t change what something is made of.')]},
 {id:'z2',title:'Solids, liquids and gases',sub:'The three states of matter',bites:[
  B('Everything is made of tiny particles.','<p>Matter is made of particles far too small to see. How tightly they’re packed decides the <b>state</b>.</p><p><b>Solid</b>: particles packed tight, only vibrating. Keeps its shape.<br><b>Liquid</b>: particles close but sliding past each other. Takes the shape of its container.<br><b>Gas</b>: particles far apart, zooming around. Fills any space.</p>',
    'In which state are particles farthest apart?',['Solid','Liquid','Gas'],2,'Gas particles are spread far apart and move freely.'),
  B('States can change.','<p>Heat a solid and it <b>melts</b> into a liquid. Heat a liquid and it <b>boils</b> (or evaporates) into a gas.</p><p>Cool a gas and it <b>condenses</b> into a liquid. Cool a liquid and it <b>freezes</b> into a solid.</p>',
    'Water vapour turning into droplets on a cold window is called…',['melting','condensing','freezing'],1,'Gas turning into liquid is condensation.'),
  B('Same stuff, different state.','<p>Ice, liquid water and steam are all the same substance, {H2O}. Changing state doesn’t make a new substance; it just moves the particles closer or farther apart.</p>',
    'When ice melts, is a new substance made?',['Yes','No'],1,'It’s still {H2O}. Only the state changed.')]},
 {id:'z3',title:'Elements and atoms',sub:'The building blocks',bites:[
  B('Here’s the big idea of chemistry.','<p>All matter is built from tiny pieces called <b>atoms</b>. An atom is so small that a single grain of sand contains more atoms than there are grains of sand on every beach on Earth.</p>',
    'What is all matter built from?',['Cells','Atoms','Light'],1,'Everything is made of atoms.'),
  B('There are different kinds of atoms.','<p>An <b>element</b> is a substance made of only one kind of atom. Gold is made only of gold atoms. Oxygen is made only of oxygen atoms.</p><p>There are 118 known elements, but only about 30 come up often.</p>',
    'A substance made of only one kind of atom is called…',['an element','a mixture','a liquid'],0,'One kind of atom = an element.'),
  B('Elements combine to make everything else.','<p>Just as 26 letters make every word in English, around 90 natural elements combine to make every substance in the universe. Water is hydrogen + oxygen. Table salt is sodium + chlorine.</p>',
    'Water is made from which two elements?',['Carbon and oxygen','Hydrogen and oxygen','Sodium and chlorine'],1,'Water, {H2O}, is hydrogen and oxygen.')]},
 {id:'z4',title:'Element symbols',sub:'Chemistry’s short forms',bites:[
  B('Every element has a symbol.','<p>Instead of writing “oxygen” every time, chemists write <b>O</b>. Hydrogen is <b>H</b>, carbon is <b>C</b>, nitrogen is <b>N</b>.</p>',
    'What is the symbol for carbon?',['Ca','C','Cb'],1,'Carbon is C. (Ca is calcium.)'),
  B('Here’s the rule for writing them.','<p>A symbol is one or two letters. The first is <b>always a capital</b>; the second is <b>always lowercase</b>.</p><p>So <b>Co</b> is cobalt (one element), but <b>CO</b> is carbon + oxygen (carbon monoxide).</p>',
    'Which is written correctly for chlorine?',['CL','Cl','cl'],1,'First letter capital, second lowercase: Cl.'),
  B('Some symbols come from Latin.','<p>A few symbols don’t match the English name, because they come from Latin:</p><p><b>Na</b> = sodium (natrium) · <b>K</b> = potassium (kalium) · <b>Fe</b> = iron (ferrum) · <b>Cu</b> = copper (cuprum) · <b>Ag</b> = silver (argentum) · <b>Au</b> = gold (aurum) · <b>Pb</b> = lead (plumbum)</p>',
    'What is the symbol for sodium?',['So','S','Na'],2,'Sodium is Na, from its Latin name natrium.'),
  B('Quick check on the Latin ones.','<p>Remember: <b>Fe</b> is iron, like in “ferrous metals”. <b>Au</b> is gold, from aurum.</p>',
    'What element is Fe?',['Fluorine','Iron','Lead'],1,'Fe comes from ferrum, Latin for iron.')]},
 {id:'z5',title:'Inside an atom',sub:'Protons, neutrons and electrons',bites:[
  B('Atoms have even smaller parts.','<p>Every atom has three kinds of particles:</p><p><b>Protons</b>: positive charge (+)<br><b>Neutrons</b>: no charge (0)<br><b>Electrons</b>: negative charge (−)</p>',
    'Which particle has a negative charge?',['Proton','Neutron','Electron'],2,'Electrons are negative.'),
  B('Here’s where they live.','<p>Protons and neutrons are packed together in the centre, called the <b>nucleus</b>. Electrons move around the outside in a cloud.</p><p>The nucleus holds almost all the mass; electrons are tiny and light.</p>',
    'Where are protons found?',['In the nucleus','Orbiting outside','Between atoms'],0,'Protons and neutrons sit in the nucleus at the centre.'),
  B('Atoms are usually neutral.','<p>A normal atom has the <b>same number of protons and electrons</b>, so the + and − charges cancel out. Overall, it has no charge.</p>',
    'An atom has 6 protons. How many electrons does a neutral atom have?',['3','6','12'],1,'Neutral means protons = electrons, so 6.')]},
 {id:'z6',title:'Reading the periodic table',sub:'What the numbers in each box mean',bites:[
  B('Each element gets a box.','<p>Every box on the periodic table shows a symbol, a name, and two important numbers. For carbon: <b>atomic number 6</b> and <b>atomic mass 12.01</b>.</p>',
    'What two numbers are in each element’s box?',['Atomic number and atomic mass','Temperature and colour','Price and weight'],0,'Each box shows the atomic number and atomic mass.'),
  B('The atomic number is the element’s ID.','<p>The <b>atomic number</b> is the number of protons. It decides which element an atom is. Every atom with 6 protons is carbon. With 8 protons, it’s oxygen.</p>',
    'Oxygen’s atomic number is 8. How many protons does oxygen have?',['16','8','4'],1,'Atomic number = number of protons.'),
  B('The atomic mass is the weight.','<p>The <b>atomic mass</b> is how heavy one atom is, roughly protons + neutrons. Carbon’s is about 12, because it has 6 protons and 6 neutrons.</p><p>You’ll use atomic masses a lot in calculations later.</p>',
    'Carbon has 6 protons and 6 neutrons. Its atomic mass is about…',['6','12','18'],1,'Protons + neutrons ≈ 6 + 6 = 12.')]},
 {id:'z7',title:'The layout of the table',sub:'Rows, columns, metals and non-metals',bites:[
  B('The table has rows and columns.','<p>Rows across are called <b>periods</b>. Columns down are called <b>groups</b>. There are 7 periods and 18 groups.</p>',
    'A column on the periodic table is called a…',['period','group','row'],1,'Columns are groups; rows are periods.'),
  B('Groups are families.','<p>Elements in the same group behave alike. Group 1 (lithium, sodium, potassium) are soft metals that react with water. Group 18 (helium, neon, argon) are the <b>noble gases</b>, which barely react with anything.</p>',
    'Which group barely reacts with anything?',['Group 1','Group 17','Group 18, the noble gases'],2,'Noble gases are very unreactive.'),
  B('Metals on the left, non-metals on the right.','<p><b>Metals</b> fill the left and middle: shiny, conduct electricity, bendable (iron, copper, sodium).</p><p><b>Non-metals</b> are on the upper right: often gases or brittle solids (oxygen, nitrogen, sulfur). A staircase line separates them.</p>',
    'Is oxygen a metal or a non-metal?',['Metal','Non-metal'],1,'Oxygen is on the upper right: a non-metal.')]},
 {id:'z8',title:'Electron shells',sub:'Why elements react',bites:[
  B('Electrons live in layers.','<p>Electrons sit in layers around the nucleus called <b>shells</b>. The first shell holds up to <b>2</b>, the second up to <b>8</b>, and the third up to <b>8</b> (for the elements you’ll use).</p>',
    'How many electrons fit in the first shell?',['2','8','18'],0,'The first shell holds 2.'),
  B('Let’s fill some shells.','<p>Sodium has 11 electrons: 2 in the first shell, 8 in the second, and <b>1</b> in the third. We write that as 2, 8, 1.</p>',
    'Oxygen has 8 electrons. How are they arranged?',['2, 6','8','4, 4'],0,'First shell 2, then the remaining 6 go in the second shell.'),
  B('The outer shell is what matters.','<p>Electrons in the outermost shell are called <b>valence electrons</b>. Atoms are most stable with a full outer shell (usually 8), and they react to get there.</p><p>Handy shortcut: for groups 1–2, valence electrons = group number. For groups 13–18, subtract 10.</p>',
    'Chlorine is in group 17. How many valence electrons does it have?',['1','7','17'],1,'17 − 10 = 7 valence electrons.')]},
 {id:'z9',title:'Ions',sub:'Atoms with a charge',bites:[
  B('Atoms can gain or lose electrons.','<p>When an atom gains or loses electrons, it gets a charge. A charged atom is called an <b>ion</b>.</p><p>Lose electrons → more protons than electrons → <b>positive</b>.<br>Gain electrons → more electrons than protons → <b>negative</b>.</p>',
    'An atom loses an electron. What charge does it get?',['Positive','Negative','None'],0,'Losing a negative electron leaves it positive.'),
  B('Metals lose, non-metals gain.','<p>Sodium has 1 valence electron. It’s easier to lose 1 than gain 7, so it becomes {Na^+}.</p><p>Chlorine has 7. It’s easier to gain 1, so it becomes {Cl^-}.</p>',
    'What ion does chlorine usually form?',['{Cl^+}','{Cl^-}','{Cl^2+}'],1,'Chlorine gains 1 electron to fill its shell: {Cl^-}.'),
  B('How to read an ion.','<p>The little number and sign tell you the charge. {Mg^2+} lost 2 electrons. {O^2-} gained 2 electrons. A sign with no number means 1.</p>',
    'How many electrons did {Mg^2+} lose?',['1','2','12'],1,'2+ means it lost 2 electrons.')]},
 {id:'z10',title:'Molecules and compounds',sub:'When atoms join up',bites:[
  B('Atoms can bond together.','<p>When two or more atoms join together, they form a <b>molecule</b>. Oxygen gas in the air is {O2}: two oxygen atoms bonded together.</p>',
    'What do you call two or more atoms bonded together?',['An ion','A molecule','An element box'],1,'Bonded atoms form a molecule.'),
  B('Compounds mix different elements.','<p>A <b>compound</b> is made of two or more <i>different</i> elements bonded together. Water ({H2O}) and carbon dioxide ({CO2}) are compounds. {O2} is not, because it’s only oxygen.</p>',
    'Which is a compound?',['{O2}','{CO2}','{N2}'],1,'{CO2} has two different elements: carbon and oxygen.'),
  B('Compounds are new substances.','<p>A compound can be totally different from its elements. Sodium is a metal that explodes in water and chlorine is a poisonous gas, but together they make table salt.</p><p>A <b>mixture</b> is different: things just mixed, not bonded, like salt stirred into water.</p>',
    'Salt stirred into water is a…',['compound','mixture','element'],1,'The salt and water aren’t bonded together, so it’s a mixture.')]},
 {id:'z11',title:'Reading formulas',sub:'What the little numbers mean',bites:[
  B('A formula is a recipe for a molecule.','<p>A <b>chemical formula</b> shows which atoms are in a substance and how many. In {H2O}, the small <b>2</b> means 2 hydrogen atoms. No number means 1, so there’s 1 oxygen.</p>',
    'How many hydrogen atoms are in {H2O}?',['1','2','3'],1,'The subscript 2 after H means 2 hydrogen atoms.'),
  B('Let’s count a bigger one.','<p>{CO2}: 1 carbon, 2 oxygen.<br>{CH4} (methane): 1 carbon, 4 hydrogen.<br>{C6H12O6} (glucose): 6 carbon, 12 hydrogen, 6 oxygen.</p>',
    'How many hydrogen atoms are in {CH4}?',['1','4','5'],1,'The 4 after H means 4 hydrogen atoms.'),
  B('Brackets multiply everything inside.','<p>In {Ca(OH)2}, the 2 outside the brackets doubles everything inside. So there’s 1 Ca, 2 O and 2 H.</p>',
    'How many oxygen atoms are in {Ca(OH)2}?',['1','2','4'],1,'The 2 outside the brackets doubles the one O inside.'),
  B('A big number in front means copies.','<p>A big number <b>in front</b> is a <b>coefficient</b>: how many whole molecules. {2H2O} means two water molecules, so 4 H and 2 O in total.</p>',
    'How many water molecules is {3H2O}?',['2','3','6'],1,'The 3 in front means 3 molecules.')]},
 {id:'z12',title:'Physical vs chemical changes',sub:'How to tell a reaction happened',bites:[
  B('Two kinds of change.','<p>A <b>physical change</b> changes how something looks but not what it is: melting, cutting, dissolving.</p><p>A <b>chemical change</b> (a <b>reaction</b>) makes a brand-new substance: burning, rusting, baking.</p>',
    'Burning paper is a…',['physical change','chemical change'],1,'Burning makes new substances (ash, smoke, {CO2}).'),
  B('Here are the clues.','<p>Signs a chemical reaction happened:</p><p>• bubbles of gas form<br>• the colour changes<br>• a solid appears in a liquid (a <b>precipitate</b>)<br>• heat or light is given off<br>• a new smell</p>',
    'Mixing two clear liquids makes a cloudy solid appear. What is that solid called?',['a precipitate','a molecule','a vapour'],0,'A solid forming in a liquid is a precipitate, a sign of a reaction.'),
  B('One more check.','<p>Remember: if it’s still the same substance, it’s physical. If something new formed, it’s chemical.</p>',
    'Ice melting is a…',['physical change','chemical change'],0,'Melted ice is still water. Nothing new formed.')]},
 {id:'z13',title:'Chemical equations',sub:'Writing down a reaction',bites:[
  B('Reactions are written as equations.','<p>A <b>chemical equation</b> shows a reaction. The starting substances, the <b>reactants</b>, go on the left. The new substances, the <b>products</b>, go on the right. The arrow means “turns into”.</p><p>{C + O2 → CO2}</p>',
    'In {C + O2 → CO2}, what is the product?',['C','{O2}','{CO2}'],2,'Products are on the right of the arrow.'),
  B('Atoms are never lost.','<p>In a reaction, atoms just rearrange. None are created or destroyed. This is the <b>law of conservation of mass</b>: the total mass before equals the total mass after.</p>',
    '10 g of reactants react completely. What mass of products forms?',['less than 10 g','10 g','more than 10 g'],1,'Mass is conserved: 10 g in, 10 g out.'),
  B('So equations must balance.','<p>Both sides need the same number of each atom. {H2 + O2 → H2O} has 2 O on the left but 1 on the right, so it’s unbalanced. Adding coefficients fixes it: {2H2 + O2 → 2H2O}.</p><p>You’ll practise this properly in Unit 1.</p>',
    'Why do we add coefficients to equations?',['To make them look neat','So both sides have the same atoms','To speed up the reaction'],1,'Atoms can’t appear or vanish, so both sides must match.')]},
 {id:'z14',title:'Measurements and big numbers',sub:'Units and scientific notation',bites:[
  B('Chemists use metric units.','<p>Mass in <b>grams (g)</b>. Volume in <b>millilitres (mL)</b> or <b>litres (L)</b>, where 1000 mL = 1 L. Temperature in <b>degrees Celsius (°C)</b>.</p>',
    'How many millilitres are in 1 L?',['10','100','1000'],2,'1 L = 1000 mL.'),
  B('Converting is just multiplying or dividing.','<p>mL → L: divide by 1000. So 250 mL = 0.250 L.<br>L → mL: multiply by 1000. So 2 L = 2000 mL.</p>',
    'What is 500 mL in litres?',['0.5 L','5 L','50 L'],0,'500 ÷ 1000 = 0.5 L.'),
  B('Scientific notation shortens huge numbers.','<p>Atoms are so small that chemists count them in huge numbers. Instead of 602 000 000 000 000 000 000 000, we write <b>6.02 × 10<sup>23</sup></b>. The power of 10 tells you how many places to move the decimal.</p><p>10<sup>3</sup> = 1000, so 5 × 10<sup>3</sup> = 5000.</p>',
    'What is 3 × 10<sup>2</sup>?',['30','300','3000'],1,'10² = 100, so 3 × 100 = 300.'),
  B('Negative powers mean small numbers.','<p>A negative power moves the decimal left. 10<sup>−2</sup> = 0.01, so 4 × 10<sup>−2</sup> = 0.04. You’ll see these in pH and concentration.</p>',
    'What is 10<sup>−1</sup>?',['10','0.1','−10'],1,'A negative power means a small number: 10⁻¹ = 0.1.')]},
 {id:'z15',title:'Lab equipment and safety',sub:'The tools you’ll use',bites:[
  B('Meet the glassware.','<p><b>Beaker</b>: a wide cup for holding and mixing.<br><b>Erlenmeyer flask</b>: cone-shaped, so it swirls without spilling.<br><b>Graduated cylinder</b>: tall and thin, for measuring volume.<br><b>Burette</b>: a long tube with a tap, for adding liquid drop by drop.</p>',
    'Which tool measures volume most accurately?',['Beaker','Graduated cylinder','Test tube'],1,'Beakers only give rough volumes; graduated cylinders are made for measuring.'),
  B('Reading a measurement.','<p>Liquids curve in a tube. That curve is called the <b>meniscus</b>. Always read the bottom of the curve, with your eye at the same level.</p>',
    'Where do you read the volume in a graduated cylinder?',['Top of the curve','Bottom of the curve','Anywhere'],1,'Read at the bottom of the meniscus, at eye level.'),
  B('Stay safe.','<p>Wear goggles. Tie back long hair. Never taste or directly smell chemicals: waft the smell toward you with your hand. In Canada, chemical labels use <b>WHMIS</b> symbols to show hazards like flammable, corrosive or toxic.</p>',
    'How should you smell a chemical in the lab?',['Sniff it directly','Waft it toward you','Never check smells at all'],1,'Wafting keeps you from breathing in a strong dose.')]}
]};
ZERO.lessons.forEach(l=>{l.quiz=l.bites.map(b=>b.q);l.lede=l.sub});

const UNIT_R = {name:'Grade 10 Review', lessons:[
 {id:'f1', title:'Atoms and the periodic table', sub:'A quick recap of the basics', bites:[
  B('Quick warm-up first.',
   '<p>An atom has a tiny <b>nucleus</b> of protons (+) and neutrons (no charge), with electrons (−) around it in shells.</p><p>The <b>atomic number</b> is the number of protons. It decides which element the atom is.</p>',
   'What decides which element an atom is?', ['Its number of neutrons','Its number of protons','Its number of shells'], 1,
   'The atomic number, the number of protons, sets the element. Change the protons and you have a different element.'),
  B('Columns are families.',
   '<p>A column on the periodic table is a <b>group</b>. Elements in the same group have the same number of <b>valence electrons</b> (outer-shell electrons), so they behave alike.</p><p>Group 1 atoms have 1 valence electron. Group 17 atoms have 7.</p>',
   'Why do sodium and potassium behave alike?', ['They have the same mass','They are in the same row','They have the same number of valence electrons'], 2,
   'Both are in group 1, so each has 1 valence electron. Same outer electrons, similar behaviour.'),
  B('Left side, right side.',
   '<p><b>Metals</b> sit on the left and middle of the table. <b>Non-metals</b> sit on the upper right. The staircase line between them separates the two.</p><p>Metals tend to <b>lose</b> electrons. Non-metals tend to <b>gain</b> them.</p>',
   'Chlorine is on the upper right. What does it tend to do with electrons?', ['Gain them','Lose them','Ignore them'], 0,
   'Chlorine is a non-metal, and non-metals tend to gain electrons.'),
  B('Here’s the charge pattern.',
   '<p>Atoms gain or lose electrons to get a full outer shell like a noble gas. The group tells you the usual ion charge:</p><ul><li>Group 1: 1+, group 2: 2+, group 13: 3+</li><li>Group 15: 3−, group 16: 2−, group 17: 1−</li><li>Group 18: no ion</li></ul>',
   'What ion does magnesium (group 2) usually form?', ['{Mg^-}','{Mg^2-}','{Mg^2+}'], 2,
   'Group 2 metals lose 2 electrons, giving a 2+ charge: {Mg^2+}.')
 ]},
 {id:'f2', title:'Ionic and covalent bonding', sub:'Giving electrons vs sharing them', bites:[
  B('Two ways atoms stick together.',
   '<p>Atoms bond to get full outer shells. There are two main ways.</p><p>An <b>ionic bond</b> forms when a metal <b>gives</b> electrons to a non-metal. The ions that form have opposite charges and attract.</p>',
   'In an ionic bond, what happens to electrons?', ['They are shared equally','They are transferred from metal to non-metal','They are destroyed'], 1,
   'Ionic bonding is a transfer: the metal gives electrons to the non-metal, making + and − ions that attract.'),
  B('Watch me do one.',
   '<p>Sodium has 1 valence electron. Chlorine has 7. Sodium hands its electron to chlorine.</p><p>Now sodium is {Na^+} and chlorine is {Cl^-}. Both have full outer shells, and the opposite charges hold them together as {NaCl}.</p>',
   'After the transfer, what charge does chlorine have?', ['1−','1+','0'], 0,
   'Chlorine gained one electron, so it has one extra negative charge: {Cl^-}.'),
  B('Now the sharing kind.',
   '<p>A <b>covalent bond</b> forms when two <b>non-metals share</b> a pair of electrons. Neither atom wants to give electrons away, so they share.</p><p>Covalent bonds make <b>molecules</b>, like {H2O} and {CO2}.</p>',
   'Which pair of elements would form a covalent bond?', ['Sodium and oxygen','Calcium and chlorine','Carbon and oxygen'], 2,
   'Carbon and oxygen are both non-metals, so they share electrons. The other pairs are metal + non-metal (ionic).'),
  B('Your turn!',
   '<p>The quick rule:</p><ul><li>Metal + non-metal → <b>ionic</b></li><li>Non-metal + non-metal → <b>covalent</b></li></ul>',
   'What kind of bonding is in {MgO}?', ['Covalent','Ionic'], 1,
   'Magnesium is a metal and oxygen is a non-metal, so {MgO} is ionic.')
 ]},
 {id:'r20', title:'Lewis dot diagrams', sub:'Drawing valence electrons as dots', bites:[
  B('Let’s draw electrons as dots.',
   '<p>A <b>Lewis dot diagram</b> shows an element’s symbol with its <b>valence electrons</b> as dots around it. Inner electrons are left out.</p><p>Place dots one per side (top, right, bottom, left) before pairing any up.</p>',
   'Which electrons appear in a Lewis dot diagram?', ['All electrons','Only valence electrons','Only protons'], 1,
   'Lewis diagrams show only the outer (valence) electrons, because those are the ones used in bonding.'),
  B('Count from the group.',
   '<p>For main groups, the number of dots comes from the group. Group 1 gets 1 dot, group 2 gets 2, then groups 13 to 18 get 3 to 8.</p><p>Oxygen is in group 16, so it gets 6 dots: two single dots and two pairs.</p>',
   'How many dots go around nitrogen (group 15)?', ['3','5','7'], 1,
   'Group 15 elements have 5 valence electrons, so nitrogen gets 5 dots.'),
  B('Here’s water.',
   '<p>In {H2O}, oxygen sits in the middle. It shares one pair of electrons with each hydrogen. Each shared pair is a <b>single bond</b>, drawn as a line.</p><p>Oxygen also keeps <b>two lone pairs</b> (unshared pairs). That gives oxygen 8 electrons around it.</p>',
   'How many lone pairs does oxygen have in water?', ['None','One','Two'], 2,
   'Oxygen shares two pairs (one with each H) and keeps two lone pairs, for 8 electrons total.'),
  B('Now carbon dioxide.',
   '<p>In {CO2}, carbon is in the middle. It shares <b>two pairs</b> with each oxygen. Two shared pairs is a <b>double bond</b>, drawn as two lines: O=C=O.</p><p>Each oxygen also has two lone pairs. Carbon has no lone pairs.</p>',
   'What kind of bond joins carbon to each oxygen in {CO2}?', ['A double bond','A single bond','An ionic bond'], 0,
   'Carbon shares two pairs of electrons with each oxygen. Two shared pairs is a double bond.')
 ]},
 {id:'r21', title:'Bonding and properties', sub:'Why salt and sugar act so differently', bites:[
  B('Bond type shows up in real life.',
   '<p>Ionic compounds are huge grids of + and − ions locked together. Those strong attractions take a lot of heat to break.</p><p>So ionic compounds have <b>high melting points</b>. Table salt melts at about 801 °C.</p>',
   'Why does table salt have a high melting point?', ['Its ions attract strongly','It has no bonds','It is a gas at room temperature'], 0,
   'The + and − ions hold each other tightly, so a lot of heat is needed to pull them apart.'),
  B('Molecules are different.',
   '<p>In molecular (covalent) compounds, the bonds inside each molecule are strong. But the molecules barely stick to each other.</p><p>So molecular compounds usually have <b>low melting points</b>. Many are liquids or gases at room temperature, like water and {CO2}.</p>',
   'Which is most likely to have a low melting point?', ['{KCl}','{CaO}','{CH4}'], 2,
   '{CH4} is made of non-metals only, so it is molecular. {KCl} and {CaO} are ionic and melt at high temperatures.'),
  B('Who conducts electricity?',
   '<p>To conduct electricity, charged particles must be free to move.</p><p>Solid ionic compounds <b>don’t</b> conduct, because the ions are locked in place. Melted or dissolved in water, they <b>do</b>, because the ions can move. Molecular compounds have no ions, so they don’t conduct.</p>',
   'When does salt conduct electricity?', ['As a dry solid','Dissolved in water','Never'], 1,
   'Dissolved in water, the {Na^+} and {Cl^-} ions are free to move and carry charge.'),
  B('One more test: dissolving.',
   '<p>Many ionic compounds <b>dissolve in water</b>, which pulls the ions apart. Some molecular compounds dissolve too (like sugar), but their solutions don’t conduct.</p><p>This is a handy lab test: dissolve it, then check if it conducts.</p>',
   'A white solid dissolves and the solution conducts. It’s probably…', ['molecular','ionic'], 1,
   'A conducting solution means ions are present, so the solid is most likely ionic.')
 ]}
]};

const UNIT_M = {name:'Matter and Qualitative Analysis', lessons:[
 {id:'m1', title:'Atomic radius', sub:'Why some atoms are bigger', bites:[
  B('Let’s look at atom size.',
   '<p><b>Atomic radius</b> is the size of an atom, from the nucleus to the outer electrons.</p><p>Going <b>down a group</b>, each row adds a new electron shell. More shells means a bigger atom.</p>',
   'Which is bigger, lithium or potassium?', ['Lithium','Potassium','They are the same'], 1,
   'Potassium is lower in group 1, so it has more shells and a bigger radius.'),
  B('Across a row is the surprise.',
   '<p>Going <b>across a period</b> (left to right), atoms get <b>smaller</b>.</p><p>Each step adds one proton, but no new shell. The extra positive charge pulls the same shells in tighter.</p>',
   'Why does size shrink across a period?', ['More shells are added','More protons pull the electrons closer','Electrons are lost'], 1,
   'Each element has one more proton but the same number of shells, so the pull is stronger and the atom shrinks.'),
  B('Here’s the trick to remember it.',
   '<p>Biggest atoms are at the <b>bottom left</b>. Smallest are at the <b>top right</b>.</p><p>Think of the outer electrons as a dog on a leash. More shells is a longer leash. More protons is a stronger owner pulling in.</p>',
   'Where are the biggest atoms?', ['Top right','Bottom left','Top left'], 1,
   'Size grows going down and going left, so the biggest atoms are bottom left.'),
  B('Your turn!',
   '<p>Use both rules. Sodium and chlorine are in the same row (period 3). Sodium is on the left, chlorine on the right.</p>',
   'Which atom is smaller, sodium or chlorine?', ['Sodium','Chlorine'], 1,
   'Chlorine is farther right in the same row, so its extra protons pull its electrons in tighter.')
 ]},
 {id:'m20', title:'Ionization energy', sub:'How hard it is to pull an electron off', bites:[
  B('New term coming up.',
   '<p><b>Ionization energy</b> is the energy needed to remove one electron from an atom.</p><p>High ionization energy means the atom holds its electrons tightly. Low means an electron comes off easily.</p>',
   'An atom with low ionization energy…', ['loses an electron easily','never loses electrons','has no electrons'], 0,
   'Low ionization energy means little energy is needed, so an electron comes off easily.'),
  B('Down a group, it drops.',
   '<p>Going <b>down a group</b>, the outer electron is farther from the nucleus, so it’s held more weakly.</p><p>So ionization energy <b>decreases</b> going down.</p>',
   'Which has the lower ionization energy, sodium or caesium?', ['Sodium','Caesium'], 1,
   'Caesium is much lower in group 1. Its outer electron is far away and easy to remove.'),
  B('Across a row, it rises.',
   '<p>Going <b>across a period</b>, atoms get smaller and the nucleus pulls harder. So ionization energy <b>increases</b>.</p><p>Noble gases at the far right have the highest values in each row. That’s why they don’t form ions.</p>',
   'Which has the highest ionization energy in period 3?', ['Sodium','Silicon','Argon'], 2,
   'Ionization energy rises across a period, and argon is the noble gas at the right end.'),
  B('This explains metals.',
   '<p>Metals on the left have <b>low</b> ionization energies. That’s why they lose electrons and form positive ions so easily.</p>',
   'Why does potassium form {K^+} so easily?', ['It has high ionization energy','It has low ionization energy','It gains electrons'], 1,
   'Potassium’s single outer electron takes little energy to remove, so it readily becomes {K^+}.')
 ]},
 {id:'m21', title:'Electronegativity', sub:'Who pulls shared electrons harder', bites:[
  B('Here’s a tug-of-war idea.',
   '<p><b>Electronegativity</b> is how strongly an atom pulls on electrons it shares in a bond.</p><p>When two atoms share electrons, the more electronegative one pulls them closer to itself.</p>',
   'Electronegativity measures…', ['an atom’s size','how hard an atom pulls on shared electrons','how many protons an atom has'], 1,
   'It’s the pull an atom has on shared electrons in a bond.'),
  B('Same pattern as ionization energy.',
   '<p>Electronegativity <b>increases across</b> a period and <b>decreases down</b> a group.</p><p>Small atoms with lots of protons pull hardest. <b>Fluorine</b>, at the top right, is the most electronegative element.</p>',
   'Which element is the most electronegative?', ['Caesium','Oxygen','Fluorine'], 2,
   'Fluorine is the champion. It is small and near the top right of the table.'),
  B('Your turn!',
   '<p>Remember: up and to the right means higher electronegativity. Noble gases are usually left out because they rarely bond.</p>',
   'Which is more electronegative, chlorine or iodine?', ['Chlorine','Iodine'], 0,
   'Chlorine is higher in group 17, so it pulls shared electrons harder than iodine.'),
  B('Why it matters.',
   '<p>In water, oxygen is more electronegative than hydrogen. The shared electrons sit closer to oxygen, so the oxygen end is slightly negative and the hydrogen ends are slightly positive.</p>',
   'In {H2O}, which end is slightly negative?', ['The oxygen end','The hydrogen ends','Neither'], 0,
   'Oxygen pulls the shared electrons closer, so its end of the molecule carries a slight negative charge.')
 ]},
 {id:'m22', title:'Reactivity trends', sub:'Which elements react most', bites:[
  B('Metals first.',
   '<p>Metals react by <b>losing</b> electrons. The easier that is, the more reactive the metal.</p><p>So metal reactivity <b>increases going down</b> a group. Lithium fizzes in water. Potassium bursts into flame.</p>',
   'Which group 1 metal is most reactive?', ['Lithium','Sodium','Potassium'], 2,
   'Potassium is lowest of these, so its outer electron is easiest to lose.'),
  B('Non-metals flip it.',
   '<p>Non-metals react by <b>gaining</b> electrons. Small atoms with a strong pull do this best.</p><p>So non-metal reactivity <b>increases going up</b> a group. In group 17, fluorine is more reactive than chlorine, which beats bromine.</p>',
   'Which halogen is most reactive?', ['Iodine','Bromine','Fluorine'], 2,
   'Non-metal reactivity rises going up, and fluorine is at the top of group 17.'),
  B('Put it on the map.',
   '<p>The most reactive <b>metals</b> are at the <b>bottom left</b>. The most reactive <b>non-metals</b> are at the <b>top right</b> (not counting noble gases, which barely react).</p>',
   'Where are the most reactive metals?', ['Bottom left','Top right','Middle'], 0,
   'Metals get more reactive going down and to the left.'),
  B('Try one.',
   '<p>Magnesium (group 2) and calcium (group 2) are in the same group. Calcium is one row lower.</p>',
   'Which reacts more strongly with water?', ['Magnesium','Calcium'], 1,
   'For metals, lower in the group means more reactive, so calcium wins.')
 ]},
 {id:'m2', title:'Naming ionic compounds', sub:'Metal first, then -ide', bites:[
  B('Naming is just a recipe.',
   '<p>A <b>binary ionic compound</b> has two elements: a metal and a non-metal.</p><p>To name it, write the <b>metal’s name</b> first, unchanged. Then write the non-metal with its ending changed to <b>-ide</b>.</p>',
   'What is {NaCl} called?', ['Sodium chlorine','Sodium chloride','Chloride sodium'], 1,
   'Metal name (sodium) + non-metal with -ide (chloride).'),
  B('Learn these endings.',
   '<p>Common -ide names:</p><ul><li>chlorine → chlor<b>ide</b>, fluorine → fluor<b>ide</b></li><li>oxygen → <b>oxide</b>, sulfur → <b>sulfide</b></li><li>nitrogen → <b>nitride</b>, bromine → brom<b>ide</b></li></ul>',
   'What is {MgO} called?', ['Magnesium oxide','Magnesium oxygen','Magnesium oxygenide'], 0,
   'Oxygen becomes oxide, so {MgO} is magnesium oxide.'),
  B('No counting words here.',
   '<p>Ionic names <b>don’t</b> say how many of each ion there are. {CaCl2} is just calcium chloride, not “calcium dichloride”.</p><p>The charges already tell you the ratio.</p>',
   'What is {CaCl2} called?', ['Calcium dichloride','Calcium chlorine','Calcium chloride'], 2,
   'Ionic names skip prefixes. Calcium + chloride.'),
  B('Your turn!',
   '<p>Same recipe: metal name, then non-metal with -ide.</p>',
   'What is {K2S} called?', ['Potassium sulfide','Dipotassium sulfur','Potassium sulfate'], 0,
   'Potassium is the metal and sulfur becomes sulfide. Sulfate is a different ion.')
 ]},
 {id:'m23', title:'Writing ionic formulas', sub:'Balance the charges to zero', bites:[
  B('The big rule.',
   '<p>An ionic compound has <b>no overall charge</b>. The positive and negative charges must add to zero.</p><p>{Na^+} and {Cl^-}: 1+ and 1− cancel, so one of each: {NaCl}.</p>',
   'Why is the formula {NaCl} and not {NaCl2}?', ['Chlorine is bigger','One + and one − already add to zero','Sodium is a metal'], 1,
   'The charges 1+ and 1− cancel with one of each ion.'),
  B('Here’s the criss-cross trick.',
   '<p>Write the ions. Drop the charge numbers (not the signs) and cross them down as subscripts on the <b>other</b> ion.</p><p>{Al^3+} and {O^2-}: the 3 goes to O, the 2 goes to Al. Result: {Al2O3}. Check: 2 × 3+ = 6+, 3 × 2− = 6−.</p>',
   'Using criss-cross, what formula do {Mg^2+} and {Cl^-} make?', ['{MgCl}','{Mg2Cl}','{MgCl2}'], 2,
   'The 2 from magnesium goes to chlorine, the 1 from chloride goes to magnesium (and 1 isn’t written): {MgCl2}.'),
  B('Always simplify.',
   '<p>After crossing, reduce to the lowest ratio.</p><p>{Ca^2+} and {O^2-} cross to {Ca2O2}. Divide both by 2: <b>{CaO}</b>.</p>',
   'What is the formula for magnesium oxide ({Mg^2+}, {O^2-})?', ['{MgO}','{Mg2O2}','{MgO2}'], 0,
   '{Mg2O2} reduces to {MgO}. One 2+ and one 2− already cancel.'),
  B('Try one.',
   '<p>Sodium is group 1, so {Na^+}. Oxygen is group 16, so {O^2-}. Cross the charges.</p>',
   'What is the formula for sodium oxide?', ['{NaO}','{Na2O}','{NaO2}','{Na2O2}'], 1,
   'The 2 from oxide goes to sodium: {Na2O}. Check: 2 × 1+ = 2+, balancing 2−.')
 ]},
 {id:'m24', title:'Multivalent metals', sub:'Roman numerals in names', bites:[
  B('Some metals have options.',
   '<p>Many transition metals can form more than one ion. Iron can be {Fe^2+} or {Fe^3+}. Copper can be {Cu^+} or {Cu^2+}.</p><p>These are called <b>multivalent</b> metals.</p>',
   'Which ions can iron form?', ['Only {Fe^2+}','{Fe^2+} and {Fe^3+}','{Fe^-} and {Fe^2-}'], 1,
   'Iron is multivalent. It commonly forms {Fe^2+} or {Fe^3+}.'),
  B('The name shows the charge.',
   '<p>For a multivalent metal, put the charge in <b>Roman numerals</b> in brackets right after the metal’s name.</p><p>{Fe^2+} is iron(II). {Fe^3+} is iron(III). So {FeCl3} is iron(III) chloride.</p>',
   'What does the (II) in copper(II) oxide mean?', ['Two copper atoms','Copper has a 2+ charge','Two oxygen atoms'], 1,
   'The Roman numeral is the metal’s charge, not a count of atoms.'),
  B('Watch me work backwards.',
   '<p>To name {CuCl2}: chloride is always 1−. There are 2 of them, so 2− total.</p><p>Copper must be 2+ to cancel. Name: <b>copper(II) chloride</b>.</p>',
   'Name {FeO}.', ['Iron oxide','Iron(I) oxide','Iron(II) oxide','Iron(III) oxide'], 2,
   'Oxide is 2−, and there’s one iron, so iron is 2+: iron(II) oxide.'),
  B('Your turn!',
   '<p>Same method. Oxide is 2−. Find the total negative charge, then share it out across the metal atoms.</p>',
   'Name {Fe2O3}.', ['Iron(III) oxide','Iron(II) oxide','Iron(VI) oxide'], 0,
   '3 oxides = 6−. Two irons share 6+, so each is 3+: iron(III) oxide.')
 ]},
 {id:'m25', title:'Polyatomic ions', sub:'Ions made of several atoms', bites:[
  B('Some ions come as a team.',
   '<p>A <b>polyatomic ion</b> is a group of atoms bonded together that carries one overall charge.</p><p>Common ones: nitrate {NO3^-}, hydroxide {OH^-}, sulfate {SO4^2-}, carbonate {CO3^2-}, phosphate {PO4^3-}, ammonium {NH4^+}.</p>',
   'What is the charge on the sulfate ion?', ['1−','2−','3−'], 1,
   'Sulfate is {SO4^2-}, so it carries a 2− charge.'),
  B('Name them like any ion.',
   '<p>Write the positive ion’s name, then the negative ion’s name. Polyatomic names stay as they are, with no -ide change.</p><p>{NaNO3} is sodium nitrate. {NH4Cl} is ammonium chloride.</p>',
   'What is {K2CO3} called?', ['Potassium carbide','Potassium carbonate','Potassium carbon oxide'], 1,
   'K is potassium and {CO3^2-} is carbonate, so it’s potassium carbonate.'),
  B('Brackets keep the team together.',
   '<p>When you need more than one polyatomic ion, put it in brackets with the number outside.</p><p>{Ca^2+} needs two {OH^-}, so calcium hydroxide is {Ca(OH)2}. Writing {CaOH2} would be wrong.</p>',
   'Why is calcium hydroxide written {Ca(OH)2}?', ['It has two calcium ions','It has two hydroxide ions','It has two hydrogen atoms only'], 1,
   'The 2 outside the bracket means two whole {OH^-} ions, balancing the 2+ on calcium.'),
  B('Try one.',
   '<p>Criss-cross still works. {Al^3+} and {SO4^2-}: the 2 goes to Al, the 3 goes to the sulfate bracket.</p>',
   'What is the formula for aluminium sulfate?', ['{AlSO4}','{Al3(SO4)2}','{Al2(SO4)3}'], 2,
   '2 × 3+ = 6+ and 3 × 2− = 6−, so {Al2(SO4)3}.')
 ]},
 {id:'m26', title:'Naming molecular compounds', sub:'Prefixes for non-metal pairs', bites:[
  B('Different rules for non-metals.',
   '<p>Molecular compounds are made of <b>non-metals only</b>. They don’t have charges to balance, so the name has to say how many atoms there are.</p><p>We use <b>prefixes</b>: mono = 1, di = 2, tri = 3, tetra = 4, penta = 5, hexa = 6.</p>',
   'What does the prefix tri- mean?', ['2','3','4'], 1,
   'Tri- means 3, like a tricycle’s three wheels.'),
  B('Here’s how it works.',
   '<p>Name the first element with a prefix, then the second element with a prefix and an -ide ending.</p><p>One exception: don’t use mono- on the <b>first</b> element. {CO2} is carbon dioxide. {CO} is carbon monoxide.</p>',
   'What is {CO2} called?', ['Monocarbon dioxide','Carbon dioxide','Carbon oxide'], 1,
   'One carbon (no mono- on the first element) and two oxygens: carbon dioxide.'),
  B('Watch me do one.',
   '<p>{N2O4}: two nitrogens = <b>di</b>nitrogen. Four oxygens = <b>tetr</b>oxide. (The “a” is dropped before “oxide” so it’s easier to say.)</p><p>Name: dinitrogen tetroxide.</p>',
   'What is {PCl5} called?', ['Phosphorus pentachloride','Monophosphorus pentachlorine','Phosphorus chloride'], 0,
   'One phosphorus (no mono-) and five chlorines (penta-): phosphorus pentachloride.'),
  B('Now go the other way.',
   '<p>The prefixes turn straight into subscripts. Sulfur hexafluoride is 1 S and 6 F: {SF6}.</p>',
   'What is the formula for dinitrogen trioxide?', ['{N3O2}','{NO3}','{N2O3}'], 2,
   'Di = 2 nitrogen, tri = 3 oxygen: {N2O3}.')
 ]},
 {id:'m27', title:'Naming acids', sub:'When hydrogen meets water', bites:[
  B('Acids have their own names.',
   '<p>An <b>acid</b> here is a compound that starts with hydrogen and is dissolved in water, like {HCl} in water.</p><p>When the negative part ends in <b>-ide</b>, the acid is named <b>hydro___ic acid</b>. Chloride gives <b>hydrochloric acid</b>.</p>',
   'What is {HBr} dissolved in water called?', ['Hydrobromic acid','Bromic acid','Hydrogen bromate'], 0,
   'Bromide ends in -ide, so it becomes hydro + brom + ic: hydrobromic acid.'),
  B('Polyatomic ions change too.',
   '<p>When the negative ion ends in <b>-ate</b>, drop “hydro” and change -ate to <b>-ic acid</b>.</p><p>Nitrate {NO3^-} gives {HNO3}, <b>nitric acid</b>. Sulfate gives {H2SO4}, <b>sulfuric acid</b>.</p>',
   'What is {H2CO3} called? (Hint: {CO3^2-} is carbonate.)', ['Hydrocarbonic acid','Carbonic acid','Carbonous acid'], 1,
   'Carbonate ends in -ate, so it becomes carbonic acid. No hydro- for -ate ions.'),
  B('One more ending.',
   '<p>Some ions end in <b>-ite</b>, with one fewer oxygen. Nitrite is {NO2^-}. These become <b>-ous acid</b>.</p><p>So {HNO2} is <b>nitrous acid</b>.</p>',
   'An acid made from an -ite ion ends in…', ['-ic acid','-ide acid','-ous acid'], 2,
   '-ite ions become -ous acids, like nitrite → nitrous acid.'),
  B('Your turn!',
   '<p>Quick summary:</p><ul><li>-ide → hydro___ic acid</li><li>-ate → ___ic acid</li><li>-ite → ___ous acid</li></ul><p>Phosphate is {PO4^3-}.</p>',
   'What is {H3PO4} called?', ['Hydrophosphoric acid','Phosphorous acid','Phosphoric acid'], 2,
   'Phosphate ends in -ate, so the acid is phosphoric acid.')
 ]},
 {id:'m28', title:'Word equations to formulas', sub:'Turning names into symbols', bites:[
  B('Let’s translate a reaction.',
   '<p>A <b>word equation</b> names the reactants and products: hydrogen + oxygen → water.</p><p>To write a <b>formula equation</b>, swap each name for its formula: {H2 + O2 → H2O}.</p>',
   'In “magnesium + oxygen → magnesium oxide”, what is the product?', ['Magnesium','Oxygen','Magnesium oxide'], 2,
   'Products come after the arrow. Here that’s magnesium oxide.'),
  B('Watch out for these seven.',
   '<p>Some elements never exist as single atoms. On their own, they always come in pairs. These are the <b>diatomic elements</b>:</p><p>{H2}, {N2}, {O2}, {F2}, {Cl2}, {Br2}, {I2}</p><p>Other elements on their own are written as one atom, like Na, Mg or Fe.</p>',
   'How do you write chlorine gas on its own?', ['Cl','{Cl2}','{Cl3}'], 1,
   'Chlorine is diatomic, so the element is written {Cl2}.'),
  B('Watch me do one.',
   '<p>sodium + chlorine → sodium chloride</p><ul><li>Sodium alone: Na</li><li>Chlorine is diatomic: {Cl2}</li><li>Sodium chloride: {Na^+} and {Cl^-} make {NaCl}</li></ul><p>Formula equation: {Na + Cl2 → NaCl}. It isn’t balanced yet. That’s the next lesson.</p>',
   'Why is chlorine written {Cl2} on the left but just Cl inside {NaCl}?', ['It’s a mistake','Alone it’s diatomic, but in the compound the charges set the ratio','Chlorine loses an atom'], 1,
   'As an element, chlorine comes in pairs. In a compound, the ratio comes from balancing charges.'),
  B('Your turn!',
   '<p>Use your naming skills plus the diatomic list.</p>',
   'Which is the formula equation for “zinc + oxygen → zinc oxide”? ({Zn^2+}, {O^2-})', ['{Zn + O → ZnO2}','{Zn + O2 → ZnO}','{Zn2 + O2 → Zn2O}'], 1,
   'Zinc is a single atom, oxygen is diatomic, and {Zn^2+} with {O^2-} gives {ZnO}.')
 ]},
 {id:'f4', title:'Balancing equations', sub:'Same atoms on both sides', bites:[
  B('Remember conservation of mass?',
   '<p>Atoms aren’t created or destroyed in a reaction. So a <b>balanced equation</b> has the same number of each kind of atom on both sides.</p><p>{H2 + O2 → H2O} isn’t balanced: 2 O on the left, only 1 on the right.</p>',
   'In {H2 + O2 → H2O}, which atom is unbalanced?', ['Hydrogen','Oxygen'], 1,
   'There are 2 oxygen atoms on the left and only 1 on the right. Hydrogen has 2 on each side.'),
  B('The golden rule.',
   '<p>You balance by adding <b>coefficients</b>, big numbers in front of formulas. A coefficient multiplies the whole formula: 2{H2O} means 4 H and 2 O.</p><p><b>Never change subscripts.</b> That would change the substance itself.</p>',
   'How many hydrogen atoms are in 3{H2O}?', ['2','3','6'], 2,
   'The 3 multiplies everything in {H2O}: 3 × 2 = 6 hydrogen atoms.'),
  B('Watch me balance it.',
   '<ol><li>Put a 2 in front of {H2O} to get 2 O on the right: {H2 + O2 → 2H2O}</li><li>Now the right has 4 H. Put a 2 in front of {H2}: {2H2 + O2 → 2H2O}</li><li>Check: 4 H and 2 O on each side. Done.</li></ol>',
   'In the balanced equation, what is the coefficient on {O2}?', ['1 (not written)','2','4'], 0,
   'The final equation is {2H2 + O2 → 2H2O}. {O2} has a coefficient of 1, which we don’t write.'),
  B('Your turn!',
   '<p>Same steps: count atoms, fix one element at a time with coefficients, then recount.</p><p>Unbalanced: {N2 + H2 → NH3}</p>',
   'Which is balanced?', ['{N2 + H2 → 2NH3}','{N2 + 3H2 → 2NH3}','{N2 + 3H2 → NH3}'], 1,
   '2 N on each side, and 3 × 2 = 6 H on the left matches 2 × 3 = 6 H on the right.'),
  B('A trickier one.',
   '<p>Tip: balance elements that appear in only one place first, and leave lone elements like {O2} for last.</p><p>Unbalanced: {CH4 + O2 → CO2 + H2O}. Carbon is fine. 4 H needs 2{H2O}. Now the right has 4 O, so use 2{O2}.</p>',
   'What is the balanced equation?', ['{CH4 + 2O2 → CO2 + 2H2O}','{CH4 + O2 → CO2 + 2H2O}','{CH4 + 2O2 → 2CO2 + H2O}'], 0,
   'Each side has 1 C, 4 H and 4 O.')
 ]},
 {id:'m29', title:'The five reaction types', sub:'Spotting patterns in reactions', bites:[
  B('Most reactions fit a pattern.',
   '<p><b>Synthesis</b>: two or more substances join into one. A + B → AB.</p><p>Example: {2Mg + O2 → 2MgO}</p>',
   'Which is a synthesis reaction?', ['{2Na + Cl2 → 2NaCl}','{2H2O → 2H2 + O2}','{CH4 + 2O2 → CO2 + 2H2O}'], 0,
   'Two elements join to make one product, {NaCl}. That’s synthesis.'),
  B('Now the reverse.',
   '<p><b>Decomposition</b>: one substance breaks into two or more. AB → A + B.</p><p>Example: running electricity through water: {2H2O → 2H2 + O2}</p>',
   'How many reactants does a decomposition reaction have?', ['One','Two','Three'], 0,
   'Decomposition starts with a single compound that breaks apart.'),
  B('Swapping partners.',
   '<p><b>Single displacement</b>: an element replaces another element in a compound. A + BC → AC + B.</p><p>Example: {Zn + CuSO4 → ZnSO4 + Cu}. Zinc kicks copper out.</p>',
   'In {Fe + CuCl2 → FeCl2 + Cu}, what does iron do?', ['Decomposes','Replaces copper','Combines with copper'], 1,
   'Iron takes copper’s place with the chloride. That’s single displacement.'),
  B('Two compounds trade.',
   '<p><b>Double displacement</b>: two compounds swap partners. AB + CD → AD + CB.</p><p>Example: {AgNO3 + NaCl → AgCl + NaNO3}. Often one product is a solid that falls out, called a <b>precipitate</b>.</p>',
   'Which pattern is double displacement?', ['A + B → AB','AB + CD → AD + CB','A + BC → AC + B'], 1,
   'Two compounds trade positive ions, giving AD + CB.'),
  B('Last one: burning.',
   '<p><b>Combustion</b>: a fuel reacts with oxygen. When the fuel is a hydrocarbon (only C and H), the products are {CO2} and {H2O}.</p><p>Example: the natural gas in a furnace: {CH4 + 2O2 → CO2 + 2H2O}</p>',
   'What are the products of burning propane, {C3H8}, in plenty of oxygen?', ['{CO2} and {H2O}','{C} and {H2}','{CO2} and {H2}'], 0,
   'Propane is a hydrocarbon, so its complete combustion makes carbon dioxide and water.')
 ]},
 {id:'m3', title:'The activity series', sub:'Predicting single displacement', bites:[
  B('Who wins the swap?',
   '<p>A single displacement only happens if the free element is <b>more reactive</b> than the one it’s replacing.</p><p>The <b>activity series</b> ranks metals from most to least reactive:</p><p>Li, K, Ca, Na, Mg, Al, Zn, Fe, Ni, Sn, Pb, <b>H</b>, Cu, Ag, Au</p>',
   'Which is more reactive, zinc or copper?', ['Copper','Zinc'], 1,
   'Zinc is higher in the activity series than copper.'),
  B('Here’s the rule.',
   '<p>A metal can replace any metal <b>below</b> it in the series.</p><p>Zinc is above copper, so {Zn + CuSO4 → ZnSO4 + Cu} happens. Copper is below zinc, so copper in zinc sulfate gives <b>no reaction</b>.</p>',
   'Will silver react with copper(II) nitrate?', ['Yes, silver replaces copper','No reaction','Only in sunlight'], 1,
   'Silver is below copper, so it can’t push copper out.'),
  B('Hydrogen is the checkpoint.',
   '<p>Metals <b>above hydrogen</b> react with acids and release hydrogen gas: {Mg + 2HCl → MgCl2 + H2}.</p><p>Metals below hydrogen, like copper, silver and gold, don’t react with ordinary acids. That’s one reason they’re used for coins and jewellery.</p>',
   'Which metal will NOT react with hydrochloric acid?', ['Zinc','Iron','Gold','Magnesium'], 2,
   'Gold is below hydrogen in the activity series, so it doesn’t displace hydrogen from acid.'),
  B('Halogens have a ladder too.',
   '<p>For non-metals: {F2} > {Cl2} > {Br2} > {I2}. A halogen replaces any halide below it.</p><p>{Cl2 + 2NaBr → 2NaCl + Br2} works. Iodine added to sodium chloride does nothing.</p>',
   'Will bromine react with sodium iodide?', ['Yes','No'], 0,
   'Bromine is above iodine, so it replaces iodide: {Br2 + 2NaI → 2NaBr + I2}.')
 ]},
 {id:'m4', title:'Flame tests', sub:'Identifying metals by colour', bites:[
  B('Chemistry that glows.',
   '<p><b>Qualitative analysis</b> means figuring out <i>what</i> is in a sample, not how much.</p><p>A <b>flame test</b> is one way: put a little of the sample in a flame and watch the colour. Each metal ion gives its own colour.</p>',
   'Qualitative analysis tells you…', ['how much of a substance there is','what substance is present','how hot a flame is'], 1,
   'Qualitative is about identity. Quantitative is about amounts.'),
  B('Why the colours appear.',
   '<p>The flame’s heat makes electrons jump up to higher energy levels. When they fall back down, they give off that energy as light.</p><p>Each element has its own energy levels, so each gives a specific colour.</p>',
   'What releases the light in a flame test?', ['Electrons falling back to lower energy levels','Protons leaving the nucleus','The atoms melting'], 0,
   'Excited electrons drop back down and release light of a specific colour.'),
  B('Learn these colours.',
   '<ul><li>Lithium {Li^+}: red</li><li>Sodium {Na^+}: bright yellow</li><li>Potassium {K^+}: lilac</li><li>Calcium {Ca^2+}: orange-red</li><li>Strontium {Sr^2+}: crimson</li><li>Barium {Ba^2+}: pale green</li><li>Copper {Cu^2+}: blue-green</li></ul>',
   'A sample burns bright yellow. Which ion is likely present?', ['{K^+}','{Cu^2+}','{Na^+}'], 2,
   'Sodium gives a strong bright yellow flame.'),
  B('Your turn!',
   '<p>Fireworks use these same metal ions to make their colours. Red fireworks often use strontium. Green ones use barium.</p>',
   'A sample gives a blue-green flame. Which ion is it?', ['{Sr^2+}','{Cu^2+}','{Li^+}'], 1,
   'Copper ions give a blue-green flame.')
 ]},
 {id:'m30', title:'Precipitate and gas tests', sub:'More clues for unknowns', bites:[
  B('Look for a cloudy solid.',
   '<p>A <b>precipitate</b> is a solid that forms when two solutions are mixed. Its appearance is a clue to which ions are present.</p><p>Add silver nitrate to a solution with chloride ions and a <b>white precipitate</b> of silver chloride forms.</p>',
   'Silver nitrate gives a white precipitate. Which ion is likely in the sample?', ['Chloride','Sodium','Potassium'], 0,
   '{Ag^+} and {Cl^-} form solid white silver chloride.'),
  B('A test for sulfate.',
   '<p>Add barium chloride to a solution with sulfate ions. A <b>white precipitate</b> of barium sulfate, {BaSO4}, forms.</p>',
   'Which reagent tests for sulfate ions?', ['Silver nitrate','Barium chloride','Limewater'], 1,
   '{Ba^2+} from barium chloride joins {SO4^2-} to form white {BaSO4}.'),
  B('Now the gas tests.',
   '<ul><li><b>Hydrogen</b>: a burning splint makes a squeaky <b>pop</b>.</li><li><b>Oxygen</b>: a glowing splint <b>relights</b>.</li><li><b>Carbon dioxide</b>: turns <b>limewater cloudy</b>.</li></ul>',
   'A gas makes a glowing splint burst back into flame. What gas is it?', ['Hydrogen','Carbon dioxide','Oxygen'], 2,
   'Oxygen helps things burn, so it relights a glowing splint.'),
  B('Put the clues together.',
   '<p>A metal is dropped in acid and bubbles form. A burning splint held at the mouth of the tube gives a pop.</p>',
   'What gas was made?', ['Oxygen','Hydrogen','Carbon dioxide'], 1,
   'The pop test identifies hydrogen. Metals above hydrogen in the activity series release it from acids.'),
  B('One more.',
   '<p>Breathe out through a straw into limewater, and the limewater goes milky. That tells you your breath contains a certain gas.</p>',
   'Which gas is in your breath that turns limewater cloudy?', ['Carbon dioxide','Hydrogen','Oxygen'], 0,
   'Carbon dioxide turns limewater cloudy. You breathe it out as a waste product.')
 ]}
]};

const UNIT_K = {name:'Chemical Calculations', lessons:[
 {id:'k20', title:'Significant figures', sub:'Just enough rounding for this course', bites:[
   B('Let’s start with the digits that matter.',
     '<p><b>Significant figures</b> (sig figs) are the digits in a measurement that carry real meaning.</p><p>Rule 1: every non-zero digit counts. Rule 2: zeros <i>between</i> non-zero digits count. So 12.01 has 4 sig figs and 305 has 3.</p>',
     'How many significant figures are in 305?', ['1','2','3'], 2,
     'The 3 and 5 count, and the zero between them counts too. That makes 3.'),
   B('Now the tricky zeros.',
     '<p>Rule 3: zeros at the <b>front</b> never count. They just hold the decimal place.</p><p>Rule 4: zeros at the <b>end, after a decimal point</b>, do count. So 0.050 has 2 sig figs: the 5 and the last 0.</p>',
     'How many significant figures are in 0.0250?', ['2','3','4'], 1,
     'The front zeros don’t count. The 2, the 5 and the final 0 (after the decimal) do. That’s 3.'),
   B('Rounding is quick.',
     '<p>To round, look at the digit just after the place you’re keeping. If it’s <b>5 or more</b>, round up. If it’s 4 or less, leave it.</p><p>Example: 18.016 to two decimal places. The next digit is 6, so it becomes 18.02.</p>',
     'Round 27.29 to one decimal place.', ['27.2','27.3','27.0'], 1,
     'The digit after the 2 is a 9, which is 5 or more, so the 2 rounds up to 3: 27.3.'),
   B('Here’s the one rule you’ll use most.',
     '<p>When you multiply or divide, give the answer the same number of sig figs as the measurement with the <b>fewest</b>.</p><p>Example: 36.0 ÷ 18.02 = 1.99778… The 36.0 has only 3 sig figs, so the answer is <b>2.00</b>. In this unit, most answers end up with 3 sig figs.</p>',
     'Give 10.0 ÷ 3.00 = 3.3333… with the right number of sig figs.', ['3.3','3.33','3.333'], 1,
     'Both numbers have 3 sig figs, so the answer gets 3: 3.33.')
 ]},
 {id:'k21', title:'What is a mole?', sub:'A counting word for tiny things', bites:[
   B('You already use counting words.',
     '<p>A <b>dozen</b> means 12 of anything: 12 eggs, 12 donuts, 12 pencils. It’s just a handy word for a number.</p><p>Chemists have their own counting word for atoms and molecules. It’s called the <b>mole</b>.</p>',
     'How many eggs are in 2 dozen?', ['12','24','14'], 1,
     'One dozen is 12, so 2 dozen is 2 × 12 = 24.'),
   B('Here’s the big number.',
     '<p>One <b>mole</b> (symbol <b>mol</b>) is 6.02 × 10<sup>23</sup> particles.</p><p>This number is called <b>Avogadro’s number</b>. Written out, it’s 602 000 000 000 000 000 000 000.</p>',
     'How many particles are in 1 mol?', ['12','6.02 × 10²³','6.02 × 10³'], 1,
     'One mole is always 6.02 × 10²³ particles. That’s Avogadro’s number.'),
   B('Why so huge?',
     '<p>Atoms are unbelievably small. You need a gigantic number of them to get an amount you can see or weigh.</p><p>One mole of water molecules is only about 18 g, roughly a big mouthful.</p>',
     'Why do chemists count in such a huge unit?', ['Atoms are extremely tiny','Atoms are very heavy','Scientists like big numbers'], 0,
     'Atoms are so small that even a sip of water holds trillions of trillions of them.'),
   B('A mole works like a dozen.',
     '<p>A mole can count any particle: atoms, molecules or ions. 1 mol of {CO2} is 6.02 × 10<sup>23</sup> molecules of {CO2}.</p><p>Like dozens, moles scale. 2 mol is twice as many particles. 0.5 mol is half as many.</p>',
     'How many atoms are in half a mole (0.5 mol) of carbon?', ['3.01 × 10²³','6.02 × 10²³','12.04 × 10²³'], 0,
     'Half of 6.02 × 10²³ is 3.01 × 10²³.')
 ]},
 {id:'k22', title:'Molar mass of an element', sub:'Reading it off the periodic table', bites:[
   B('The periodic table does the work.',
     '<p>Each box on the periodic table shows the element’s atomic mass. Carbon’s is 12.01.</p><p>That same number, in grams, is the mass of <b>one mole</b> of that element. This is the <b>molar mass</b>, with the unit <b>g/mol</b>. So carbon’s molar mass is 12.01 g/mol.</p>',
     'What is the molar mass of carbon?', ['6.02 g/mol','12.01 g/mol','1.00 g/mol'], 1,
     'Carbon’s atomic mass is 12.01, so 1 mol of carbon has a mass of 12.01 g.'),
   B('Every element is different.',
     '<p>Atoms of different elements have different masses, so a mole of each one weighs a different amount.</p><p>1 mol of sodium (Na) = 22.99 g.<br>1 mol of copper (Cu) = 63.55 g.</p><p>Both contain 6.02 × 10<sup>23</sup> atoms. Copper atoms are just heavier.</p>',
     'Which has more mass: 1 mol of Na or 1 mol of Cu?', ['1 mol of Na','They’re equal','1 mol of Cu'], 2,
     'Same number of atoms, but copper atoms are heavier: 63.55 g vs 22.99 g.'),
   B('Your turn!',
     '<p>Here are some values from the periodic table:</p><ul><li>O: 16.00</li><li>Mg: 24.31</li><li>Ca: 40.08</li></ul><p>Remember: molar mass = atomic mass, in g/mol.</p>',
     'What is the mass of 1 mol of calcium (Ca)?', ['24.31 g','16.00 g','40.08 g'], 2,
     'Calcium’s atomic mass is 40.08, so 1 mol has a mass of 40.08 g.')
 ]},
 {id:'f3', title:'Molar mass of a compound', sub:'Add up every atom in the formula', bites:[
   B('Watch me do one.',
     '<p>For a compound, add up the molar masses of <b>every atom</b> in the formula.</p><p>Water, {H2O}, has 2 H and 1 O:<br>2 × 1.01 = 2.02<br>1 × 16.00 = 16.00<br>2.02 + 16.00 = <b>18.02 g/mol</b></p>',
     'What is the molar mass of {H2O}?', ['17.01 g/mol','18.02 g/mol','16.00 g/mol'], 1,
     'Two hydrogens (2 × 1.01 = 2.02) plus one oxygen (16.00) gives 18.02 g/mol.'),
   B('The subscript is your multiplier.',
     '<p>A small number after a symbol tells you how many of that atom there are. No number means 1.</p><p>{CO2} has 1 C and 2 O:<br>1 × 12.01 = 12.01<br>2 × 16.00 = 32.00<br>12.01 + 32.00 = <b>44.01 g/mol</b></p>',
     'When finding the molar mass of {CO2}, what do you multiply oxygen’s 16.00 by?', ['1','2','3'], 1,
     'The subscript 2 means there are two oxygen atoms, so you use 2 × 16.00.'),
   B('Brackets multiply everything inside.',
     '<p>In {Ca(OH)2}, the 2 outside the bracket doubles the O and the H. So there’s 1 Ca, 2 O and 2 H.</p><p>40.08 + 2(16.00) + 2(1.01)<br>= 40.08 + 32.00 + 2.02<br>= <b>74.10 g/mol</b></p>',
     'How many hydrogen atoms are in {Ca(OH)2}?', ['1','2','4'], 1,
     'The 2 outside the bracket doubles the OH group, so there are 2 H atoms.'),
   B('Your turn!',
     '<p>Find the molar mass of table salt, {NaCl}.</p><p>Use Na = 22.99 and Cl = 35.45. There’s one of each, so just add them.</p>',
     'What is the molar mass of {NaCl}?', ['58.44 g/mol','57.44 g/mol','12.54 g/mol'], 0,
